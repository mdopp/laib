domain: example.home
timezone: Europe/Berlin
zuhause:                      # a fictitious household (#561)
  street: Musterweg 12
  postcode: "12345"
  city: Musterstadt
  country: DE
  latitude: 52.1234
  longitude: 8.0456
dataDir: /mnt/data/stacks
lanIp: 192.168.1.10
hostNetwork: [caddy]
notify:
  url: http://127.0.0.1:8787/api/laib-events
roles:
  proxy: caddy
  sso: auth
  identity: auth
gpu:
  present: false
dns:
  provider: desec
  secretRef: DNS_API_TOKEN
  challengeAlias: example-acme.dedyn.io   # _acme-challenge.example.home is a CNAME to it (#378)
backup:
  repo: sftp:nas:/backup/laib
  schedule: "03:30"
updates:
  days: [Sat, Sun]
  time: "03:00"
