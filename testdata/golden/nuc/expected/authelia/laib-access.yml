# Rendered by laib: every access rule. Anything unlisted, the bare apex
# included, is denied.
access_control:
  default_policy: deny
  rules:
    - domain: laib.nuc.home
      policy: two_factor
      subject: "group:admins"
    - domain: dns.nuc.home
      policy: two_factor
      subject: "group:admins"
    - domain: auth.nuc.home
      policy: bypass
    - domain: ldap.nuc.home
      policy: two_factor
      subject: "group:admins"
    - domain: whoami.nuc.home
      policy: bypass
      resources: ["^/napi/.*$"]
    - domain: whoami.nuc.home
      policy: one_factor
      networks: ["192.168.0.0/16", "172.16.0.0/12", "10.0.0.0/8", "127.0.0.0/8", "fd00::/8", "::1/128"]
      subject: ["group:family", "group:admins"]
    - domain: whoami.nuc.home
      policy: two_factor
      subject: ["group:family", "group:admins"]
