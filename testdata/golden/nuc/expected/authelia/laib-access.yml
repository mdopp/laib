# Rendered by laib: one rule per route. The apex deny and the wildcard
# default live in the auth service's own config.
access_control:
  rules:
    - domain: laib.nuc.home
      policy: one_factor
      subject: "group:admins"
    - domain: dns.nuc.home
      policy: two_factor
      subject: "group:admins"
    - domain: auth.nuc.home
      policy: bypass
    - domain: ldap.nuc.home
      policy: two_factor
      subject: "group:admins"
    - domain: whoami.nuc.home
      policy: bypass
      resources: ["^/napi/.*$"]
    - domain: whoami.nuc.home
      policy: one_factor
      subject: "group:family"
