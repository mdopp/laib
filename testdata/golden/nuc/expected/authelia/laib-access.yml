# Rendered by laib: every access rule. Anything unlisted, the bare apex
# included, is denied.
access_control:
  default_policy: deny
  rules:
    - domain: laib.nuc.home
      policy: one_factor
      subject: "group:admins"
    - domain: dns.nuc.home
      policy: two_factor
      subject: "group:admins"
    - domain: auth.nuc.home
      policy: bypass
    - domain: ldap.nuc.home
      policy: two_factor
      subject: "group:admins"
    - domain: whoami.nuc.home
      policy: bypass
      resources: ["^/napi/.*$"]
    - domain: whoami.nuc.home
      policy: one_factor
      subject: ["group:family", "group:admins"]
