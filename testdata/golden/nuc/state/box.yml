domain: nuc.home
timezone: Europe/Berlin
dataDir: /mnt/data/stacks
lanIp: 192.168.1.10
tls: internal                  # the trial box: port 80 of the house goes to the Kraftwerk, so Caddy signs itself
hostNetwork: [caddy, adguard]
notify:
  url: http://127.0.0.1:8787/api/laib-events
roles:
  proxy: caddy
  sso: auth
  identity: auth
  dns: adguard
gpu:
  present: false
model:
  url: http://192.168.1.20:11435/v1
  lease: http://192.168.1.20:11435/api/model-lease
operator:
  enabled: true
  reportAt: "06:30"
  tick: 5m
dns:
  provider: cloudflare
  secretRef: DNS_API_TOKEN
backup:
  repo: sftp:nas:/backup/laib
  schedule: "03:30"
updates:
  days: [Sat, Sun]
  time: "03:00"
