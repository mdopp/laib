# The Werkstatt's sessions are made headless at start (werkstatt-sessions,
# #383): without a size tmux gives them 80x24 and Claude Code draws at 80
# columns. A client that attaches resizes them; its size always wins.
set -g default-size 250x60
# A session that dies with an error keeps its window, so a checkout with a
# failed start is visible instead of looking like one that never had one.
set -wg remain-on-exit failed
