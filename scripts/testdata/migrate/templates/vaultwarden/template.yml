apiVersion: v1
kind: Pod
metadata:
  name: vaultwarden
  annotations:
    servicebay.schema-version: "1"
    servicebay.backup: |
      include:
        - db.sqlite3
spec:
  containers:
  - name: vaultwarden
    image: example.invalid/app:1
  volumes:
  - name: v0
    hostPath:
      path: {{DATA_DIR}}/vaultwarden
      type: DirectoryOrCreate
