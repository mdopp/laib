apiVersion: v1
kind: Pod
metadata:
  name: home-assistant
  annotations:
    servicebay.schema-version: "1"
    servicebay.backup: |
      dataSubdir: home-assistant/homeassistant
      include:
        - configuration.yaml
spec:
  containers:
  - name: home-assistant
    image: example.invalid/app:1
  volumes:
  - name: v0
    hostPath:
      path: {{DATA_DIR}}/home-assistant/homeassistant
      type: DirectoryOrCreate
  - name: v1
    hostPath:
      path: {{DATA_DIR}}/home-assistant/zwave-js
      type: DirectoryOrCreate
  - name: v2
    hostPath:
      path: {{DATA_DIR}}/home-assistant/matter-server
      type: DirectoryOrCreate
  - name: v3
    hostPath:
      path: /run/dbus
      type: DirectoryOrCreate
  - name: v4
    hostPath:
      path: {{ZWAVE_DEVICE}}
      type: DirectoryOrCreate
