apiVersion: v1
kind: Pod
metadata:
  name: immich
  annotations:
    servicebay.schema-version: "1"
    servicebay.backup: |
      backup: none
      reason: bulk
spec:
  containers:
  - name: immich
    image: example.invalid/app:1
  volumes:
  - name: v0
    hostPath:
      path: {{DATA_DIR}}/immich/upload
      type: DirectoryOrCreate
  - name: v1
    hostPath:
      path: {{DATA_DIR}}/file-share/data
      type: DirectoryOrCreate
  - name: v2
    hostPath:
      path: {{DATA_DIR}}/immich/model-cache
      type: DirectoryOrCreate
  - name: v3
    hostPath:
      path: {{DATA_DIR}}/immich/pgdata
      type: DirectoryOrCreate
