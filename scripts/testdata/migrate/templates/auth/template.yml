apiVersion: v1
kind: Pod
metadata:
  name: auth
  annotations:
    servicebay.schema-version: "1"
spec:
  containers:
  - name: auth
    image: example.invalid/app:1
  volumes:
  - name: v0
    hostPath:
      path: {{DATA_DIR}}/auth/lldap
      type: DirectoryOrCreate
  - name: v1
    hostPath:
      path: {{DATA_DIR}}/auth/authelia-config
      type: DirectoryOrCreate
  - name: v2
    hostPath:
      path: {{DATA_DIR}}/auth/authelia-data
      type: DirectoryOrCreate
