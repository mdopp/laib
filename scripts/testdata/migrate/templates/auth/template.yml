apiVersion: v1
kind: Pod
metadata:
  name: auth
  annotations:
    servicebay.schema-version: "1"
spec:
  containers:
  - name: lldap
    image: docker.io/lldap/lldap:latest
  - name: authelia
    image: docker.io/authelia/authelia:4
  volumes:
  - name: v0
    hostPath:
      path: {{DATA_DIR}}/auth/lldap
      type: DirectoryOrCreate
  - name: v1
    hostPath:
      path: {{DATA_DIR}}/auth/authelia-config
      type: DirectoryOrCreate
  - name: v2
    hostPath:
      path: {{DATA_DIR}}/auth/authelia-data
      type: DirectoryOrCreate
