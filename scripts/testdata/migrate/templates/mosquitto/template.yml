# shaped like ServiceBay's templates/mosquitto (made-up box)
apiVersion: v1
kind: Pod
metadata:
  name: mosquitto
spec:
  containers:
    - name: mosquitto
      image: docker.io/library/eclipse-mosquitto:2
      ports:
        - containerPort: 1883
          hostPort: {{MQTT_PORT}}
      volumeMounts:
        - mountPath: /mosquitto/data
          name: data
  volumes:
    - name: data
      hostPath:
        path: {{DATA_DIR}}/mosquitto/data
