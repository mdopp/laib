# The hand-written half of docs/C4.md (owner, 2026-11-15: „Die sollten Teil
# der Dokumentation sein. Und die Aktualisierung Teil der Pipeline.“).
# scripts/c4.sh puts it together with what it reads from the code:
# templates/*/laib.yml, internal/, cmd/laib, scripts/loc.sh. Edit this file
# for words and placements, never docs/C4.md; then run scripts/c4.sh.
#
# Facts against judgment: the diagrams' nodes and edges, the lines and the
# tables are facts, the generator's. What stands here is judgment: where a
# service belongs, what a part is for, the context and the data map.

einleitung: >-
  Was Laib kann und wie es mit den Diensten, der Familie und der Außenwelt
  zusammenhängt, von außen nach innen: Umfeld, Dienste der Box, Laibs Kern,
  Fähigkeiten. Die Schichten und Ringe sind ADR 0035: Schicht 0 ist Laib
  (Ring 0a der Kern, Ring 0b Laibs Helfer), Schicht 1 die Bausteine,
  Schicht 2 der Mehrwert; Abhängigkeiten zeigen nur nach unten.

kontext:
  text: >-
    Laib ändert die Box nur über Freigaben. Agenten, auch Claude, schlagen
    vor und gehen in private Daten nur mit einer Einblick-Karte (ADR 0032).
  mermaid: |
    flowchart LR
      classDef person fill:#2f6f4f,stroke:#2f6f4f,color:#fff
      classDef sys fill:#1f4d38,stroke:#1f4d38,color:#fff
      classDef ext fill:#8a918c,stroke:#8a918c,color:#fff
      owner(["Besitzer / Admin<br/>gibt frei, trägt Schlüssel ein"]):::person
      family(["Familie<br/>Homes, App, Signal, Sprache"]):::person
      guests(["Gäste<br/>Einladungslinks, geteilte Alben"]):::person
      box["Laib-Box<br/>Heimserver: Dienste, Daten,<br/>Kern, Agenten"]:::sys
      github["GitHub<br/>Repos, CI, Images, Signaturen"]:::ext
      le["Let's Encrypt<br/>Zertifikate"]:::ext
      dns["DNS-Anbieter<br/>Einträge der Domain"]:::ext
      fritz["Router<br/>Internet, Heimnetz, mDNS"]:::ext
      claude["Claude in der Werkstatt<br/>baut, schlägt vor"]:::ext
      devices["Geräte im Haus<br/>Lautsprecher, Drucker, Sensoren"]:::ext
      owner -->|"Eingang, Schlüssel, Einblicke"| box
      family -->|"www, App, Signal, Hey Mycroft"| box
      guests -->|"fotos, abstimmung, kontakt"| box
      box -->|"Code, Images, Signaturen"| github
      box -->|"ACME"| le
      dns -->|"Name → Hausanschluss"| fritz
      fritz --> box
      claude -->|"laib propose / MCP"| box
      box <-->|"IPP, MQTT, Z-Wave, Cast"| devices

# Every template's layer (ADR 0035). A template missing here, or a name here
# without its template, fails scripts/c4.sh: a new service is placed first.
schichten:
  adguard: 0
  archiv: 2
  audiobookshelf: 1
  auth: 0
  beets: 1
  bote: 2
  caddy: 0
  druck: 1
  esphome: 1
  file-share: 1
  frage: 2
  home-assistant: 1
  homes: 2
  immich: 1
  immich-public-proxy: 1
  kalender: 2
  llama: 1
  media: 1
  mosquitto: 1
  music-assistant: 1
  paperless: 1
  radicale: 1
  reitti: 1
  scan: 2
  stimme: 1
  usage-metrics: 1
  vaultwarden: 1
