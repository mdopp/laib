  internal/token: {titel: Token, text: "ausgeben, nachschlagen, widerrufen"}

# The programs scripts/loc.sh budgets beside the kernel. ring: host (beside
# laib on the host), helfer (ring 0b: a container with its own token, no age
# key, no state repo), vorlage (part of a template's service: vorlage names
# it), laptop, blatt (a shared leaf), werkzeug (a tool of the repo, CI). A
# program missing here fails.
programme:
  operator: {ring: helfer, titel: Operator, text: "lokales Modell als Hand ops: Vorfälle, Morgenbericht"}
  notify: {ring: helfer, titel: Notify, text: "Nachrichten an den Besitzer"}
  haushalt: {ring: helfer, titel: Haushalt, text: "die Haushalts-Verben hinter der Tür"}
  lease: {ring: helfer, titel: Lease, text: "wer die GPU hält, Policy-Proxy des Modells"}
  updater: {ring: helfer, titel: Updater, text: "fragt Register und Änderungsnotizen, ohne Schlüssel und Token; der Kern prüft selbst"}
  disk: {ring: host, titel: laib-disk, text: "Platten, RAID, Auslastung"}
  frage: {ring: vorlage, vorlage: frage, titel: Frage}
  automat: {ring: vorlage, vorlage: bote, titel: Automat}
  directory: {ring: vorlage, vorlage: bote, titel: Verzeichnis}
  mcpserver: {ring: blatt, titel: MCP-Server}
  atomicfile: {ring: blatt, titel: atomicfile}
  stick: {ring: laptop, titel: laib-stick}
  c4: {ring: werkzeug, titel: c4, text: "erzeugt diese Seiten, in CI"}

daten:
  text: >-
    Die Dienste mit den Daten der Familie und die Wege zwischen ihnen, wie
    `docs/DATA.md` sie festhält (Besitz, Konten, Schlüssel). Ein
    durchgezogener Pfeil schreibt, ein gestrichelter liest nur. Alles im
    „Tresor“ gibt es nur, solange das Archiv der Person offen ist.
  mermaid: |
    flowchart LR
      person(["Person<br/>(ein Mensch des Haushalts)"])
      handy["Homes-App<br/>auf ihrem Handy"]
      subgraph homesbox["Homes (gemeinsamer Stand des Haushalts)"]
        homes["Homes<br/>Seiten · /napi · /intern/uebernahme"]
      end
      subgraph radicale["Radicale"]
        hb[("homes/haushalt-kontakte<br/>Haushalts-Adressbuch")]
        pb[("#lt;person#gt;/handy-kontakte<br/>Spiegel des Handys")]
      end
      subgraph paperless["Paperless"]
        pdocs[("Dokumente<br/>je Besitzer, geteilt per Recht")]
      end
      immich[("Immich<br/>Fotos, Gesichter")]
      subgraph archivbox["archiv-#lt;person#gt;"]
        brief[("Briefkasten<br/>age-verschlüsselt")]
        subgraph tresor["Tresor (gocryptfs), nur offen"]
          mv[("msgvault<br/>Signal · WhatsApp · SMS · Mail")]
          umfeld["Umfeld<br/>Steht nahe · Fragen · Ableitungen"]
          antw[("Antworten<br/>umfeld/antworten.json")]
        end
      end
      person -->|"tippt"| homes
      person -->|"öffnet mit Passwort,<br/>beantwortet Fragen"| umfeld
      handy -->|"alle Kontakte (Spiegel)"| homes
      homes -->|"schreibt als Konto homes"| pb
      homes -->|"schreibt"| hb
      homes -.->|"liest als Nur-Lese-Konto homes:<br/>nur geteilte Dokumente"| pdocs
      homes -->|"Änderungen fürs Handy:<br/>Beziehung, neuer Kontakt"| handy
      handy -->|"Sicherungen, SMS"| homes
      homes -->|"Eingang"| brief
      brief -->|"beim Öffnen einsortiert"| mv
      pb -.->|"Login archiv-#lt;person#gt;, nur lesen"| umfeld
      hb -.->|"nur lesen"| umfeld
      immich -.->|"eigener Schlüssel der Person,<br/>im Tresor"| umfeld
      mv -.->|"Gruppen-Chats ≤ 30,<br/>Mail-Verläufe ≤ 10"| umfeld
      umfeld -->|"speichert"| antw
      umfeld -->|"ein Tipp: POST /intern/uebernahme<br/>signiert, je Person, 2 min, Nonce"| homes
  regeln:
    - Eine Haushaltskarte nennt nur Haushaltskontakte (per UID); eine Beziehung mit dem eigenen Handy-Kontakt der Person geht nur auf ihr Handy.
    - Nichts, was das Archiv berechnet, verlässt den Tresor, außer was die Person mit einem Tipp schreibt; ein geschlossener Tresor rechnet nichts.
    - Homes liest Paperless mit seinem eigenen Nur-Lese-Konto `homes`, nie mit dem Token einer Person; es sieht nur, was mit ihm geteilt ist.
    - "`/intern/uebernahme` ist Homes' eigener Port auf der Box, nie über Caddy erreichbar; eine Anfrage mit Proxy-Kopfzeilen wird abgelehnt."

ablauf:
  titel: "„Paperless für die Familie, nur intern“"
  mermaid: |
    sequenceDiagram
      autonumber
      actor A as Admin
      participant S as Bote (Hand bote)
      participant L as Laib
      participant B as Box-Seite (Authelia)
      participant Q as systemd/Quadlet
      A->>S: "Ich hätte gern Paperless für die Familie, nur intern."
      S->>A: eine Rückfrage (Gruppe family? intern?)
      S->>L: laib_propose --add paperless exposure=internal group=family
      L->>L: Worktree: Vorlage kopieren, laden, rendern
      L-->>S: Vorschlag #17 (Diff)
      L-->>A: über den Boten: „Freigabe #17 … · Link auf laib.#lt;domain#gt;/inbox“
      A->>B: Freigeben (Remote-User, X-Laib-Proxy)
      B->>L: approve #17 als human:admin
      L->>L: merge · Snapshot · render · write
      L->>Q: daemon-reload · restart paperless
      Q-->>L: active · health 200 · Route antwortet
      L->>L: post-deploy Hook (Admin-User anlegen)
      L->>L: Journal: apply grün
      A->>S: "Läuft es?"
      S->>L: laib_status paperless
      S->>A: "Läuft unter paperless.#lt;domain#gt;, SSO ist drauf."

faehigkeiten:
  - titel: Ändern, nur mit Freigabe
    punkte:
      - Vorschlag als Karte, Freigabe durch einen Menschen
      - Snapshot vor jedem Apply, rotes Ergebnis → zurück
      - Karten können auf andere Karten oder Aufgaben warten
      - eine rote Karte nimmt nur sich selbst zurück
  - titel: Aktuell bleiben
    punkte:
      - Images per Prüfsumme festgehalten, neue als Karte
      - eigene Images nur mit CI-Signatur
      - Laib-Updates signiert geprüft
      - Vorlagen aus den Registries
  - titel: Selbst gesund bleiben
    punkte:
      - Converge bringt Abweichungen zurück
      - Diag mit Befunden und Reparatur-Vorschlägen
      - "Operator: Routineblick, Vorfälle, „Durchgang rot“"
      - Nachricht nach 10 Minuten rot, Helfer nur gelb
  - titel: Schützen
    punkte:
      - Hände mit Stufen und Eingriffsbudget je Stunde
      - private Dienste nur mit Einblick-Karte, Archiv versiegelt
      - Secrets in age, nie im Repo
      - öffentliche Adressen nur mit Freigabe
      - "das ganze Konzept: [`docs/SICHERHEIT.md`](SICHERHEIT.md)"
  - titel: Sichern
    punkte:
      - restic jede Nacht, mit Wiederherstellungsprobe
      - noch keine Kopie außer Haus (#1128)
  - titel: Agenten tragen
    punkte:
      - Werkstatt mit Claude Code und pi
      - MCP aus den CLI-Verben erzeugt
      - "`laib context` als Einstieg"
      - "Abläufe: Versprechen mit Tests (`docs/ABLAEUFE.md`)"
