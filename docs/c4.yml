# The kernel's packages, all ring 0a (ADR 0035). zieht: what ADR 0035 moves
# to ring 0b, with its issue; it shows until the issue's PR moved it.
kern:
  cmd/laib:
    titel: Verben
    text: das eine Binary, CLI und Daemon, die Verb-Tabelle
    zieht: {nach: Haushalt, was: "laib calendar, person, aufgabe", issue: "1234"}
  internal/apply: {titel: Apply, text: "Sperre, Snapshot, Schreiben, Neustart, Prüfen, Zurück"}
  internal/aufgaben: {titel: Aufgaben, text: "für Menschen, mit Weg"}
  internal/backup: {titel: Backup, text: "restic jede Nacht, Wiederherstellung, Probe"}
  internal/boxfs: {titel: Pfade, text: die Pfade der Box}
  internal/cli: {titel: CLI, text: "Umgebung, Ausgabe, Ablehnung"}
  internal/diag:
    titel: Diag
    text: "Befunde, Reparatur-Vorschläge"
    zieht: {nach: Beobachter, was: die lesenden Befunde, issue: "1235"}
  internal/envelope: {titel: Rahmen, text: "Eingriffsbudget je Dienst und Stunde"}
  internal/inbox: {titel: Eingang, text: "Vorschläge, Freigaben, Läufe einzeln zurück"}
  internal/journal: {titel: Journal, text: "eine JSONL-Datei je Tag, nur anhängen"}
  internal/mcp: {titel: MCP, text: "die Tür: Verben als Werkzeuge, je Hand ein Token"}
  internal/pages: {titel: Box-Seite, text: "Status, Eingang, Schlüssel, Journal"}
  internal/plan: {titel: Plan, text: "Zustand gegen Box, Abweichung"}
  internal/policy: {titel: Policy, text: "Hände, Stufen, wer freigibt"}
  internal/proposal: {titel: Vorschlag, text: "Branch, Karte, Text für den Menschen"}
  internal/registry:
    titel: Registry
    text: "Vorlagen, Lint, Pins, Signaturen"
    zieht: {nach: Updater, was: "Update-Suche, Changelogs", issue: "1233"}
  internal/render: {titel: Render, text: "Quadlet, Caddy, Authelia, AdGuard, nftables"}
  internal/review: {titel: Prüfung, text: "was nur ein Mensch freigibt"}
  internal/secrets: {titel: Secrets, text: "age, nur beim Apply offen"}
  internal/skill: {titel: Skills, text: "die Skills des Operators"}
  internal/state: {titel: Zustand, text: "box.yml, policy.yml, services/, laden und prüfen"}
