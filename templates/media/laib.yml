name: media
template: {registry: builtin, name: media, version: 1}
provides: [music, video]
upstream: [https://github.com/jellyfin/jellyfin, https://jellyfin.org/docs/]   # where the Operator's web search looks first (#544)
# Jellyfin for music and video. Audiobooks, podcasts and radio are NOT
# here any more (docs/SERVICES.md, the Symfonium finding, #646): they live
# in audiobookshelf and music-assistant, so a phone player that syncs
# Jellyfin's audio sees music only. The hook removes ServiceBay's twin
# libraries ("Music2" on Music's folders) and, once the owner set
# SPOKEN_WORD=audiobookshelf and both answer with content, the old
# Audiobooks, Podcasts and Radio libraries. The hook completes the first-run wizard, creates the local admin
# (break-glass), registers the libraries Musik, Filme and Serien for the
# folders Jellyfin itself sees under /media (#651), and logs the family in with their LLDAP
# accounts through the LDAP-Authentication plugin (#256), Quick Connect on.
after: [auth, file-share]        # LLDAP's read-only account (#256); the share's folders are mounted here (#36)
routes:
  - host: media
    port: 8096
    exposure: public
    auth: none                     # Jellyfin logs in itself (its apps cannot pass forward-auth, #55); LDAP-Auth plugin against LLDAP (#256)
    # no caddy: snippet: Caddy's reverse_proxy streams and passes websockets as it is.
    # The nginx line that stood here ("proxy_buffering off") is no Caddy directive:
    # Caddy refused the whole Caddyfile, so media never applied (vm-install run 38898317486)
secrets:
  - name: JELLYFIN_ADMIN_PASSWORD
    login: {user: "${ADMIN_USER}", host: media, note: "Jellyfin-Admin"}   # a human's login: the recovery sheet lists it, --vaultwarden exports it (#441)
    dataBound: true                 # read only when the app makes its data: laib secret rotate refuses it (#353)
  - name: JELLYFIN_LDAP_PASSWORD      # the read-only LLDAP account the plugin binds with, seeded by the auth template (#256)
    external: true
  - name: ABS_MA_TOKEN                # audiobookshelf's key for Music Assistant (#646): media only reads with it whether the books and podcasts are there
    external: true
    optional: true
  - name: HA_MUSIC_ASSISTANT_TOKEN    # minted by music-assistant (#526): media only asks with it whether the radio stations are there (#646)
    external: true
    optional: true
  - name: JELLYFIN_HA_PASSWORD        # Home Assistant's own Jellyfin account `homeassistant` (#375), not an LLDAP login; laib secret set, the same in HA's entry; without it no account
    external: true
    optional: true
data:
  - path: ${DATA_DIR}/media/jellyfin-config
  - path: ${DATA_DIR}/media/jellyfin-cache
    backup: false
health:
  http: http://127.0.0.1:8096/health
ports:
  - {port: 8096, lan: true}        # LAN clients (TV, Symfonium at home) talk to it directly
gpu: true
