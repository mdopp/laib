name: file-share
title: Netzlaufwerk
beschreibung: Gemeinsame Ordner im Heimnetz
private: approval     # ADR 0032: the family's data; an agent looks in for an hour after a human's Einblick, the journal keeps no output
template: {registry: builtin, name: file-share, version: 1}
provides: [files]
upstream: [https://github.com/syncthing/syncthing, https://docs.syncthing.net/, https://github.com/ServerContainers/samba]   # where the Operator's web search looks first (#544)
# The household's files: Syncthing (phones and laptops), Samba (the LAN
# share), File Browser (the web). The shared data folder is where music,
# audiobooks, podcasts, photos, documents and notes live (ADR 0017). Host
# network for Samba discovery and Syncthing's local announcements.
# Samba has one account per family member (#296): who is family comes from
# LLDAP (the auth pod), each password from the person in Homes.
# The Werkstatt's workspace is Samba's share werkstatt, for the admins only
# (#666): not in File Browser, which writes as core, nor in Syncthing.
# Syncthing keeps what another device deleted or overwrote for 30 days
# (haus#174, file-share-versioning): in each folder's .stversions. A delete
# on the box itself (Samba, File Browser) is not kept by it.
hostNetwork: true
after: [auth]
routes:
  - host: sync
    port: 8384
    exposure: internal
    auth: one_factor
    group: admins
  # File Browser only at home (owner decision J, laib#1133): the app had several holes in 2025, and from
  # outside the family needs only its share links. Those stay for everyone under the same name, the link
  # File Browser builds from the page's address: the share page (/share/), its data and downloads
  # (/api/public/) and its scripts and styles (/static/) — what its frontend's Share view fetches. File
  # Browser checks a share's own password and expiry; everything else answers „Nur zu Hause“ outside.
  - host: files
    port: 8088
    exposure: internal
    auth: one_factor               # the family's one login (#231): File Browser takes the user from Authelia's Remote-User
    publicPaths: [/share/, /api/public/, /static/]   # from anywhere, without a login
secrets:
  - name: SAMBA_PASSWORD                # the shared account's, the fallback
    devices: true                       # the laptops and phones that mount the share hold it (#665)
  - name: FILE_SHARE_LDAP_PASSWORD      # the read-only LLDAP account samba-members.py reads with, seeded by the auth template (#296, #55)
    external: true
data:
  - path: ${DATA_DIR}/file-share/syncthing-config
  - path: ${DATA_DIR}/file-share/filebrowser
  - path: ${DATA_DIR}/file-share/samba-private   # Samba's TDBs and the passdb with each account's hash (the lint found it unmounted, #36)
  - path: ${DATA_DIR}/file-share/samba-accounts  # the member list, who has a password, the FIFO Homes hands passwords through (#296)
    backup: false                                 # made again from LLDAP and the passdb
  - path: ${DATA_DIR}/file-share/data   # the share itself (the units mount it); backed up folder by folder below
    backup: false
  - path: ${DATA_DIR}/file-share/data/notes
  - path: ${DATA_DIR}/file-share/data/documents
  - path: ${DATA_DIR}/file-share/data/photos            # immich reads them (#36)
  - path: ${DATA_DIR}/file-share/data/paperless-consume # paperless's inbox: transient
    backup: false
  - path: ${DATA_DIR}/file-share/data/audiobooks        # audiobookshelf; bulk
    backup: false
  - path: ${DATA_DIR}/file-share/data/podcasts          # audiobookshelf fetches them again
    backup: false
  - path: ${DATA_DIR}/file-share/data/music
    backup: false                  # bulk: the mirror template's job, not the NAS repo
  - path: ${DATA_DIR}/file-share/data/movies
    backup: false
  - path: ${DATA_DIR}/file-share/data/tv
    backup: false
  - path: ${DATA_DIR}/werkstatt/workspace   # the Werkstatt's, Samba's share werkstatt for the admins (#666); declared here so it exists without the Werkstatt
    backup: false                             # backed up by werkstatt
  - path: ${DATA_DIR}/file-share/check     # file-share-check's status file (#785): made again by its timer
    backup: false
health:
  http: http://127.0.0.1:8384/rest/noauth/health
status:                            # the Box page's line (#785): "420,8 GB frei von 2,0 TB · Syncthing: 2 von 3 Geräten verbunden · Netzlaufwerk: 2 von 3 Personen mit Passwort"
  file: ${DATA_DIR}/file-share/check/laib-status.json
  check: file-share-check.service
  stale: 20m
ports:
  - {port: 8384, lan: false}
  - {port: 8088, lan: false}
  # Samba and Syncthing listen in the host network for the LAN (#487)
  - {port: 139, lan: true}
  - {port: 445, lan: true}
  - {port: 22000, lan: true}
exceptions:                      # #1166: where a container departs from the default, and why (laib template lint)
  file-share-filebrowser.container:
    hostNetwork: "none known: it listens on 127.0.0.1 for Caddy only; a pod with its port on 127.0.0.1 would do, unknown, kept until measured"
    labelOff: "the shared file-share tree is mounted without :z, which needs labelling off (#230)"
    unhardened: "unknown, kept until measured: it runs as User=0 (core on the host) and writes its database folder"
  file-share-samba-members.container:
    hostNetwork: "it reads LLDAP's API, which the auth pod publishes on the box's 127.0.0.1 only: a pod's own network cannot reach it"
    unhardened: "unknown, kept until measured: stock Python, the standard library; likely tolerates all three"
  file-share-samba.container:
    hostNetwork: "SMB for the LAN with the clients' own addresses (the failed-login counter reads them, #703), and the image's discovery (avahi mDNS, wsdd2 WS-Discovery multicast)"
    labelOff: "the shared file-share tree is mounted without :z, which needs labelling off (#230)"
    unhardened: "the image's runit starts smbd as root, which changes to each user's uid (SETUID, SETGID) and writes its passdb; the Exec edits the image's runit files (ReadOnly breaks it)"
  file-share-syncthing.container:
    hostNetwork: "Syncthing's local discovery (UDP 21027 broadcast and multicast) and direct LAN connections on 22000 (laib.yml)"
    labelOff: "the shared file-share tree is mounted without :z, which needs labelling off (#230)"
    unhardened: "the image's entrypoint drops from root to its PUID with su-exec (SETUID, SETGID, CHOWN); unknown, kept until measured"
