name: file-share
template: {registry: builtin, name: file-share, version: 1}
provides: [files]
upstream: [https://github.com/syncthing/syncthing, https://docs.syncthing.net/, https://github.com/ServerContainers/samba]   # where the Operator's web search looks first (#544)
# The household's files: Syncthing (phones and laptops), Samba (the LAN
# share), File Browser (the web). The shared data folder is where music,
# audiobooks, podcasts, photos, documents and notes live (ADR 0017). Host
# network for Samba discovery and Syncthing's local announcements.
# Samba has one account per family member (#296): who is family comes from
# LLDAP (the auth pod), each password from the person in Haus.
# The Werkstatt's workspace is Samba's share werkstatt, for the admins only
# (#666): not in File Browser, which writes as core, nor in Syncthing.
hostNetwork: true
after: [auth]
routes:
  - host: sync
    port: 8384
    exposure: internal
    auth: one_factor
    group: admins
  - host: files
    port: 8088
    exposure: public
    auth: one_factor               # the family's one login (#231): File Browser takes the user from Authelia's Remote-User
    bypass: [/share/, /api/public/, /static/]   # share links and their page stay open; File Browser checks a share's own password
secrets:
  - name: SAMBA_PASSWORD                # the shared account's, the fallback
    devices: true                       # the laptops and phones that mount the share hold it (#665)
  - name: FILE_SHARE_LDAP_PASSWORD      # the read-only LLDAP account samba-members.py reads with, seeded by the auth template (#296, #55)
    external: true
data:
  - path: ${DATA_DIR}/file-share/syncthing-config
  - path: ${DATA_DIR}/file-share/filebrowser
  - path: ${DATA_DIR}/file-share/samba-private   # Samba's TDBs and the passdb with each account's hash (the lint found it unmounted, #36)
  - path: ${DATA_DIR}/file-share/samba-accounts  # the member list, who has a password, the FIFO Haus hands passwords through (#296)
    backup: false                                 # made again from LLDAP and the passdb
  - path: ${DATA_DIR}/file-share/data   # the share itself (the units mount it); backed up folder by folder below
    backup: false
  - path: ${DATA_DIR}/file-share/data/notes
  - path: ${DATA_DIR}/file-share/data/documents
  - path: ${DATA_DIR}/file-share/data/photos            # immich reads them (#36)
  - path: ${DATA_DIR}/file-share/data/paperless-consume # paperless's inbox: transient
    backup: false
  - path: ${DATA_DIR}/file-share/data/audiobooks        # audiobookshelf; bulk
    backup: false
  - path: ${DATA_DIR}/file-share/data/podcasts          # audiobookshelf fetches them again
    backup: false
  - path: ${DATA_DIR}/file-share/data/music
    backup: false                  # bulk: the mirror template's job, not the NAS repo
  - path: ${DATA_DIR}/file-share/data/movies
    backup: false
  - path: ${DATA_DIR}/file-share/data/tv
    backup: false
  - path: ${DATA_DIR}/werkstatt/workspace   # the Werkstatt's, Samba's share werkstatt for the admins (#666); declared here so it exists without the Werkstatt
    backup: false                             # backed up by werkstatt
health:
  http: http://127.0.0.1:8384/rest/noauth/health
ports:
  - {port: 8384, lan: false}
  - {port: 8088, lan: false}
  # Samba and Syncthing listen in the host network for the LAN (#487)
  - {port: 139, lan: true}
  - {port: 445, lan: true}
  - {port: 22000, lan: true}
