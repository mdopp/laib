name: radicale
title: Kalender
beschreibung: Termine und Kontakte der Familie
template: {registry: builtin, name: radicale, version: 1}
provides: [calendar, contacts]
upstream: [https://github.com/Kozea/Radicale, https://radicale.org/]   # where the Operator's web search looks first (#544)
# CalDAV/CardDAV for the household (ADR 0017): phones via DAVx⁵, Home
# Assistant's CalDAV integration, Haus, the Bote. Logins are LLDAP accounts
# (the auth pod), so every resident has a calendar and the Bote a service
# account. The app does its own auth; forward-auth would break DAV clients.
after: [auth]
routes:
  - host: caldav
    port: 5232
    exposure: public
    auth: none
    loginProbe: /haus/              # the household calendar's owner collection: Radicale refuses it (401) without a login (#480)
secrets:
  - name: RADICALE_LDAP_PASSWORD      # the read-only LLDAP account, seeded by the auth template (#55)
    external: true
data:
  - path: ${DATA_DIR}/radicale/data
  - path: ${DATA_DIR}/radicale/config   # written by pre-start (#36)
  - path: ${DATA_DIR}/radicale/check    # radicale-check's status file (#785): made again every 15 minutes
    backup: false
health:
  http: http://127.0.0.1:5232/
status:                            # the Box page's line (#785): "2 Kalender, 2 Listen, 1 Adressbuch · 1.263 Einträge"
  file: ${DATA_DIR}/radicale/check/laib-status.json
  check: radicale-check.service
  stale: 20m                       # the timer runs every 15 minutes; a look starts a check when it is older
ports:
  - {port: 5232, lan: true}        # DAVx⁵ at home
