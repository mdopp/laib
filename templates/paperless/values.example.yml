IMAGE: ghcr.io/paperless-ngx/paperless-ngx:latest
DB_IMAGE: docker.io/library/postgres:16
REDIS_IMAGE: docker.io/library/redis:7
OCR_LANGUAGE: deu+eng
OCR_MODE: redo                          # auto kept a scanner's letter salad (#567); force rasterises every PDF; off: no OCR
OCR_ROTATE_PAGES: "true"                # upside-down and sideways scans
OCR_DESKEW: "true"                      # crooked scans (Paperless skips it under redo)
# Paperless' AI (#567): the household model through the model role (MODEL_URL, MODEL_KEY), the
# embeddings for the document chat through the same proxy. Without a model on the box: "false".
AI_ENABLED: "true"
AI_MODEL: qwen3.6-35b-a3b               # the household model: others need a lease Paperless does not take
AI_LANGUAGE: de                         # the suggestions' language
AI_CONTEXT: "16384"                     # tokens of a document the model reads
AI_TIMEOUT: "300"                       # seconds: Qwen on a long document
AI_EMBED_BACKEND: openai-like           # llama-embed through the proxy; huggingface: on Paperless' CPU
AI_EMBED_MODEL: nomic-embed-text        # the llama template's EMBED_ALIAS
AI_EMBED_CHUNK: "300"                   # below llama-embed's 512-token batch, which refuses a longer piece
CONSUME: /mnt/data/stacks/file-share/data/paperless-consume
ADMIN_USER: admin
DB_PASSWORD: !secret PAPERLESS_DB_PASSWORD
SECRET_KEY: !secret PAPERLESS_SECRET_KEY
ADMIN_PW: !secret PAPERLESS_ADMIN_PASSWORD
OIDC_SECRET: !secret OIDC_PAPERLESS_SECRET
# the mail inbox (#521): Paperless fetches this mailbox every 10 minutes and files the attachments
# of mail to PAPERLESS_MAIL_FILTER_TO (title: the subject), then flags the mail. Empty host: no inbox.
# The password: laib secret set PAPERLESS_MAIL_PASSWORD (on stdin, never in this file)
PAPERLESS_MAIL_HOST: ""                 # e.g. imap.strato.de
PAPERLESS_MAIL_PORT: "993"
PAPERLESS_MAIL_SECURITY: ssl            # ssl | starttls | none
PAPERLESS_MAIL_USER: ""                 # the mailbox's login, e.g. webmaster@example.org
PAPERLESS_MAIL_FILTER_TO: ""            # only mail to this address (an alias of the mailbox); empty: every mail in the folder
PAPERLESS_MAIL_FOLDER: INBOX
PAPERLESS_MAIL_PASSWORD: !secret PAPERLESS_MAIL_PASSWORD
