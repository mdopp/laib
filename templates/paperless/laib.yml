name: paperless
title: Paperless
beschreibung: Dokumente, durchsuchbar
template: {registry: builtin, name: paperless, version: 1}
provides: [documents]
upstream: [https://github.com/paperless-ngx/paperless-ngx, https://docs.paperless-ngx.com/]   # where the Operator's web search looks first (#544)
# Paperless-ngx: documents with OCR. The family logs in through Authelia's
# OIDC (#231): one login, the account made on the first one, its groups
# admins and family synced on each and given their permissions by
# post-deploy, and the
# Paperless apps keep working with a token, which forward-auth on the route
# would break. The admin from the secrets stays as break-glass. The
# consume folder is the file share's paperless-consume, so a scan dropped
# there is filed. Postgres and Redis in the pod. The mail inbox (#521):
# post-deploy makes Paperless' IMAP account and rule from PAPERLESS_MAIL_*,
# paperless-check.service says in diag when Paperless cannot get in. The AI
# and OCR are values (#567): the household model and llama-embed through the
# model role's proxy, OCR redo with rotation. Contracts and invoices
# (#709, #818, #820) are read by Dokumente (ADR 0028, the scan service), no
# longer inside this container: post-deploy makes its Paperless user
# dokumente (no administrator), mints its token into PAPERLESS_TOKEN and
# makes the workflow „Dokument hinzugefügt“ that posts to Dokumente's hook;
# the contract and invoice fields stay made here.
after: [auth, file-share]      # the share's folders are mounted here (#36)
routes:
  - host: paperless
    port: 8000
    exposure: internal
    auth: none                     # Paperless logs in itself, through Authelia's OIDC; the apps use tokens (#55, #231)
    loginProbe: /api/documents/    # refused without a session: laib-app check measures the app's own login there (#774)
    caddy: |
      request_body {
        max_size 500MB
      }
oidc:
  clientId: paperless
  redirectUris: ["https://paperless.${DOMAIN}/accounts/oidc/authelia/login/callback/"]
secrets:
  - name: PAPERLESS_DB_PASSWORD
    dataBound: true                 # read only when the app makes its data (#353)
    rotate: true                    # laib secret rotate changes it in the app first (#665): post-deploy: ALTER ROLE through psql in paperless-db
  - name: PAPERLESS_SECRET_KEY
  - name: PAPERLESS_ADMIN_PASSWORD
    login: {user: "${ADMIN_USER}", host: paperless, note: "Paperless-Admin"}   # a human's login: the recovery sheet lists it, --vaultwarden exports it (#441)
    dataBound: true                 # read only when the app makes its data: laib secret rotate refuses it (#353)
  - name: PAPERLESS_DOKUMENTE_PASSWORD   # the Paperless user dokumente's (ADR 0028): only post-deploy logs in with it, to mint PAPERLESS_TOKEN
  - name: PAPERLESS_TOKEN            # minted here (ADR 0028): the token of Paperless' user dokumente, no administrator, handed back for the scan service; post-deploy compares it
    external: true
    optional: true
  - name: DOKUMENTE_WEBHOOK_TOKEN    # generated (ADR 0028): the workflow „Dokument hinzugefügt“ sends it as X-Dokumente-Token, the scan service's hook takes only that
  - name: PAPERLESS_MAIL_PASSWORD   # the mailbox's password (#521); the owner sets it: laib secret set PAPERLESS_MAIL_PASSWORD, on stdin
    owner: {label: "Dokumente per Mail: Passwort des Postfachs", warum: "Damit holt Paperless die Dokumente ab, die ihr an das Dokumenten-Postfach schickt.", hilfe: "Das Passwort des Postfachs, das Paperless abruft; bei Gmail oder GMX dort ein eigenes App-Passwort anlegen und das hier einfügen."}   # set by the owner on the box page, „Schlüssel hinterlegen“ (#696)
    external: true
    optional: true                  # no mail inbox without PAPERLESS_MAIL_HOST
requires:                           # a mail inbox needs its user, recipient and password: refused at plan, before anything restarts (#184)
  PAPERLESS_MAIL_HOST: [PAPERLESS_MAIL_USER, PAPERLESS_MAIL_PASSWORD]
data:
  - path: ${DATA_DIR}/paperless/data
  - path: ${DATA_DIR}/paperless/media
  - path: ${DATA_DIR}/paperless/pgdata
    quiesce: true                 # a database: stopped while it is snapshotted (#40)
  - path: ${DATA_DIR}/dokumente   # ADR 0028: post-deploy moves the contract helper's record to Dokumente once; the scan service mounts it, backed up
health:
  http: http://127.0.0.1:8000/accounts/login/   # 200 without a login; /api/ challenges (#288)
status:                             # the mail inbox (#521): whether Paperless gets into the mailbox, in laib diag
  file: ${DATA_DIR}/paperless/data/laib-status.json
  check: paperless-check.service
  stale: 30m                        # the timer runs hourly; a look starts a check when it is older
ports:
  - {port: 8000, lan: false}
