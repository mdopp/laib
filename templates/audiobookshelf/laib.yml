name: audiobookshelf
template: {registry: builtin, name: audiobookshelf, version: 1}
provides: [audiobooks, podcasts]
upstream: [https://github.com/advplyr/audiobookshelf, https://www.audiobookshelf.org/docs]   # where the Operator's web search looks first (#544)
# Hörbücher und Podcasts: Audiobookshelf fetches podcast episodes itself
# (RSS, auto-download, retention), keeps progress and chapters, has its own
# apps. This replaces the hand-rolled sync_podcasts.py and takes audiobooks
# out of Jellyfin (docs/SERVICES.md). OIDC through Authelia.
after: [file-share]              # its folders are mounted here (#36)
routes:
  - host: hoerbuecher
    port: 13378
    exposure: public
    auth: none                     # ABS does its own login (OIDC via Authelia); forward-auth would break its apps
secrets:
  - name: ABS_ROOT_PASSWORD
    login: {user: root, host: hoerbuecher, note: "Audiobookshelf"}   # a human's login: the recovery sheet lists it, --vaultwarden exports it (#441)
    dataBound: true                 # read only when the app makes its data: laib secret rotate refuses it (#353)
oidc:
  clientId: audiobookshelf           # post-deploy writes the secret into ABS's settings on every apply (#255)
  redirectUris: ["https://hoerbuecher.${DOMAIN}/auth/openid/callback", "https://hoerbuecher.${DOMAIN}/auth/openid/mobile-redirect"]
data:
  - path: ${DATA_DIR}/audiobookshelf/config
  - path: ${DATA_DIR}/audiobookshelf/metadata
health:
  http: http://127.0.0.1:13378/healthcheck
ports:
  - {port: 13378, lan: true}       # the apps at home talk to it directly
