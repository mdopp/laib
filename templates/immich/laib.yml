name: immich
title: Immich
beschreibung: Fotos und Videos
template: {registry: builtin, name: immich, version: 1}
provides: [photos]
upstream: [https://github.com/immich-app/immich, https://immich.app/docs/]   # where the Operator's web search looks first (#544)
# Immich: server, machine learning (GPU), Postgres with vectors, Redis in
# one pod. Only the server is published. Photos uploaded by the apps live
# in the upload volume; external libraries are read-only mounts.
after: [auth, file-share]      # the share's folders are mounted here (#36)
routes:
  - host: photos
    port: 2283
    exposure: public
    auth: none                     # the apps do their own login (OIDC via Authelia)
    loginProbe: /api/users/me      # refused without a session: laib-app check measures the app's own login there (#774)
    caddy: |
      request_body {
        max_size 50GB
      }
secrets:
  - name: IMMICH_DB_PASSWORD
    dataBound: true                 # read only when the app makes its data (#353)
    rotate: true                    # laib secret rotate changes it in the app first (#665): post-deploy: ALTER ROLE through psql in immich-db
  - name: IMMICH_ADMIN_PASSWORD      # the admin post-deploy signs up on a fresh Immich; on a box from ServiceBay, carried (#254)
    login: {user: "${ADMIN_EMAIL}", host: photos, note: "Immich-Admin (leer: admin@<Domain>)"}   # a human's login: the recovery sheet lists it, --vaultwarden exports it (#441)
    dataBound: true                 # read only when the app makes its data (#353)
    rotate: true                    # laib secret rotate changes it in the app first (#665): post-deploy: Immich's change-password as the admin
  - name: IMMICH_API_KEY             # minted by post-deploy: system config only, so the family login is re-set on every apply (#254)
    external: true
    optional: true
oidc:
  clientId: immich                   # post-deploy writes the secret into Immich's settings on every apply (#254)
  redirectUris: ["https://photos.${DOMAIN}/auth/login", "https://photos.${DOMAIN}/user-settings", "app.immich:/", "app.immich:///oauth-callback"]
data:
  - path: ${DATA_DIR}/immich/upload
  - path: ${DATA_DIR}/immich/pgdata
    quiesce: true                 # a database: stopped while it is snapshotted (#40)
  - path: ${DATA_DIR}/immich/model-cache
    backup: false
  - path: ${DATA_DIR}/immich/check     # immich-check's status file (#785): made again every 15 minutes
    backup: false
health:
  http: http://127.0.0.1:2283/api/server/ping
status:                            # the Box page's line (#785): "18.300 Fotos, 1.200 Videos · 412 GB · 3 Konten"
  file: ${DATA_DIR}/immich/check/laib-status.json
  check: immich-check.service
  stale: 20m                       # the timer runs every 15 minutes; a look starts a check when it is older
ports:
  - {port: 2283, lan: true}        # the apps at home
gpu: true
