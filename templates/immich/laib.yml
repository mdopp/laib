name: immich
template: {registry: builtin, name: immich, version: 1}
provides: [photos]
# Immich: server, machine learning (GPU), Postgres with vectors, Redis in
# one pod. Only the server is published. Photos uploaded by the apps live
# in the upload volume; external libraries are read-only mounts.
after: [auth, file-share]      # the share's folders are mounted here (#36)
routes:
  - host: photos
    port: 2283
    exposure: public
    auth: none                     # the apps do their own login (OIDC via Authelia)
    caddy: |
      request_body {
        max_size 50GB
      }
secrets:
  - name: IMMICH_DB_PASSWORD
  - name: IMMICH_ADMIN_PASSWORD      # the admin post-deploy signs up on a fresh Immich; on a box from ServiceBay, carried (#254)
  - name: IMMICH_API_KEY             # minted by post-deploy: system config only, so the family login is re-set on every apply (#254)
    external: true
    optional: true
oidc:
  clientId: immich                   # post-deploy writes the secret into Immich's settings on every apply (#254)
  redirectUris: ["https://photos.${DOMAIN}/auth/login", "https://photos.${DOMAIN}/user-settings", "app.immich:/", "app.immich:///oauth-callback"]
data:
  - path: ${DATA_DIR}/immich/upload
  - path: ${DATA_DIR}/immich/pgdata
    quiesce: true                 # a database: stopped while it is snapshotted (#40)
  - path: ${DATA_DIR}/immich/model-cache
    backup: false
health:
  http: http://127.0.0.1:2283/api/server/ping
ports:
  - {port: 2283, lan: true}        # the apps at home
gpu: true
