name: vaultwarden
title: Vaultwarden
beschreibung: Passwörter der Familie
template: {registry: builtin, name: vaultwarden, version: 1}
provides: [passwords]
upstream: [https://github.com/dani-garcia/vaultwarden, https://github.com/dani-garcia/vaultwarden/wiki]   # where the Operator's web search looks first (#544)
# Vaultwarden with SSO through Authelia (OIDC client rendered by laib).
# The app does its own login; forward-auth would break the clients.
after: [auth]
routes:
  - host: vault
    port: 8222
    exposure: public
    auth: none
    loginProbe: /api/accounts/profile   # refused without a session: laib-app check measures the app's own login there (#774)
secrets:
  - name: VAULTWARDEN_ADMIN_TOKEN
    login: {user: admin, host: vault, path: /admin, note: "Vaultwardens Admin-Seite: nur das Token zählt"}   # a human's login: the recovery sheet lists it, --vaultwarden exports it (#441)
oidc:
  clientId: vaultwarden
  redirectUris: ["https://vault.${DOMAIN}/identity/connect/oidc-signin"]
  scopes: [openid, email, profile, offline_access]
data:
  - path: ${DATA_DIR}/vaultwarden/data
    quiesce: true                 # a database: stopped while it is snapshotted (#40)
  - path: ${DATA_DIR}/vaultwarden/check     # vaultwarden-check's status file (#785): made again every 15 minutes
    backup: false
health:
  http: http://127.0.0.1:8222/alive
status:                            # the Box page's line (#785): "3 Konten, 2 mit zweitem Faktor"
  file: ${DATA_DIR}/vaultwarden/check/laib-status.json
  check: vaultwarden-check.service
  stale: 20m                       # the timer runs every 15 minutes; a look starts a check when it is older
ports:
  - {port: 8222, lan: false}
