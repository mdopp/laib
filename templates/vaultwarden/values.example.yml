IMAGE: docker.io/vaultwarden/server:latest
SIGNUPS: "false"
ADMIN_TOKEN: !secret VAULTWARDEN_ADMIN_TOKEN
SSO_SECRET: !secret OIDC_VAULTWARDEN_SECRET
LDAP_PASSWORD: !secret VAULTWARDEN_LDAP_PASSWORD   # the read-only LLDAP account vaultwarden-check reads whose address an account has (#1168)
CHECK_IMAGE: docker.io/library/python:3.13-alpine    # vaultwarden-check.py, the standard library only (#785)
