name: auth
template: {registry: builtin, name: auth, version: 1}
provides: [sso, identity]
upstream: [https://github.com/authelia/authelia, https://www.authelia.com/, https://github.com/lldap/lldap]   # where the Operator's web search looks first (#544)
# Authelia (forward-auth, OIDC), LLDAP (users, groups) and Valkey
# (Authelia's sessions, on disk: a restart logs nobody out, #369) in one pod. Laib
# renders all of Authelia's access rules and the OIDC clients as fragments
# (render/authelia/*.yml); the hook writes Authelia's own configuration.yml
# (no access rules: a later file's list replaces it, #249), generates the
# OIDC signing key once, and seeds LLDAP (groups admins and family, the
# operator's account).
routes:
  - host: auth
    port: 9091
    exposure: public
    auth: none
  - host: ldap
    port: 17170
    exposure: internal
    auth: two_factor
    group: admins
secrets:
  - name: AUTHELIA_JWT_SECRET
  - name: AUTHELIA_SESSION_SECRET
  - name: AUTHELIA_STORAGE_KEY
    dataBound: true                 # read only when the app makes its data: laib secret rotate refuses it (#353)
  - name: AUTHELIA_OIDC_HMAC_SECRET
  - name: LLDAP_JWT_SECRET
  - name: LLDAP_ADMIN_PASSWORD
    login: {user: admin, host: ldap, note: "LLDAP, Benutzer und Gruppen"}   # a human's login: the recovery sheet lists it, --vaultwarden exports it (#441)
    dataBound: true                 # read only when the app makes its data: laib secret rotate refuses it (#353)
  - name: OPERATOR_PASSWORD           # the admin's own first password; change it in LLDAP afterwards
    login: {user: "${OPERATOR_USER}", host: auth, note: "dein Konto für alle Dienste (erstes Passwort, in LLDAP ändern)"}   # a human's login: the recovery sheet lists it, --vaultwarden exports it (#441)
    dataBound: true                 # read only when the app makes its data: laib secret rotate refuses it (#353)
  - name: RADICALE_LDAP_PASSWORD      # the read-only LDAP account radicale binds with (#55): seeded here, used there
  - name: FILE_SHARE_LDAP_PASSWORD    # the read-only account file-share reads the family with (#296): seeded here, used there
  - name: HAUS_RADICALE_PASSWORD      # Haus's account `haus` (#418), owner of the household's calendar in Radicale: seeded here, used there
  - name: KALENDER_RADICALE_PASSWORD  # the account `kalender` (#495) that writes the calendar mirrors in Radicale: seeded here, used by templates/kalender
  - name: HA_RADICALE_PASSWORD        # Home Assistant's own Radicale account `homeassistant` (#495): seeded here, its CalDAV entry by home-assistant's post-deploy
  - name: JELLYFIN_LDAP_PASSWORD      # the read-only LDAP account Jellyfin's LDAP plugin binds with (#256): seeded here, used there
  - name: AUTHELIA_SMTP_PASSWORD      # the mail server's login (#359): laib secret set, carried from ServiceBay's notifications.email
    external: true
    optional: true                    # no mail server: resets land in a file, and diag says so
after: []
data:
  - path: ${DATA_DIR}/auth/lldap
  - path: ${DATA_DIR}/auth/authelia-config
  - path: ${DATA_DIR}/auth/authelia-data
  - path: ${DATA_DIR}/auth/sessions          # Authelia's sessions in Valkey (#369)
    backup: false                          # a restore must not bring back sessions logged out since
health:
  http: http://127.0.0.1:9091/api/health
status:                             # whether resets and invitations can be mailed (#359); pre-start writes it on every apply
  file: ${DATA_DIR}/auth/authelia-config/laib-status.json
ports:
  - {port: 9091, lan: false}
  - {port: 17170, lan: false}
  - {port: 3890, lan: false}        # LDAP for other pods via host.containers.internal; never the WLAN
