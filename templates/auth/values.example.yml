AUTHELIA_IMAGE: docker.io/authelia/authelia:4
LLDAP_IMAGE: docker.io/lldap/lldap:stable
SESSIONS_IMAGE: docker.io/valkey/valkey:8-alpine
BASE_DN: dc=example,dc=home
OPERATOR_USER: admin
OPERATOR_EMAIL: admin@example.home
OPERATOR_DISPLAY: Admin
JWT_SECRET: !secret AUTHELIA_JWT_SECRET
SESSION_SECRET: !secret AUTHELIA_SESSION_SECRET
STORAGE_KEY: !secret AUTHELIA_STORAGE_KEY
OIDC_HMAC: !secret AUTHELIA_OIDC_HMAC_SECRET
LLDAP_JWT: !secret LLDAP_JWT_SECRET
LLDAP_ADMIN: !secret LLDAP_ADMIN_PASSWORD
OPERATOR_PW: !secret OPERATOR_PASSWORD
# the mail server Authelia sends "Passwort vergessen", invitations and the 2FA code through (#359);
# SMTP_HOST empty: no mail, the messages land in a file on the box and laib diag says so
SMTP_HOST: ""
SMTP_PORT: "587"
SMTP_SECURITY: starttls              # starttls (587) | tls (465) | none (a relay without TLS)
SMTP_USER: ""
SMTP_FROM: ""                        # the sender; empty: SMTP_USER
SMTP_PASSWORD: !secret AUTHELIA_SMTP_PASSWORD
# Authelia's regulation (#653): this many failed logins for one name within the find time ban it for the ban time
AUTH_MAX_RETRIES: "5"
AUTH_FIND_TIME: 10m
AUTH_BAN_TIME: 30m
ANMELDUNGEN_IMAGE: docker.io/library/python:3.13-alpine   # the failed-login counter (anmeldungen.py), the standard library only
NOTIFY_TOKEN: !secret BOTE_NOTIFY_TOKEN   # bote-notify's bearer for the failed-login messages; empty without the Bote
