name: frage
template: {registry: builtin, name: frage, version: 1}
provides: [frage]
upstream: [https://github.com/searxng/searxng, https://docs.searxng.org/]   # where the Operator's web search looks first (#544)
# "Was ist …": SearXNG + a model summary, as Assist's conversation agent
# (/v1/chat/completions) and as the Bote's `frage` tool (/mcp, #54). Two
# containers in one pod sharing loopback; pre-start writes SearXNG's
# settings.yml before it starts (#490).
# /search answers SearXNG's hits alone, no model: the Operator reads the
# web through it (FRAGE_URL, #544, ADR 0025).
routes: []
secrets:
  - name: SEARX_SECRET
data:
  - path: ${DATA_DIR}/frage/searxng
  - path: ${DATA_DIR}/frage/check     # frage-check's status file (#785): made again by its timer
    backup: false
health:
  http: http://127.0.0.1:8710/health
status:                            # the Box page's line (#785): "Websuche antwortet: 24 Treffer, 2 Suchmaschinen still (google, brave)"
  file: ${DATA_DIR}/frage/check/laib-status.json
  check: frage-check.service
  stale: 90m
ports:
  - {port: 8710, lan: false}       # on every address for pods (host.containers.internal), never the LAN (#490)
