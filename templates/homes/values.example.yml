HOMES_IMAGE: ghcr.io/mdopp/homes:latest
QMD_IMAGE: ghcr.io/mdopp/laib-qmd:2.8.3               # the memory library (#195): qmd as released, pinned by its version; CPU only
LAIB_TOKEN: !secret HOMES_LAIB_TOKEN
PROXY_SECRET: !secret HOMES_PROXY_SECRET
HA_URL: http://host.containers.internal:8123             # Home Assistant; used once home-assistant's post-deploy minted HOMES_HA_TOKEN (#349)
HA_TOKEN: !secret HOMES_HA_TOKEN
ENERGY_FLOW: ""                                          # pv=sensor.…,house=…,grid=…,battery=…; empty: Homes matches HA's friendly names
ENERGY_TOTALS: ""                                        # label=sensor.…,…; empty: the friendly-name fallback
STT_PROVIDER: ""                                         # HA speech-to-text entity for the microphone (haus#63), e.g. stt.faster_whisper; empty: no button
STT_LANGUAGE: de                                         # the language Homes asks HA's STT for
HA_PUBLIC_URL: https://home.${DOMAIN}                     # "In Home Assistant öffnen" (haus#64)
GESUNDHEIT_URL: ""                                       # the Gesundheit program (laib#893, haus#192): https://gesundheit.${DOMAIN} once it is installed; empty: no card on Mehr
REITTI_URL: ""                                           # Reitti (laib#1021): http://host.containers.internal:8730 once it is installed; empty: no Standortverlauf
REITTI_PUBLIC_URL: ""                                    # where a person makes their Reitti token: https://reitti.${DOMAIN}; empty: no link
ENERGY_STATS: ""                                         # bezug=sensor.…,einspeisung=…,solar=…: HA long-term statistics for the history (haus#65); empty: the counters Homes finds
COVER_INVERTED: ""                                       # cover.…,…: covers wired the wrong way round, shown and set turned over (haus#64)
RADICALE_URL: http://host.containers.internal:5232     # the Haushalt's calendar (haus#11)
RADICALE_USER: homes                                   # the account Homes writes with (#418): `homes` (was `haus`, ADR 0031), seeded by the auth template; empty: no calendar tools
RADICALE_PASSWORD: !secret HOMES_RADICALE_PASSWORD
RADICALE_CALENDAR: ""                                  # the calendar written to; empty: "Haushalt" (created if missing)
HAUSHALT_TOKEN: !secret HOMES_HAUSHALT_TOKEN
RADICALE_ADDRESSBOOK: ""                               # the address book written to; empty: "Haushalt"
RADICALE_PUBLIC_URL: https://caldav.${DOMAIN}           # Radicale as phones reach it (haus#66): its web page and the CalDAV addresses to copy
PAPERLESS_URL: http://host.containers.internal:8000    # document search for the Haushalt (haus#11)
PAPERLESS_TOKEN: !secret HOMES_PAPERLESS_TOKEN
PAPERLESS_PUBLIC_URL: https://paperless.${DOMAIN}      # where a found document opens
PAPERLESS_LAN_ONLY: "true"                             # paperless' route is internal (haus#68): "In Paperless öffnen" says "nur zu Hause im WLAN"
IMMICH_URL: http://host.containers.internal:2283       # Immich (homes 2026-11-05): its named people and their faces for the contacts
IMMICH_KEY: !secret HOMES_IMMICH_KEY                    # the owner's Immich API key (person.read, person.create, person.update, user.read), set by the owner; empty: „Fotos“ searches by name, no faces
IMMICH_PUBLIC_URL: https://photos.${DOMAIN}            # where a contact's „Fotos“ opens Immich
DOCUMENTS_MAIL: ""                                     # the Dokumente page's "Per E-Mail ablegen" (haus#68): paperless' PAPERLESS_MAIL_FILTER_TO, e.g. dokumente@example.org; empty: no button
BOTE_URL: http://host.containers.internal:8642/v1     # the Bote's API (#215): Hermes in the bote pod, for the Sprechen field
BOTE_KEY: !secret BOTE_API_KEY                         # generated by laib add bote; empty without the Bote: no field
ABS_URL: http://host.containers.internal:13378         # Audiobookshelf (#676, haus#123): podcasts subscribed by link, the newest episodes asked every 15 minutes
ABS_TOKEN: !secret HOMES_ABS_TOKEN                      # minted by audiobookshelf's post-deploy for its user homes; empty without ABS: no podcast page
JELLYFIN_URL: http://host.containers.internal:8096     # Jellyfin (#695): the music wish list asks whether a song is there already
JELLYFIN_TOKEN: !secret HOMES_JELLYFIN_TOKEN            # minted by media's post-deploy for its user homes (music only); empty without media: no „hast du schon“
JELLYFIN_KEY: !secret HOMES_JELLYFIN_KEY                # minted by media's post-deploy (haus#152); empty without media: Gesehen & Gehört without films
USAGE_URL: http://host.containers.internal:8094        # usage-metrics (#266): Homes's counts and the Box page's "Was wird genutzt"
USAGE_TOKEN: !secret USAGE_METRICS_TOKEN               # generated by laib add usage-metrics; empty without it: nothing counted
DISCOGS_KEY: !secret HOMES_DISCOGS_KEY                  # the household's Discogs app, Consumer-Key (#696, haus#138), set by the owner; empty: no Discogs
DISCOGS_SECRET: !secret HOMES_DISCOGS_SECRET            # the same app's Consumer-Secret
WERKSTATT_REPOS: ""                                    # owner/name,… whose pi:ready and needs-claude tickets the Box page shows (haus#15); empty: no card
MODULE_AUS: ""                                         # Homes' modules to leave off although their service runs, with commas: podcasts,energie (homes ADR 0001 §5); empty: all
CHECK_IMAGE: docker.io/library/python:3.13-alpine    # homes-check.py, the standard library only (#785)
