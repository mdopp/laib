name: homes
title: Homes
beschreibung: Seiten und App der Familie
template: {registry: builtin, name: homes, version: 1}
provides: [homes]
# Homes (ADR 0014, ADR 0031, mdopp/homes): the family's pages and the companion API
# the Android widgets speak. Loopback only; Caddy fronts it. /napi/ bypasses
# Authelia (device tokens), the pages are behind it.
# Renamed from Haus (ADR 0031, #1021): every `was:` below names the former place
# the box migration carries along; they go once the box moved (ADR 0021 rule 8).
after: [auth]                    # not file-share: the share folders it mounts are declared under data:, so a box without file-share still loads (#639)
needs: [mcp]                     # talks to laib over host.containers.internal: laib.listen 0.0.0.0 (ADR 0012 §4)
uses: [home-assistant]           # talks to Home Assistant without after: (a box without it still loads); its planned stops explain these errors (laib planned, #978)
instances:                       # each person's open archive gives a new phone its WhatsApp media back (laib#1016, haus#209)
  - template: archiv
    unit: homes.container
    url: HOMES_ARCHIV_INTERN       # "<person>=http://host.containers.internal:<port> …"
    secret: ARCHIV_HOMES_SECRET    # that archive's own, as HOMES_ARCHIV_SECRET_<PERSON>; Homes sends it as X-Archiv-Homes to /intern/
    env: HOMES_ARCHIV_SECRET
routes:
  - host: homes
    port: 8650
    exposure: public               # the phone reaches /napi/ from outside; the pages are behind Authelia
    auth: one_factor
    bypass: [/napi/]
    proxySecret: HOMES_PROXY_SECRET # Caddy sends it as X-Homes-Proxy on the authenticated handler only (ADR 0012 §3)
    redirectFrom: ["@", www]       # ServiceBay's entry points (the domain itself and www.) lead to Homes (#360)
  # The legacy name (ADR 0031, ADR 0021 rule 8), until every phone runs the Homes app (#1021 step 9):
  # the old app (cloud.dopp.haus) keeps calling /napi/ here with its device token. Not a redirectFrom:
  # OkHttp drops Authorization on a cross-host redirect, so a Caddy redirect would log the phone out.
  # The program 308-redirects everything else on this host to homes.<domain>. Same port, same proxy
  # secret: Caddy sends X-Homes-Proxy on both, the header is named for the service.
  - host: haus
    port: 8650
    exposure: public
    auth: one_factor
    bypass: [/napi/]
    proxySecret: HOMES_PROXY_SECRET
secrets:
  - name: HOMES_LAIB_TOKEN         # minted on `laib add homes` as the homes hand: status, inbox, journal, restart, person_invite, person_pending, person_signal (#596), calendar (#495), note (who switched in HA, #591), tell (a message to one person, #676) — nothing else
    external: true                 # no was: the old token is the hand haus's; the hand homes gets its own (ADR 0031)
    mint: homes
  - name: HOMES_PROXY_SECRET       # generated; without it no page request counts (haus#1)
    was: HAUS_PROXY_SECRET
  - name: HOMES_HAUSHALT_TOKEN     # generated; the Bote's bearer for the Haushalt MCP (haus#11, #170)
    was: HAUS_HAUSHALT_TOKEN
  - name: HOMES_RADICALE_PASSWORD  # the Radicale account `homes` (was `haus`, ADR 0031), the household's, owner of its calendar: seeded by the auth template (#418); without it no calendar tools
    was: HAUS_RADICALE_PASSWORD
    external: true
    optional: true
  - name: HOMES_PAPERLESS_TOKEN    # a Paperless API token (haus#11): the Bote finds what that user sees; without it no document search
    was: HAUS_PAPERLESS_TOKEN
    owner: {label: "Paperless: Zugang für die Dokumentensuche", warum: "Damit findet Homes eure Dokumente in Paperless, etwa wenn du den Boten nach einem Vertrag fragst.", hilfe: "In Paperless oben rechts auf deinen Namen → Mein Profil, beim API-Token auf Erzeugen tippen und ihn kopieren. Homes findet dann, was dieses Konto sieht.", link: "https://paperless.${DOMAIN}/"}   # set by the owner on the box page, „Schlüssel hinterlegen“ (#696)
    external: true
    optional: true
  - name: HOMES_HA_TOKEN           # minted by home-assistant's post-deploy (#349) for HA's own user „Homes“ (no was: minted again for it, ADR 0031), an administrator (haus#10, #591): Homes serves the house paths from Home Assistant; without HA there are none
    external: true
    optional: true
  - name: BOTE_API_KEY             # the Bote's API key (#215), generated by laib add bote; without the Bote no Sprechen field
    external: true
    optional: true
  - name: HOMES_ABS_TOKEN          # minted by audiobookshelf's post-deploy (#676, haus#123): the API key of ABS's user `haus`, an administrator; Homes subscribes podcasts by link with it. Without ABS: no podcast page
    was: HAUS_ABS_TOKEN
    external: true
    optional: true
  - name: HOMES_JELLYFIN_TOKEN     # minted by media's post-deploy (#695): the token of Jellyfin's user `homes`, hidden, the music only, no administrator; Homes checks a wished song with it. Without media: no „hast du schon“
    was: HAUS_JELLYFIN_TOKEN
    external: true
    optional: true
  - name: HOMES_JELLYFIN_KEY       # minted by media's post-deploy (haus#152): the API key "Homes (Gesehen)", an administrator's as every Jellyfin key; Homes reads each person's watched films and series with it. Without media: Gesehen & Gehört shows the books only
    was: HAUS_JELLYFIN_KEY
    external: true
    optional: true
  - name: USAGE_METRICS_TOKEN      # usage-metrics' bearer (#266), generated by laib add usage-metrics; without it Homes counts nothing
    external: true
    optional: true
  - name: HOMES_DISCOGS_KEY        # the household's Discogs app (#696, haus#138): its Consumer-Key, set by the owner on the box page („Schlüssel hinterlegen“); each person connects their own Discogs account in Homes (OAuth)
    was: HAUS_DISCOGS_KEY
    owner: {label: "Discogs: Consumer Key", warum: "Damit kennt die Musik-Wunschliste eure Platten bei Discogs und setzt Wünsche auf eure Discogs-Wunschliste; danach verbindet jede Person in Homes ihr eigenes Konto.", hilfe: "Bei Discogs angemeldet unter Einstellungen → Developers auf „Create an Application“ tippen, als Namen etwa „Homes“ eintragen, speichern und den Consumer Key kopieren.", link: "https://www.discogs.com/settings/developers"}   # set by the owner on the box page, „Schlüssel hinterlegen“ (#696)
    external: true
    optional: true
  - name: HOMES_DISCOGS_SECRET     # the same Discogs app's Consumer-Secret; without key and secret no Discogs on the music wish list
    was: HAUS_DISCOGS_SECRET
    owner: {label: "Discogs: Consumer Secret", warum: "Gehört zum Consumer Key: erst mit beiden gibt es Discogs auf der Musik-Wunschliste.", hilfe: "Steht bei derselben Discogs-App direkt unter dem Consumer Key.", link: "https://www.discogs.com/settings/developers"}   # set by the owner on the box page, „Schlüssel hinterlegen“ (#696)
    external: true
    optional: true
data:
  - path: ${DATA_DIR}/homes        # devices.json: the paired phones (hashed tokens)
    was: ${DATA_DIR}/haus
  - path: ${DATA_DIR}/homes-qmd    # the memory library's index and embed model (#195); beside ${DATA_DIR}/homes, not in it:
    was: ${DATA_DIR}/haus-qmd
    backup: false                  # Homes relabels its own folder (:Z). A cache: the refresh timer rebuilds it, the first embed downloads the model
  - path: ${DATA_DIR}/homes-dokumente  # Paperless's documents as the library indexes them, one <id>.md each (#219); beside homes and homes-qmd:
    was: ${DATA_DIR}/haus-dokumente
    backup: false                    # both containers mount it (:z). A cache: the refresh rebuilds it from Paperless, their home
  - path: ${DATA_DIR}/file-share/data/notes   # the household's notes (ADR 0017), mounted for the Haushalt; declared here so it exists without file-share
    backup: false                             # backed up by file-share
  - path: ${DATA_DIR}/file-share/data/paperless-consume   # the app's camera uploads land here for Paperless (haus#10); transient
    backup: false
  - path: ${DATA_DIR}/file-share/data/musik-eingang   # the app's music uploads for beets' Musik-Eingang (#639): ._<name>.part, then renamed; transient
    backup: false
  - path: ${DATA_DIR}/archiv-eingang   # the phones' WhatsApp/Signal backups, one folder per person (ADR 0029, haus#207): still encrypted
    backup: false                     # by the messenger, transient until the person's Archiv imports them
  - path: ${DATA_DIR}/homes-check  # homes-check's status file (#785), beside ${DATA_DIR}/homes as homes-qmd: made again every 15 minutes, so no was:
    backup: false
  - path: ${DATA_DIR}/stimme/recordings   # the family saying the wake word (#828): Haus wrote <wake id>/haus/<person>-<zeit>.wav (nothing writes there since ADR 0030);
    backup: false                        # declared here so it exists without stimme. That folder carries a CACHEDIR.TAG: household audio stays out of the backups
  - path: ${DATA_DIR}/file-share/samba-accounts   # where Homes hands a network-drive password to file-share (#296); without file-share no FIFO, no page
    backup: false
health:
  http: http://127.0.0.1:8650/healthz
status:                          # the Box page's line (#785): "3 Geräte angemeldet, von 2 Personen · zuletzt aktiv vor 3 min"
  file: ${DATA_DIR}/homes-check/laib-status.json
  check: homes-check.service
  stale: 20m                     # the timer runs every 15 minutes; a look starts a check when it is older
ports:
  - {port: 8650, lan: false}
