name: esphome
title: ESPHome
beschreibung: Firmware für Sprachgeräte und Sensoren
template: {registry: builtin, name: esphome, version: 1}
provides: [esphome]
upstream: [https://github.com/esphome/esphome, https://esphome.io/]   # where the Operator's web search looks first (#544)
# ESPHome dashboard and OTA for the Voice PE devices and other ESP boards.
# Host network for mDNS discovery and OTA (carve-out).
# esphome-flash.service (#759) puts the house persona's wake word, trained by
# Stimme, onto the devices: only `laib flash esphome` starts it, after a human
# approved Stimme's repair in the Inbox; it reads stimme/micro on the host.
hostNetwork: true
routes:
  - host: esphome
    port: 6052
    exposure: internal
    auth: one_factor
    group: admins
secrets: []
data:
  - path: ${DATA_DIR}/esphome/config
health:
  http: http://127.0.0.1:6052/
ports:
  - {port: 6052, lan: false}
