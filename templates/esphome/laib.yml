name: esphome
title: ESPHome
beschreibung: Firmware für Sprachgeräte und Sensoren
template: {registry: builtin, name: esphome, version: 1}
provides: [esphome]
upstream: [https://github.com/esphome/esphome, https://esphome.io/]   # where the Operator's web search looks first (#544)
# ESPHome dashboard and OTA for the Voice PE devices and other ESP boards.
# Host network for mDNS discovery and OTA (carve-out).
# The wake word („Hey Mycroft“, ADR 0030) is in the Voice PE's own firmware:
# nothing is flashed for it.
hostNetwork: true
routes:
  - host: esphome
    port: 6052
    exposure: internal
    auth: one_factor
    group: admins
secrets: []
data:
  - path: ${DATA_DIR}/esphome/config
  - path: ${DATA_DIR}/esphome/check     # esphome-check's status file (#785): made again by its timer
    backup: false
health:
  http: http://127.0.0.1:6052/
status:                            # the Box page's line (#785): "1 Gerät eingerichtet, 1 mit Update bereit (ESPHome 2026.10.1)"
  file: ${DATA_DIR}/esphome/check/laib-status.json
  check: esphome-check.service
  stale: 20m
ports:
  - {port: 6052, lan: false}
