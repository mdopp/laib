name: authelia
template: {registry: builtin, name: authelia, version: 1}
routes:
  - host: auth
    port: 9091
    exposure: public
    auth: none
secrets:
  - name: AUTHELIA_JWT_SECRET
  - name: AUTHELIA_SESSION_SECRET
  - name: AUTHELIA_STORAGE_KEY
data:
  - path: ${DATA_DIR}/authelia/config
health:
  http: http://127.0.0.1:9091/api/health
ports:
  - {port: 9091, lan: false}
