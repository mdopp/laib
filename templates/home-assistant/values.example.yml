HA_IMAGE: ghcr.io/home-assistant/home-assistant:stable
ZWAVE_IMAGE: ghcr.io/zwave-js/zwave-js-ui:latest
MATTER_IMAGE: ghcr.io/home-assistant-libs/python-matter-server:stable
ZWAVE_DEVICE: /dev/ttyACM0
ZWAVE_SECRET: !secret ZWAVE_SESSION_SECRET
NOTIFY_TOKEN: !secret BOTE_NOTIFY_TOKEN          # the Bote's bote-notify (#177); empty without the Bote
BOTE_NOTIFY_URL: http://127.0.0.1:8645/mitteilung  # rest_command.mitteilung: HA is on the host network, the bote pod publishes on loopback
MA_TOKEN: !secret HA_MUSIC_ASSISTANT_TOKEN     # Music Assistant's token for HA (#526): the check reads MA with it; empty without MA
HA_TOKEN: !secret HA_TOKEN                     # minted by post-deploy (#349): home-assistant-check reads the integrations with it (#55)
HA_INSTALL: ""                                 # #528: extensions a person approved, "update.x=1.2,…": post-deploy installs them (the Operator proposes it)
HA_ADMIN_USER: laib                            # the administrator post-deploy onboards a fresh HA as and logs in as (#349); from ServiceBay: its OSCAR_HA_ADMIN_USERNAME
OIDC_SECRET: !secret OIDC_HOMEASSISTANT_SECRET   # auth_oidc's client secret, AUTH_OIDC_SECRET in HA's environment (#253)
# christiaangoossens/hass-oidc-auth, the tag archive and its SHA-256 (ServiceBay pinned the same, its #2453): an update is a values change
AUTH_OIDC_ARCHIVE: https://github.com/christiaangoossens/hass-oidc-auth/archive/refs/tags/v1.1.0.tar.gz
AUTH_OIDC_SHA256: 92650f0698401e8bc7533065cfd3f2ca5c2074b5ffdb50554898954f32a50412
VOICE_VAD: default                             # #634, #106: the satellites' Sprechpausen-Erkennung, how soon a pause ends the sentence: default 0.7 s, relaxed 1.25 s, aggressive 0.25 s of silence; empty leaves it as set in HA
VOICE_WAKE_FALLBACK: ""                        # the satellites' wake word on the device until the persona's is flashed (e.g. Okay Nabu); empty leaves it as set in HA
VOICE_OLD_PIPELINES: Sol,Solaris               # #634: Assist pipelines from before the persona's (the Solaris era): deleted once nothing uses them, else renamed „… (alt)“
