name: home-assistant
title: Home Assistant
beschreibung: Licht, Geräte, Sprachsteuerung
template: {registry: builtin, name: home-assistant, version: 1}
provides: [home, voice]
upstream: [https://github.com/home-assistant/core, https://www.home-assistant.io/docs/]   # where the Operator's web search looks first (#544)
# Home Assistant is the house brain and, with Assist, the voice brain
# (ADR 0015). Host network for discovery, Matter, Z-Wave and the Voice PE
# devices. Three containers: Home Assistant, Z-Wave JS UI, the Matter
# server. The Z-Wave stick is a device path in values.yml.
hostNetwork: true
after: [auth, mosquitto]
routes:
  - host: home
    port: 8123
    exposure: public
    auth: none                     # HA has its own login; the companion app and Voice PE need it
    loginProbe: /api/              # refused without a session: laib-app check measures the app's own login there (#774)
  - host: zwave
    port: 8091
    exposure: internal
    auth: two_factor
    group: admins
secrets:
  - name: ZWAVE_SESSION_SECRET
  - name: BOTE_NOTIFY_TOKEN          # generated by laib add bote (#177): rest_command.mitteilung's bearer; without the Bote it is empty and a message is refused
    external: true
    optional: true
  # The Home Assistant tokens (#349): post-deploy logs in as HA's administrator, makes one HA user per
  # consumer (#591: HA's logbook names the machine, never a person), mints its token and hands it back;
  # one that works on its own user is kept, any other is replaced
  - name: HA_ADMIN_PASSWORD          # HA_ADMIN_USER's: generated, and post-deploy onboards a fresh HA with it; on a box from ServiceBay, carried
    login: {user: "${HA_ADMIN_USER}", host: home, note: "Home-Assistant-Admin"}   # a human's login: the recovery sheet lists it, --vaultwarden exports it (#441)
    dataBound: true                 # read only when the app makes its data (#353)
    rotate: true                    # laib secret rotate changes it in the app first (#665): post-deploy: HA's change_password as the admin
  - name: HA_BOTE_PASSWORD           # the non-admin user bote's, which post-deploy creates
  - name: HA_CHECK_PASSWORD          # the non-admin user laib-pruefung's („Laib-Prüfung“, #591): only post-deploy logs in with it, to mint HA_TOKEN
  - name: HA_HAUS_PASSWORD           # the user haus's („Haus“, administrator, #591): the same, for HAUS_HA_TOKEN
  - name: HA_BOTE_AUTOMAT_PASSWORD   # the user bote-automat's („Bote-Automat“, administrator, #591): the same, for BOTE_AUTOMAT_HA_TOKEN
  - name: HA_MUSIC_ASSISTANT_PASSWORD   # the user music-assistant's („Music Assistant“, administrator, #591): the same, for MUSIC_ASSISTANT_HA_TOKEN
  - name: HA_STIMME_PASSWORD         # the non-admin user stimme's („Stimme“): only post-deploy logs in with it, to mint STIMME_HA_TOKEN
  - name: HA_NAMES_PASSWORD          # the user laib-namen's („Laib-Namen“, administrator, #760): only post-deploy logs in with it, to mint HA_NAMES_TOKEN
  - name: HA_TOKEN                   # minted for the user laib-pruefung, no administrator: the check reads the integrations and states (#55)
    external: true
    optional: true
  - name: HAUS_HA_TOKEN              # minted for the user haus, administrator: voice counting reads Assist's debug runs, admin-only (#266)
    external: true
    optional: true
  - name: BOTE_HA_TOKEN              # minted for the user bote, no administrator: the Bote's ha tool
    external: true
    optional: true
  - name: BOTE_AUTOMAT_HA_TOKEN      # minted for the user bote-automat, administrator: the Bote's Automat (HA's automation config API is admin-only)
    external: true
    optional: true
  - name: STIMME_HA_TOKEN            # minted for the user stimme, no administrator: Stimme reads the names exposed to Assist, Whisper's initial prompt
    external: true
    optional: true
  - name: HA_NAMES_TOKEN             # minted for the user laib-namen, administrator (#760): home-assistant-names adds the spellings Whisper writes as aliases; entity_registry/update is admin-only
    external: true
    optional: true
  - name: MUSIC_ASSISTANT_HA_TOKEN   # minted for the user music-assistant once Music Assistant is there (#526), administrator: MA's plugin reads HA's users for the family's login into MA
    external: true
    optional: true
  - name: HA_RETIRED_TOKENS          # handed back by post-deploy (#591): old tokens on another user, revoked by the next run once their successors work; empty after
    external: true
    optional: true
  - name: HA_MUSIC_ASSISTANT_TOKEN   # minted by music-assistant's post-deploy (#526): the Music Assistant integration and the check; without MA none
    external: true
    optional: true
  - name: HA_RADICALE_PASSWORD       # HA's own Radicale account `homeassistant` (#495), seeded by auth; post-deploy adds the CalDAV entry with it
    external: true
    optional: true
oidc:                                # the family's login through Authelia (auth_oidc, #253); HA's own login stays
  clientId: homeassistant            # ServiceBay's client id: on a migrated box the linked users stay linked
  redirectUris: ["https://home.${DOMAIN}/auth/oidc/callback"]
  tokenEndpointAuthMethod: client_secret_post   # auth_oidc posts its secret in the form body
data:
  - path: ${DATA_DIR}/home-assistant/homeassistant
    quiesce: true                 # a database: stopped while it is snapshotted (#40)
  - path: ${DATA_DIR}/home-assistant/zwave-js
  - path: ${DATA_DIR}/home-assistant/matter
  - path: ${DATA_DIR}/file-share/data/radio      # the house's stations: pre-start says them as Assist's radio sentence (#933); the share backs them up
    backup: false
health:
  http: http://127.0.0.1:8123/
status:                            # the integrations checklist on the Box page and in diag (#55, #309)
  file: ${DATA_DIR}/home-assistant/homeassistant/.laib-status.json
  check: home-assistant-check.service
ports:
  - {port: 8091, lan: false}
  - {port: 5580, lan: false}       # matter server websocket
  - {port: 3000, lan: false}       # Z-Wave JS server websocket, no login (#231); HA reaches it on loopback
  - {port: 3001, lan: false}       # the same on a box migrated from ServiceBay, which moved it off 3000
