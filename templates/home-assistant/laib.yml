name: home-assistant
template: {registry: builtin, name: home-assistant, version: 1}
provides: [home, voice]
# Home Assistant is the house brain and, with Assist, the voice brain
# (ADR 0015). Host network for discovery, Matter, Z-Wave and the Voice PE
# devices. Three containers: Home Assistant, Z-Wave JS UI, the Matter
# server. The Z-Wave stick is a device path in values.yml.
hostNetwork: true
after: [auth, mosquitto]
routes:
  - host: home
    port: 8123
    exposure: public
    auth: none                     # HA has its own login; the companion app and Voice PE need it
  - host: zwave
    port: 8091
    exposure: internal
    auth: two_factor
    group: admins
secrets:
  - name: ZWAVE_SESSION_SECRET
  - name: BOTE_NOTIFY_TOKEN          # generated by laib add bote (#177): rest_command.mitteilung's bearer; without the Bote it is empty and a message is refused
    external: true
    optional: true
  # The Home Assistant tokens (#349): post-deploy logs in as HA's administrator, mints one per
  # consumer and hands it back; one that works is kept, one HA refuses is replaced
  - name: HA_ADMIN_PASSWORD          # HA_ADMIN_USER's: generated, and post-deploy onboards a fresh HA with it; on a box from ServiceBay, carried
    login: {user: "${HA_ADMIN_USER}", host: home, note: "Home-Assistant-Admin"}   # a human's login: the recovery sheet lists it, --vaultwarden exports it (#441)
    dataBound: true                 # read only when the app makes its data: laib secret rotate refuses it (#353)
  - name: HA_BOTE_PASSWORD           # the non-admin user bote's, which post-deploy creates
  - name: HA_TOKEN                   # minted, administrator: the check reads the integrations (#55)
    external: true
    optional: true
  - name: HAUS_HA_TOKEN              # minted, administrator: Haus (voice counting needs one, #266)
    external: true
    optional: true
  - name: BOTE_HA_TOKEN              # minted for the user bote, no administrator: the Bote's ha tool
    external: true
    optional: true
  - name: BOTE_AUTOMAT_HA_TOKEN      # minted, administrator: the Bote's Automat (HA's automation config API is admin-only)
    external: true
    optional: true
  - name: MUSIC_ASSISTANT_HA_TOKEN   # minted once Music Assistant is there (#526), administrator: MA's Home Assistant plugin, the family's login into MA
    external: true
    optional: true
  - name: HA_MUSIC_ASSISTANT_TOKEN   # minted by music-assistant's post-deploy (#526): the Music Assistant integration and the check; without MA none
    external: true
    optional: true
oidc:                                # the family's login through Authelia (auth_oidc, #253); HA's own login stays
  clientId: homeassistant            # ServiceBay's client id: on a migrated box the linked users stay linked
  redirectUris: ["https://home.${DOMAIN}/auth/oidc/callback"]
  tokenEndpointAuthMethod: client_secret_post   # auth_oidc posts its secret in the form body
data:
  - path: ${DATA_DIR}/home-assistant/homeassistant
    quiesce: true                 # a database: stopped while it is snapshotted (#40)
  - path: ${DATA_DIR}/home-assistant/zwave-js
  - path: ${DATA_DIR}/home-assistant/matter
health:
  http: http://127.0.0.1:8123/
status:                            # the integrations checklist on the Box page and in diag (#55, #309)
  file: ${DATA_DIR}/home-assistant/homeassistant/.laib-status.json
  check: home-assistant-check.service
ports:
  - {port: 8091, lan: false}
  - {port: 5580, lan: false}       # matter server websocket
  - {port: 3000, lan: false}       # Z-Wave JS server websocket, no login (#231); HA reaches it on loopback
  - {port: 3001, lan: false}       # the same on a box migrated from ServiceBay, which moved it off 3000
