name: scan
title: Scannen
beschreibung: Papierstapel nach Paperless, Verträge lesen
template: {registry: builtin, name: scan, version: 1}
provides: [scan]
# Dokumente (ADR 0028, mdopp/dokumente) runs here: the program is its own
# repo and image; this template is the box's part (the scanner, the folders,
# the model through the lease, the secrets, laib-notify's eingang). The
# service keeps the name scan, so its state, values and history carry over.
# Paper stacks into Paperless (#568): a stack is a file in the share's
# scan-eingang folder (a scanner that scans to a network folder) or a run
# of a SANE scanner, on the network or the box's USB (#801); each page is turned, read and judged blank,
# the household model splits the pages into documents, and each document
# goes into Paperless' consume folder under the SCAN_TAG tag. One stack at
# a time, one closing message per stack (FERTIG, WARTET, ABGEBROCHEN or
# FEHLER) through bote-notify. Host network: a SANE scanner on the LAN,
# the model's lease and bote-notify on the box's loopback. Haus, the Bote
# and the CLI order a scan with `laib scan` (an order file in auftrag/).
# Contracts and invoices (#709, #818, #820; until ADR 0028 paperless'
# timer): their fields from the text through Paperless' API as the user
# paperless' post-deploy makes, the notice reminders in Haus's Haushalt and,
# on the day, to the owner through laib-notify's eingang. Run when
# Paperless' workflow „Dokument hinzugefügt“ posts to 8720, and hourly.
hostNetwork: true
after: [paperless, file-share]   # the consume folder and the share; the model is waited for, not ordered (a model role may live on another box)
routes: []
secrets:
  - name: BOTE_NOTIFY_TOKEN          # generated by laib add bote (#177): bote-notify's bearer; without the Bote no message goes out, the stack is still filed
    external: true
    optional: true
  - name: PAPERLESS_TOKEN            # minted by paperless' post-deploy (ADR 0028): the API token of Paperless' user dokumente, no administrator; without it no contracts or invoices are read
    external: true
    optional: true
  - name: DOKUMENTE_WEBHOOK_TOKEN    # generated by paperless (ADR 0028): its workflow „Dokument hinzugefügt“ sends it as X-Dokumente-Token; without it the hourly run only
    external: true
    optional: true
  - name: HAUS_HAUSHALT_TOKEN        # generated by laib add haus (#709): the notice reminders and the address book in Haus's Haushalt; without Haus none
    external: true
    optional: true
data:
  - path: ${DATA_DIR}/scan           # the status file, the orders, and the archive: each stack's original or raw pages, plan.json, log
    backup: false                    # transient: SCAN_KEEP_DAYS, the documents themselves live in Paperless
  - path: ${DATA_DIR}/dokumente      # ADR 0028: the contract helper's record laib-vertraege.json (the reminders made, the messages told, what was read); backed up, as it was in Paperless' data folder
  - path: ${DATA_DIR}/file-share/data/scan-eingang       # the stack inbox, \\<box>\data\scan-eingang; emptied by every stack
    backup: false
  - path: ${DATA_DIR}/file-share/data/paperless-consume  # Paperless' consume folder: the documents go to <SCAN_TAG>/; transient
    backup: false
  - path: /mnt/data/laib/notify/eingang   # laib-notify's eingang (#703): one file per reminder for the owner; laib-notify's, transient
    backup: false
health: {none: "a loop over the inbox and the orders, no HTTP endpoint; the unit state and the status file are the check"}
status:                              # bereit | scannt | wartet-auf-rest | trennt | legt-ab | fertig | fehler, written on every change (#568); idle, every 15 minutes with whether the scanner is on (#785)
  file: ${DATA_DIR}/scan/laib-status.json
  busy: {field: zustand, values: [scannt, trennt, legt-ab], grace: 30m}   # mid-stack (#908): a restart there fails the stack (wartet-auf-rest survives one); a hand's restart waits up to 30 min after the file last spoke, a person's does not
ports:
  - {port: 8720, lan: false}         # Paperless' webhook (ADR 0028): from its pod at host.containers.internal, as Haus's 8650; nftables drops it on the LAN, no route through Caddy
