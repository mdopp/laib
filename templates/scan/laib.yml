name: scan
title: Scannen
beschreibung: Papierstapel nach Paperless
template: {registry: builtin, name: scan, version: 1}
provides: [scan]
# Paper stacks into Paperless (#568): a stack is a file in the share's
# scan-eingang folder (a scanner that scans to a network folder) or a run
# of a SANE scanner, on the network or the box's USB (#801); each page is turned, read and judged blank,
# the household model splits the pages into documents, and each document
# goes into Paperless' consume folder under the SCAN_TAG tag. One stack at
# a time, one closing message per stack (FERTIG, WARTET, ABGEBROCHEN or
# FEHLER) through bote-notify. Host network: a SANE scanner on the LAN,
# the model's lease and bote-notify on the box's loopback. Haus, the Bote
# and the CLI order a scan with `laib scan` (an order file in auftrag/).
hostNetwork: true
after: [paperless, file-share]   # the consume folder and the share; the model is waited for, not ordered (a model role may live on another box)
routes: []
secrets:
  - name: BOTE_NOTIFY_TOKEN          # generated by laib add bote (#177): bote-notify's bearer; without the Bote no message goes out, the stack is still filed
    external: true
    optional: true
data:
  - path: ${DATA_DIR}/scan           # the status file, the orders, and the archive: each stack's original or raw pages, plan.json, log
    backup: false                    # transient: SCAN_KEEP_DAYS, the documents themselves live in Paperless
  - path: ${DATA_DIR}/file-share/data/scan-eingang       # the stack inbox, \\<box>\data\scan-eingang; emptied by every stack
    backup: false
  - path: ${DATA_DIR}/file-share/data/paperless-consume  # Paperless' consume folder: the documents go to <SCAN_TAG>/; transient
    backup: false
health: {none: "a loop over the inbox and the orders, no HTTP endpoint; the unit state and the status file are the check"}
status:                              # bereit | scannt | wartet-auf-rest | trennt | legt-ab | fertig | fehler, written on every change (#568); idle, every 15 minutes with whether the scanner is on (#785)
  file: ${DATA_DIR}/scan/laib-status.json
