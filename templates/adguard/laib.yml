name: adguard
title: AdGuard
beschreibung: Namen im Heimnetz, Werbefilter
template: {registry: builtin, name: adguard, version: 1}
provides: [dns]
upstream: [https://github.com/AdguardTeam/AdGuardHome, https://github.com/AdguardTeam/AdGuardHome/wiki]   # where the Operator's web search looks first (#544)
# AdGuard Home as the LAN DNS (ServiceBay ADR 0005, Pattern A: the router
# hands out this box as DNS). Host network for 53/udp+tcp and mDNS. Laib
# renders render/adguard/rewrites.json (*.domain and the apex → this box);
# the hook writes the first AdGuardHome.yaml with the admin user and keeps
# the rewrites in step through AdGuard's API on every apply.
hostNetwork: true
routes:
  - host: dns
    port: 8083
    exposure: internal
    auth: two_factor
    group: admins
secrets:
  - name: ADGUARD_ADMIN_PASSWORD
    login: {user: "${ADMIN_USER}", host: dns, note: "AdGuard Home"}   # a human's login: the recovery sheet lists it, --vaultwarden exports it (#441)
    dataBound: true                 # read only when the app makes its data (#353)
    rotate: true                    # laib secret rotate changes it in the app first (#665): pre-start: the user's hash in AdGuardHome.yaml
data:
  - path: ${DATA_DIR}/adguard/conf
  - path: ${DATA_DIR}/adguard/work
    backup: false                # query log and stats
  - path: ${DATA_DIR}/adguard/check     # adguard-check's status file (#785): made again every 15 minutes
    backup: false
health:
  http: http://127.0.0.1:8083/control/status
  expect: [401]                 # AdGuard always has a user (pre-start), so its API challenges; 401 is the live answer (#288)
status:                            # the Box page's line (#785): "in den letzten 24 h: 12.345 Anfragen, 1.234 blockiert (10 %)"
  file: ${DATA_DIR}/adguard/check/laib-status.json
  check: adguard-check.service
  stale: 20m                       # the timer runs every 15 minutes; a look starts a check when it is older
ports:
  - {port: 8083, lan: false}     # the web UI only through Caddy
