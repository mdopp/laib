WHISPER_IMAGE: lscr.io/linuxserver/faster-whisper:gpu     # CPU box: docker.io/rhasspy/wyoming-whisper:latest
WHISPER_MODEL: large-v3-turbo                              # CPU box: small-int8
WHISPER_LANG: de
PIPER_IMAGE: docker.io/rhasspy/wyoming-piper:latest
OPENWAKEWORD_IMAGE: docker.io/rhasspy/wyoming-openwakeword:latest
# the wake word and the Piper voice come from the house persona (box.yml persona, ADR 0020)
TRAINER_IMAGE: ghcr.io/mdopp/laib-wakeword-trainer:latest  # stimme/trainer in this repo (#128)
VOICE_ENV: /mnt/data/stacks/llama/lease/voice-device.env  # written by laib-lease; a CPU box points at a file with WHISPER_DEVICE=cpu
HA_TOKEN: !secret STIMME_HA_TOKEN  # minted by home-assistant's post-deploy for HA's non-admin user stimme: the names Whisper hears (stimme-names)
