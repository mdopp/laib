name: stimme
title: Stimme
beschreibung: Hören, Sprechen, Weckwort
template: {registry: builtin, name: stimme, version: 1}
provides: [voice]
upstream: [https://github.com/rhasspy/wyoming-piper, https://github.com/rhasspy/wyoming-faster-whisper, https://github.com/rhasspy/wyoming-openwakeword]   # where the Operator's web search looks first (#544)
# The Wyoming set Home Assistant Assist speaks (ADR 0015): Whisper (STT),
# Piper (TTS, German voice), openWakeWord („Hey Mycroft“, built in, ADR 0030),
# and stimme-wakes in front of Whisper (#825). Home Assistant finds them at 127.0.0.1: openWakeWord
# in its own pod with 10400 on the box's loopback (#1166), the others on the host network. On the
# GPU box Whisper takes the card and follows the lease's
# voice-device.env (cpu while a mode holds the card); on a box without a
# GPU set the CPU image and device in values.yml.
hostNetwork: true
after: []
uses: [home-assistant]           # talks to Home Assistant without after: (a box without it still loads); its planned stops explain these errors (laib planned, #978)
routes: []
secrets:
  - name: STIMME_HA_TOKEN            # minted by home-assistant's post-deploy for HA's non-admin user stimme: stimme-names reads the exposed names; without HA Whisper has no names
    external: true
    optional: true
data:
  - path: ${DATA_DIR}/stimme/whisper
    backup: false                  # model cache
  - path: ${DATA_DIR}/stimme/piper
    backup: false
  - path: ${DATA_DIR}/stimme/micro     # Stimme's status and the wakes per day (laib-wakes.json)
health: {none: "the voice pipeline has no HTTP endpoint to probe; the unit state is the check"}
status:                            # which satellites listen for „Hey Mycroft“, and the wakes per day; stimme-names writes it (#169, #309)
  file: ${DATA_DIR}/stimme/micro/laib-status.json
ports:
  - {port: 10300, lan: false}      # whisper
  - {port: 10301, lan: false}      # stimme-wakes, in front of Whisper: Home Assistant's Whisper entry (#825)
  - {port: 10200, lan: false}      # piper: on 0.0.0.0 for pods (host.containers.internal), never the LAN (#242)
  - {port: 10400, lan: false}      # openwakeword, published on 127.0.0.1 only (#1166)
gpu: true
exceptions:                      # #1166: where a container departs from the default, and why (laib template lint)
  stimme-piper.container:
    hostNetwork: "Home Assistant reaches it at 127.0.0.1:10200 and pods at host.containers.internal:10200 (#242); a pod publishing 10200 would serve both, unknown, kept until measured"
    unhardened: "unknown, kept until measured: it downloads its voice into /data"
  stimme-wakes.container:
    hostNetwork: "it sits between Home Assistant (127.0.0.1:10301) and Whisper on the box's 127.0.0.1:10300, which is on the host network; it moves when Whisper does"
    unhardened: "unknown, kept until measured: stock Python, the standard library; likely tolerates all three"
  stimme-whisper.container:
    hostNetwork: "Home Assistant and stimme-wakes reach it at 127.0.0.1:10300; nothing else needs the box's network, unknown, kept until measured with the GPU"
    labelOff: "the GPU (AddDevice=nvidia.com/gpu=all): under SELinux a container_t process may not open the /dev/nvidia* nodes; NVIDIA's CDI guide disables the label"
    unhardened: "a linuxserver image: s6-overlay starts as root, writes /run and /etc, chowns /config and drops to its user abc: needs a writable root, CHOWN, SETUID and SETGID"
