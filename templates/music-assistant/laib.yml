name: music-assistant
title: Music Assistant
beschreibung: Musik auf den Lautsprechern
template: {registry: builtin, name: music-assistant, version: 1}
provides: [music-players]
upstream: [https://github.com/music-assistant/server, https://music-assistant.io/]   # where the Operator's web search looks first (#544)
# Music Assistant: the house's player brain for Home Assistant Assist —
# "spiele Einslive", playlists, podcasts on the speakers (ADR 0015). Host
# network for player discovery (mDNS, Chromecast, DLNA); Jellyfin is its
# music provider, Radio Browser its radio provider, the share's radio/
# stations its radio favourites, Audiobookshelf (once there) its books and
# podcasts (#646). Usable after `laib add`
# without a form (#526): post-deploy onboards it with Laib's administrator,
# adds both sources (Jellyfin through its own account `musicassistant`) and
# hands Home Assistant a token; Home Assistant's post-deploy then adds the
# "Music Assistant" integration and MA's Home Assistant plugin, through which
# the family signs in (Authelia → Home Assistant → Music Assistant).
hostNetwork: true
routes:
  - host: musik
    port: 8095
    exposure: internal
    auth: one_factor
secrets:
  - name: MA_ADMIN_PASSWORD          # MA_ADMIN_USER's, the break-glass login: post-deploy onboards a fresh Music Assistant with it
    login: {user: "${MA_ADMIN_USER}", host: musik, note: "Music-Assistant-Admin (Notzugang; die Familie meldet sich über Home Assistant an)"}
    dataBound: true                  # MA keeps only its hash: laib secret rotate refuses it (#353)
  - name: JELLYFIN_MA_PASSWORD       # the Jellyfin account `musicassistant` (#526, as homeassistant in #375): post-deploy sets it on every apply
  - name: JELLYFIN_ADMIN_PASSWORD    # media's: post-deploy makes the account musicassistant with it; without media no Jellyfin source
    external: true
    optional: true
  - name: ABS_MA_TOKEN               # minted by audiobookshelf's post-deploy (#646): the key of ABS's user musicassistant; without ABS none
    external: true
    optional: true
  - name: HA_MUSIC_ASSISTANT_TOKEN   # minted here (an administrator's long-lived MA token), for Home Assistant's integration and its check
    external: true
    optional: true
data:
  - path: ${DATA_DIR}/music-assistant/data
  - path: ${DATA_DIR}/file-share/data/radio      # the house's stations (*.m3u, *.strm): post-deploy reads them (#646); the share backs them up
    backup: false
  - path: ${DATA_DIR}/music-assistant/check     # music-assistant-check's status file (#785): made again by its timer
    backup: false
health:
  http: http://127.0.0.1:8095/
status:                            # the Box page's line (#785): "8 Lautsprecher, 2 spielen gerade · 24.878 Titel"
  file: ${DATA_DIR}/music-assistant/check/laib-status.json
  check: music-assistant-check.service
  stale: 20m
ports:
  - {port: 8095, lan: true}        # HA and the speakers at home
