name: haus
template: {registry: builtin, name: haus, version: 1}
provides: [haus]
# Haus (ADR 0014, mdopp/haus): the family's pages and the companion API the
# Android widgets speak. Loopback only; Caddy fronts it. /napi/ bypasses
# Authelia (device tokens), the pages are behind it.
after: [auth]
needs: [mcp]                     # talks to laib over host.containers.internal: laib.listen 0.0.0.0 (ADR 0012 §4)
routes:
  - host: haus
    port: 8650
    exposure: public               # the phone reaches /napi/ from outside; the pages are behind Authelia
    auth: one_factor
    bypass: [/napi/]
    proxySecret: HAUS_PROXY_SECRET # Caddy sends it as X-Haus-Proxy on the authenticated handler only (ADR 0012 §3)
secrets:
  - name: HAUS_LAIB_TOKEN          # minted on `laib add haus` as the haus hand: status, inbox, journal, restart — nothing else
    external: true
    mint: haus
  - name: HAUS_PROXY_SECRET        # generated; without it no page request counts (haus#1)
  - name: HAUS_HAUSHALT_TOKEN      # generated; the Bote's bearer for the Haushalt MCP (haus#11, #170)
  - name: HAUS_RADICALE_PASSWORD   # the Radicale account Haus writes the household's calendar with; without it no calendar tools
    external: true
    optional: true
  - name: HAUS_PAPERLESS_TOKEN     # a Paperless API token (haus#11): the Bote finds what that user sees; without it no document search
    external: true
    optional: true
  - name: HAUS_HA_TOKEN            # Home Assistant long-lived token (haus#10): Haus serves the house paths from Home Assistant; without it there are none
    external: true
    optional: true
data:
  - path: ${DATA_DIR}/haus         # devices.json: the paired phones (hashed tokens)
  - path: ${DATA_DIR}/haus-qmd     # the memory library's index and embed model (#195); beside ${DATA_DIR}/haus, not in it:
    backup: false                  # Haus relabels its own folder (:Z). A cache: the refresh timer rebuilds it, the first embed downloads the model
  - path: ${DATA_DIR}/file-share/data/notes   # the household's notes (ADR 0017), mounted for the Haushalt; declared here so it exists without file-share
    backup: false                             # backed up by file-share
  - path: ${DATA_DIR}/file-share/data/paperless-consume   # the app's camera uploads land here for Paperless (haus#10); transient
    backup: false
health:
  http: http://127.0.0.1:8650/healthz
ports:
  - {port: 8650, lan: false}
