name: haus
template: {registry: builtin, name: haus, version: 1}
provides: [haus]
# Haus (ADR 0014, mdopp/haus): the family's pages and the companion API the
# Android widgets speak. Loopback only; Caddy fronts it. /napi/ bypasses
# Authelia (device tokens), the pages are behind it.
after: [auth]
needs: [mcp]                     # talks to laib over host.containers.internal: laib.listen 0.0.0.0 (ADR 0012 §4)
routes:
  - host: haus
    port: 8650
    exposure: public               # the phone reaches /napi/ from outside; the pages are behind Authelia
    auth: one_factor
    bypass: [/napi/]
    proxySecret: HAUS_PROXY_SECRET # Caddy sends it as X-Haus-Proxy on the authenticated handler only (ADR 0012 §3)
    redirectFrom: ["@", www]       # ServiceBay's entry points (the domain itself and www.) lead to Haus (#360)
secrets:
  - name: HAUS_LAIB_TOKEN          # minted on `laib add haus` as the haus hand: status, inbox, journal, restart, person_invite, person_pending, calendar (#495) — nothing else
    external: true
    mint: haus
  - name: HAUS_PROXY_SECRET        # generated; without it no page request counts (haus#1)
  - name: HAUS_HAUSHALT_TOKEN      # generated; the Bote's bearer for the Haushalt MCP (haus#11, #170)
  - name: HAUS_RADICALE_PASSWORD   # the Radicale account `haus`, owner of the household's calendar: seeded by the auth template (#418); without it no calendar tools
    external: true
    optional: true
  - name: HAUS_PAPERLESS_TOKEN     # a Paperless API token (haus#11): the Bote finds what that user sees; without it no document search
    external: true
    optional: true
  - name: HAUS_HA_TOKEN            # minted by home-assistant's post-deploy (#349), an administrator's (haus#10): Haus serves the house paths from Home Assistant; without HA there are none
    external: true
    optional: true
  - name: BOTE_API_KEY             # the Bote's API key (#215), generated by laib add bote; without the Bote no Sprechen field
    external: true
    optional: true
  - name: USAGE_METRICS_TOKEN      # usage-metrics' bearer (#266), generated by laib add usage-metrics; without it Haus counts nothing
    external: true
    optional: true
data:
  - path: ${DATA_DIR}/haus         # devices.json: the paired phones (hashed tokens)
  - path: ${DATA_DIR}/haus-qmd     # the memory library's index and embed model (#195); beside ${DATA_DIR}/haus, not in it:
    backup: false                  # Haus relabels its own folder (:Z). A cache: the refresh timer rebuilds it, the first embed downloads the model
  - path: ${DATA_DIR}/haus-dokumente  # Paperless's documents as the library indexes them, one <id>.md each (#219); beside haus and haus-qmd:
    backup: false                    # both containers mount it (:z). A cache: the refresh rebuilds it from Paperless, their home
  - path: ${DATA_DIR}/file-share/data/notes   # the household's notes (ADR 0017), mounted for the Haushalt; declared here so it exists without file-share
    backup: false                             # backed up by file-share
  - path: ${DATA_DIR}/file-share/data/paperless-consume   # the app's camera uploads land here for Paperless (haus#10); transient
    backup: false
  - path: ${DATA_DIR}/file-share/samba-accounts   # where Haus hands a network-drive password to file-share (#296); without file-share no FIFO, no page
    backup: false
health:
  http: http://127.0.0.1:8650/healthz
ports:
  - {port: 8650, lan: false}
