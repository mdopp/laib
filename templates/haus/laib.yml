name: haus
template: {registry: builtin, name: haus, version: 1}
provides: [haus]
# Haus (ADR 0014, mdopp/haus): the family's pages and the companion API the
# Android widgets speak. Loopback only; Caddy fronts it. /napi/ bypasses
# Authelia (device tokens), the pages are behind it.
after: [auth]
needs: [mcp]                     # talks to laib over host.containers.internal: laib.listen 0.0.0.0 (ADR 0012 §4)
routes:
  - host: haus
    port: 8650
    exposure: public               # the phone reaches /napi/ from outside; the pages are behind Authelia anyway
    auth: one_factor
    bypass: [/napi/]
secrets:
  - name: HAUS_LAIB_TOKEN          # minted on `laib add haus` as the ops hand (reads, restarts)
    external: true
    mint: ops
  - name: HAUS_HUMAN_TOKEN         # laib token mint human --note haus-admin → verdicts from the phone and the Box page
    external: true
    optional: true
data:
  - path: ${DATA_DIR}/haus         # devices.json: the paired phones (hashed tokens)
health:
  http: http://127.0.0.1:8650/healthz
ports:
  - {port: 8650, lan: false}
