name: haus
template: {registry: builtin, name: haus, version: 1}
provides: [haus]
# Haus (ADR 0014, mdopp/haus): the family's pages and the companion API the
# Android widgets speak. Loopback only; Caddy fronts it. /napi/ bypasses
# Authelia (device tokens), the pages are behind it.
after: [auth]
routes:
  - host: haus
    port: 8650
    exposure: public               # the phone reaches /napi/ from outside; the pages are behind Authelia
    auth: one_factor
    bypass: [/napi/]
    proxySecret: HAUS_PROXY_SECRET # Caddy sends it as X-Haus-Proxy on the authenticated handler only (ADR 0012 §3)
secrets:
  - name: HAUS_LAIB_TOKEN          # minted on `laib add haus` as the haus hand: status, inbox, journal, restart — nothing else
    external: true
    mint: haus
  - name: HAUS_PROXY_SECRET        # generated; without it no page request counts (haus#1)
data:
  - path: ${DATA_DIR}/haus         # devices.json: the paired phones (hashed tokens)
health:
  http: http://127.0.0.1:8650/healthz
ports:
  - {port: 8650, lan: false}
