name: llama
provides: [model]
upstream: [https://github.com/ggml-org/llama.cpp]   # where the Operator's web search looks first (#544)
template: {registry: builtin, name: llama, version: 1}
# The model role (ADR 0011): llama-server in router mode behind the policy
# proxy that also serves the GPU lease. Host network (carve-out) so the
# proxy, the router and the embeddings server share loopback and every
# consumer reaches them at 127.0.0.1 (host services) or
# host.containers.internal (isolated pods).
hostNetwork: true
gpu: true
routes:
  - host: llama                  # llama.<domain>: humans with a browser, Authelia-gated
    port: 11435
    exposure: public
    auth: one_factor
secrets:
  - name: MODEL_API_KEY            # the model key (builtin MODEL_KEY on this box): generated on the first apply; a peer box sets the same value by hand
  - name: LLAMA_LAIB_TOKEN         # laib-lease's token for laib (ADR 0027), minted on apply as the lease hand: status, pause, resume, note
    external: true
    mint: lease
data:
  - path: ${DATA_DIR}/llama/models
    backup: false                # GGUF downloads; re-fetched by the hook, never backed up
  - path: ${DATA_DIR}/llama/lease
  - path: ${DATA_DIR}/llama/presets
    backup: false                # pre-start's copy of presets.json for the lease (#106)
health:
  http: http://127.0.0.1:11435/health
status:                          # which roles of the modes nobody provides; laib-lease writes it at every start (#374)
  file: ${DATA_DIR}/llama/lease/laib-status.json
ports:
  - {port: 11434, lan: false}    # the router, loopback only
  - {port: 11436, lan: false}    # embeddings
  # 11435 is deliberately reachable from the LAN (operator decision in
  # solarisbay #1420): the house may use its models without a login.
