name: archiv
title: Archiv
beschreibung: Deine Nachrichten, im Tresor nur für dich
# The message archive (ADR 0029, laib#985/#986): mdopp/archiv runs here,
# its own repo and image; this template is the box's part. Installed once
# per person (laib add archiv --person <p>), all instances behind one name,
# archiv.<domain>: Caddy hands a signed-in person to their own instance. No
# agent gets in: /p/<person>/, past Authelia with the instance's msgvault key,
# exists only when that person's values.yml sets AGENT_PATH (laib#1121, off
# by default, so the archive has one door, the person's login). Inside: the
# person's vault (gocryptfs, opened only with their Archiv-Passwort), the
# Briefkasten (packets imported while the vault is closed) and msgvault.
perPerson: true
uses: [radicale]   # the contacts and calendars, read only, while the vault is open (archiv#21)
private: sealed       # ADR 0032: no laib look, read, exec or write reaches the person's archive, for no hand
template: {registry: builtin, name: archiv, version: 1}
provides: [archiv]
routes:
  # Authelia does the login for the family group; Caddy sends the proxy
  # secret as X-Archiv-Proxy on the authenticated handler only, and the
  # supervisor serves only the instance's own person (ARCHIV_PERSON).
  - host: archiv
    port: 18540
    exposure: internal
    auth: two_factor   # owner, 2026-11-01: the door to the vault's page wants the second factor; the vault password protects the data
    group: family
    proxySecret: ARCHIV_PROXY_SECRET
    proxyHeader: X-Archiv-Proxy
secrets:
  - name: ARCHIV_PROXY_SECRET
  - name: ARCHIV_HOMES_SECRET     # Homes's way to /intern/… (haus#209: a phone's restore); Homes gets each instance's through its instances: (laib#1016)
    was: ARCHIV_HAUS_SECRET   # ADR 0031: the value moves along (#1021); goes once the box moved
  - name: ARCHIV_RADICALE_PASSWORD   # the archive's own Radicale login, archiv-<person> (laib#1009): the auth template seeds it, templates/radicale lets it read the person's contacts and calendars and write nothing
    account: archiv-${PERSON}
data:
  - path: ${DATA_DIR}/${SERVICE}               # the vault's cipher folder, the Briefkasten, the keys (outside the vault, ADR 0029 amendment), the status
  - path: ${DATA_DIR}/archiv-eingang/${PERSON}  # Homes writes the phone's backups here (haus#207); letzte/ holds the newest per source for a new phone:
    backup: false                              # itself a backup of the phone, and a 2.7 GB Signal file changing nightly would grow restic by that much
health:
  http: http://127.0.0.1:18540/healthz
status:
  file: ${DATA_DIR}/${SERVICE}/laib-status.json
ports:
  - {port: 18540, lan: false}   # on every address, so Homes's pod reaches /intern/ through host.containers.internal (laib#1016); the nftables drop keeps the LAN out
upstream:
  - https://github.com/mdopp/archiv
  - https://www.msgvault.io/docs/
