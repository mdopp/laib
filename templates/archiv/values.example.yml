ARCHIV_IMAGE: ghcr.io/mdopp/archiv:e795ae8e050062e4c3d6864abd8d2d3430e80052@sha256:15b840e6b15a2234f135dbd81ed4a3b35288e8f4b03d3abc274c3ada504f4653   # mdopp/archiv main with #34 (document mail, several mailboxes), CI green and signed 2026-11-11; pinned by digest (ADR 0034)
PROXY: !secret ARCHIV_PROXY_SECRET
HOMES_SECRET: !secret ARCHIV_HOMES_SECRET
RADICALE_PASSWORD: !secret ARCHIV_RADICALE_PASSWORD
IMMICH_URL: http://host.containers.internal:2283   # Immich as the container reaches it, for Umfeld (archiv#27); no key here: the person enters theirs into the vault
IMMICH_PUBLIC_URL: https://photos.${DOMAIN}         # where the archive's page opens a photo in Immich
# an agent's way to this person's archive at archiv.<domain>/p/<person>/, past the login with msgvault's key
# (laib#1121): off. Only the person decides to set it ("on"), in their instance's values.yml, by a proposal.
AGENT_PATH: 
# the household's document mailbox (archiv#34): the same as Paperless' PAPERLESS_MAIL_*; empty host: the archive does not read it
DOKUMENTE_MAIL_HOST: ""                   # e.g. imap.strato.de (Paperless' PAPERLESS_MAIL_HOST)
DOKUMENTE_MAIL_PORT: "993"                # TLS; 143 only with STARTTLS
DOKUMENTE_MAIL_USER: ""                   # the mailbox's login (Paperless' PAPERLESS_MAIL_USER)
DOKUMENTE_MAIL_DOMAIN: ${DOMAIN}          # of <person>+doc@<domain>: the domain of Paperless' PAPERLESS_MAIL_FILTER_TO
DOKUMENTE_MAIL_ORDNER: INBOX              # the folder Paperless reads (PAPERLESS_MAIL_FOLDER)
DOKUMENTE_MAIL_PASSWORD: !secret DOKUMENTE_MAIL_PASSWORD
