name: google-kalender
template: {registry: builtin, name: google-kalender, version: 1}
provides: [calendar-mirror]
# The family's Google calendars, mirrored one way into Radicale (#495; the
# owner's decision 2026-10-20: Google stays where appointments are made).
# A timer, no daemon: every quarter of an hour google-kalender.py reads each
# person's chosen calendars from Google's CalDAV with OAuth and writes them
# as that person, over CalDAV, into their collection google-<kalender>
# (never into Radicale's files, #371; never back to Google). Item paths are
# scripts/import-google.py's (#414), so a Takeout import is replaced, not
# doubled. How the owner sets it up once: README.md.
after: [radicale]
routes: []
secrets:
  - name: GOOGLE_KALENDER_KONTEN    # the OAuth client and each person's Google token and Radicale password, written by `konten` (README.md)
    external: true
    optional: true                  # not yet set up: the status says so, nothing runs against Google
data:
  - path: ${DATA_DIR}/google-kalender   # the status file and what the last run wrote; a mirror, Google is the source
    backup: false
health:
  none: "a timer, no daemon: each run writes laib-status.json, a failed run fails google-kalender-sync.service"
status:                             # the last run, in laib diag: an expired Google token, a refused password, a sync older than STALE_HOURS (#495)
  file: ${DATA_DIR}/google-kalender/laib-status.json
  check: google-kalender-sync.service
  stale: 30m                        # the timer runs every 15 min: older means it stopped, and a look starts a run
ports: []
