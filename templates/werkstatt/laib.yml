name: werkstatt
template: {registry: builtin, name: werkstatt, version: 1}
routes: []                       # dev.<domain> (the pi-web surface) comes with Haus; today: SSH + autoloop
provides: [werkstatt]
secrets:
  - name: WERKSTATT_SSH_PASSWORD
  - name: CLAUDE_CODE_OAUTH_TOKEN
    external: true
  - name: LAIB_CLAUDE_TOKEN
    external: true               # laib token mint claude --ttl 0 --note werkstatt
  - name: LAIB_PI_TOKEN
    external: true               # laib token mint pi --note werkstatt
  - name: WERKSTATT_GIT_TOKEN
    external: true               # fine-grained GitHub PAT: Contents rw, Issues r, Pull requests rw
data:
  - path: ${DATA_DIR}/werkstatt/workspace
health: {}
ports:
  - {port: 2222, lan: true}      # the mobile app attaches over SSH; key or password
