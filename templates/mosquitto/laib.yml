name: mosquitto
template: {registry: builtin, name: mosquitto, version: 1}
provides: [mqtt]
upstream: [https://github.com/eclipse/mosquitto, https://mosquitto.org/documentation/]   # where the Operator's web search looks first (#544)
# MQTT broker for devices and Home Assistant. mosquitto.conf from pre-start,
# the password file from post-deploy, hashed in the broker (#221).
# 1883 is open to the LAN on purpose: devices on Wi-Fi publish into it.
routes: []
secrets:
  - name: MQTT_PASSWORD
    login: {user: "${MQTT_USER}", note: "MQTT, Port 1883: die Geräte melden sich damit an"}   # a human's login: the recovery sheet lists it, --vaultwarden exports it (#441)
    devices: true                   # the door lock and the sensors hold it: never a rotate repair; after a rotation diag offers laib secret zurueck (#665)
data:
  - path: ${DATA_DIR}/mosquitto/config
  - path: ${DATA_DIR}/mosquitto/data
  - path: ${DATA_DIR}/mosquitto/check     # mosquitto-check's status file (#785): made again every 15 minutes
    backup: false
health: {none: "MQTT speaks no HTTP; the unit state is the check"}
status:                            # the Box page's line (#785): "5 Geräte und Dienste verbunden", from $SYS
  file: ${DATA_DIR}/mosquitto/check/laib-status.json
  check: mosquitto-check.service
  stale: 20m                       # the timer runs every 15 minutes; a look starts a check when it is older
ports:
  - {port: 1883, lan: true}
