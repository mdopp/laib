name: bote
template: {registry: builtin, name: bote, version: 1}
provides: [bote]
# The Bote (ADR 0016): Hermes as stock on Signal, Matrix and/or Telegram
# (#184: each optional, at least one), the Laib MCP as the hand `bote`, the
# Haus "Haushalt" MCP and Frage as tools. Up to six containers in one pod:
# hermes, signal-cli's daemon (only with Signal), the Automat (HA
# automations, #26), the approval relay (#48: code that sees the sender
# decides; only with an approval identity; Hermes holds no token that can
# approve), the persona engine (ADR 0020) and notify (ADR 0022 §3: a
# message for a person from box.yml people, on their channel, with
# `hermes send`), which share loopback.
needs: [mcp]                     # talks to laib over host.containers.internal: laib.listen 0.0.0.0 (ADR 0012 §4)
routes: []
secrets:
  - name: BOTE_LAIB_TOKEN            # minted on `laib add bote` as the bote hand (propose, note, escalate)
    external: true
    mint: bote
  - name: BOTE_APPROVER_TOKEN        # the relay's token (#48): minted on add as the approver hand — approve, reject, inbox, status, note, nothing else
    external: true
    mint: approver
  - name: BOTE_MODEL_KEY             # only for a cloud model
    external: true
    optional: true
  - name: BOTE_HA_TOKEN              # Home Assistant long-lived token → the Bote's `ha` tool (README); without it the tool is absent
    external: true
    optional: true
  - name: BOTE_NOTIFY_TOKEN          # bote-notify's bearer (#177), generated on add; Home Assistant's rest_command.mitteilung sends it
  - name: HAUS_HAUSHALT_TOKEN        # Haus's bearer for the Haushalt (haus#11, #170): generated by laib add haus; without Haus the tool is absent
    external: true
    optional: true
  - name: BOTE_MATRIX_TOKEN          # the Bote's Matrix access token (README); needed with MATRIX_HOMESERVER
    external: true
    optional: true
  - name: BOTE_TELEGRAM_TOKEN        # the bot token from @BotFather; needed with TELEGRAM_ALLOWED_USERS
    external: true
    optional: true
when:                                # a container exists only while one of its values is set (#184)
  bote-signal.container: [SIGNAL_ACCOUNT]
  bote-relay.container: [ADMIN_NUMBER, ADMIN_MXID]   # Telegram never approves
requires:                            # a set value needs these set too: literals at load, secrets at plan (#184)
  ADMIN_NUMBER: [SIGNAL_ACCOUNT]
  ADMIN_MXID: [MATRIX_HOMESERVER, ADMIN_ROOM]
  MATRIX_HOMESERVER: [MATRIX_TOKEN]
  TELEGRAM_ALLOWED_USERS: [TELEGRAM_TOKEN]
channels:                            # where the Bote talks and bote-notify delivers, each on while its value is set (#184)
  signal: SIGNAL_ACCOUNT
  matrix: MATRIX_HOMESERVER
  telegram: TELEGRAM_ALLOWED_USERS
data:
  - path: ${DATA_DIR}/bote/hermes    # config.yaml, .env, memory, sessions
  - path: ${DATA_DIR}/bote/signal    # signal-cli's linked device
  - path: ${DATA_DIR}/bote/automat   # automations deleted through the Automat, kept for restore
  - path: ${DATA_DIR}/bote/persona   # the persona engine's list of the Bote's tools, written by post-deploy
  - path: ${DATA_DIR}/bote/notify    # bote-notify's .env: the platform credentials only, written by post-deploy (#177)
    backup: false
health:
  http: http://127.0.0.1:8645/health # bote-notify, in every Bote; with Signal it asks signal-cli's /v1/about (#184)
ports:
  - {port: 8085, lan: false}         # signal-cli REST, loopback only (8080 is whoami, #46); first: the Box page's QR
  - {port: 8642, lan: false}         # Hermes' OpenAI-compatible API server; Haus's Sprechen field uses it
  - {port: 8643, lan: false}         # Automat MCP, loopback only
  - {port: 8644, lan: false}         # the persona engine's MCP (today Joshua), loopback only
  - {port: 8645, lan: false}         # bote-notify: POST /mitteilung with the bearer; Home Assistant (host network) calls it on 127.0.0.1
