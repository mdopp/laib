name: bote
title: Bote
beschreibung: Der Assistent in Signal und Co.
template: {registry: builtin, name: bote, version: 1}
provides: [bote]
# The Bote (ADR 0016): Hermes as stock on Signal, Matrix, Telegram and/or
# Discord (#184, #421: each optional, at least one), the Laib MCP as the hand `bote`, the
# Haus "Haushalt" MCP and Frage as tools. Up to five containers in one pod:
# hermes, signal-cli's daemon (only with Signal), the Automat (HA
# automations, #26), the persona engine (ADR 0020) and notify (ADR 0022 §3:
# a message for a person from box.yml people, on their channel, with
# `hermes send`), which share loopback. Nothing in the pod can approve:
# approvals happen only in the Inbox (#778, ADR 0012).
needs: [mcp]                     # talks to laib over host.containers.internal: laib.listen 0.0.0.0 (ADR 0012 §4)
uses: [home-assistant]           # talks to Home Assistant without after: (a box without it still loads); its planned stops explain these errors (laib planned, #978)
routes: []
secrets:
  - name: BOTE_LAIB_TOKEN            # minted on `laib add bote` as the bote hand (propose, note, escalate)
    external: true
    mint: bote
  - name: BOTE_MODEL_KEY             # only for a cloud model
    owner: {label: "Bote: Sprachmodell in der Cloud", warum: "Nur nötig, wenn der Bote das Sprachmodell eines Anbieters statt des eigenen der Box nutzen soll.", hilfe: "Beim Anbieter des Modells einen API-Schlüssel anlegen und hier einfügen."}   # set by the owner on the box page, „Schlüssel hinterlegen“ (#696)
    external: true
    optional: true
  - name: BOTE_HA_TOKEN              # minted by home-assistant's post-deploy (#349) for HA's non-admin user bote → the `ha` tool; without HA the tool is absent
    external: true
    optional: true
  - name: BOTE_AUTOMAT_HA_TOKEN      # minted the same, an administrator's: the Automat only (HA's automation config API is admin-only); without it no automat
    external: true
    optional: true
  - name: BOTE_NOTIFY_TOKEN          # bote-notify's bearer (#177), generated on add; Home Assistant's rest_command.mitteilung sends it
  - name: BOTE_API_KEY               # Hermes' API server key (#215), generated on add; Haus's Sprechen field sends it
  - name: HAUS_HAUSHALT_TOKEN        # Haus's bearer for the Haushalt (haus#11, #170): generated by laib add haus; without Haus the tool is absent
    external: true
    optional: true
  - name: GESUNDHEIT_BOTE_TOKEN      # Gesundheit's bearer for its MCP (laib#893, #894): generated by laib add gesundheit; without it the tool is absent
    external: true
    optional: true
  - name: BOTE_MATRIX_TOKEN          # the Bote's Matrix access token (README); needed with MATRIX_HOMESERVER
    owner: {label: "Bote: Matrix", warum: "Damit könnt ihr dem Boten über Matrix schreiben.", hilfe: "Mit dem Konto des Boten in Element anmelden, dann Einstellungen → Hilfe und Info → Zugriffstoken kopieren.", link: "https://app.element.io/"}   # set by the owner on the box page, „Schlüssel hinterlegen“ (#696)
    external: true
    optional: true
  - name: BOTE_TELEGRAM_TOKEN        # the bot token from @BotFather; needed with TELEGRAM_ALLOWED_USERS
    owner: {label: "Bote: Telegram", warum: "Damit könnt ihr dem Boten über Telegram schreiben.", hilfe: "In Telegram @BotFather schreiben, /newbot senden, einen Namen wählen und das Token kopieren, das er zurückschickt.", link: "https://t.me/BotFather"}   # set by the owner on the box page, „Schlüssel hinterlegen“ (#696)
    external: true
    optional: true
  - name: BOTE_DISCORD_TOKEN         # the bot token from Discord's Developer Portal (README); needed with DISCORD_ALLOWED_USERS
    owner: {label: "Bote: Discord", warum: "Damit könnt ihr dem Boten über Discord schreiben.", hilfe: "Im Discord Developer Portal eine Application anlegen, unter Bot auf „Reset Token“ tippen und das Token kopieren.", link: "https://discord.com/developers/applications"}   # set by the owner on the box page, „Schlüssel hinterlegen“ (#696)
    external: true
    optional: true
  - name: USAGE_METRICS_TOKEN        # usage-metrics' bearer (#266), generated by laib add usage-metrics; without it the Bote counts nothing
    external: true
    optional: true
when:                                # a container exists only while one of its values is set (#184)
  bote-signal.container: [SIGNAL_ACCOUNT]
requires:                            # a set value needs these set too: literals at load, secrets at plan (#184)
  ADMIN_NUMBER: [SIGNAL_ACCOUNT]
  MATRIX_HOMESERVER: [MATRIX_TOKEN]
  TELEGRAM_ALLOWED_USERS: [TELEGRAM_TOKEN]
  DISCORD_ALLOWED_USERS: [DISCORD_TOKEN]
channels:                            # where the Bote talks and bote-notify delivers, each on while its value is set (#184)
  signal: SIGNAL_ACCOUNT
  matrix: MATRIX_HOMESERVER
  telegram: TELEGRAM_ALLOWED_USERS
  discord: DISCORD_ALLOWED_USERS
data:
  - path: ${DATA_DIR}/bote/hermes    # config.yaml, .env, memory, sessions
  - path: ${DATA_DIR}/bote/signal    # signal-cli's linked device
  - path: ${DATA_DIR}/bote/automat   # automations deleted through the Automat, kept for restore
  - path: ${DATA_DIR}/bote/persona   # the persona engine's list of the Bote's tools, written by post-deploy
  - path: ${DATA_DIR}/bote/notify    # bote-notify's .env: the platform credentials only, written by post-deploy (#177)
    backup: false
  - path: ${DATA_DIR}/file-share/data/paperless-consume   # Paperless' consume folder: bote-notify files what was sent with "ablegen" (#521); transient
    backup: false
  - path: ${DATA_DIR}/bote/check     # bote-check's status file (#785): made again by its timer
    backup: false
health:
  http: http://127.0.0.1:8645/health # bote-notify, in every Bote; with Signal it asks signal-cli's daemon /api/v1/check (#184, #469)
status:                            # the Box page's line (#785): "Signal verbunden · letzte 7 Tage: 42 Gespräche, 3 unbeantwortet"
  file: ${DATA_DIR}/bote/check/laib-status.json
  check: bote-check.service
  stale: 20m
ports:
  - {port: 8085, lan: false, when: [SIGNAL_ACCOUNT]}  # signal-cli REST, loopback only (8080 is whoami, #46); first: the Box page's QR; without Signal neither declared nor published (#190)
  - {port: 8642, lan: false}         # Hermes' OpenAI-compatible API server, with BOTE_API_KEY; published beyond loopback for Haus's Sprechen field (#215)
  - {port: 8643, lan: false}         # Automat MCP, loopback only
  - {port: 8644, lan: false}         # the persona engine's MCP (today Joshua), loopback only
  - {port: 8645, lan: false}         # bote-notify: POST /mitteilung with the bearer; Home Assistant (host network) on 127.0.0.1, Gesundheit (a pod) over host.containers.internal (#894); nftables keeps the LAN out
