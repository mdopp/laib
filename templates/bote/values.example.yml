HERMES_IMAGE: docker.io/nousresearch/hermes-agent:v0.22.2
SIGNAL_IMAGE: docker.io/bbernhard/signal-cli-rest-api:latest
# Channels (#184): each optional, at least one. A channel is on while its
# first value is set; an empty one leaves no container and no Hermes entry.
SIGNAL_ACCOUNT: "+4915112345678"          # Signal: the Bote's own number, E.164, linked once via QR (README)
SIGNAL_ALLOWED_USERS: "+4915198765432"    # who else may talk to the Bote on Signal, comma-separated (ADR 0016 §5); everyone in box.yml people with a signal: id may anyway (#586)
MATRIX_HOMESERVER: ""                     # Matrix: the Bote's homeserver, https://matrix.example.org; secret BOTE_MATRIX_TOKEN
MATRIX_ALLOWED_USERS: ""                  # who may talk to the Bote on Matrix, comma-separated Matrix IDs
MATRIX_TOKEN: !secret BOTE_MATRIX_TOKEN
TELEGRAM_ALLOWED_USERS: ""                # Telegram: who may talk to the bot, numeric user ids, plus box.yml people's telegram: ids (#586); secret BOTE_TELEGRAM_TOKEN
TELEGRAM_TOKEN: !secret BOTE_TELEGRAM_TOKEN
DISCORD_ALLOWED_USERS: ""                 # Discord: who may talk to the bot, numeric user ids (#421); secret BOTE_DISCORD_TOKEN
DISCORD_TOKEN: !secret BOTE_DISCORD_TOKEN
# Hermes' home channel: where the Bote writes the admin of its own accord. Approvals happen only in
# the Inbox (#778), never in a chat.
ADMIN_NUMBER: ""                          # the admin's Signal number, E.164; needs Signal
ADMIN_ROOM: ""                            # the admin's unencrypted Matrix room with the Bote, !id:server; needs Matrix
MODEL_NAME: qwen3.6-35b-a3b
THINKING_MODEL: qwen3.6-35b-a3b
COMPACT_TOKENS: 32000                     # Hermes compresses a conversation once a prompt passes this many tokens (#502, README "Speed")
LAIB_TOKEN: !secret BOTE_LAIB_TOKEN
MODEL_KEY: !secret BOTE_MODEL_KEY
HAUSHALT_MCP_URL: http://host.containers.internal:8650/mcp/haushalt   # Haus's Haushalt (haus#11): calendar, notes, reminders; left out until Haus answers with the token (#170)
GESUNDHEIT_MCP_URL: http://host.containers.internal:18529/mcp   # Gesundheit (laib#893): the daily note and a person's values; left out until it answers with the token
FRAGE_URL: http://host.containers.internal:8710/mcp         # Frage as an MCP tool (templates/frage serves /mcp); left out when it does not answer
PAPERLESS_URL: http://host.containers.internal:8000   # "ablegen" with a photo or PDF files it into Paperless (#521); left out when Paperless does not answer
HA_URL: http://host.containers.internal:8123   # Home Assistant, for the `ha` tool and the Automat (used once its tokens are minted)
AUTOMAT_IMAGE: ghcr.io/mdopp/laib-automat:latest   # the automation tool; needs BOTE_AUTOMAT_HA_TOKEN
HA_TOKEN: !secret BOTE_HA_TOKEN                 # minted by Home Assistant's post-deploy (#349): the non-admin user bote
AUTOMAT_HA_TOKEN: !secret BOTE_AUTOMAT_HA_TOKEN # minted the same: an administrator's, for the Automat only
PERSONA_IMAGE: ghcr.io/mdopp/laib-persona:latest  # the persona engine (ADR 0020); today Joshua
LAIB_MCP_URL: http://host.containers.internal:5900/mcp
LAIB_TOOLS_TRUST: untrusted                    # the Laib tools in Hermes (#524): untrusted asks in the chat before propose, note, escalate; full does not (approving stays the Inbox's, #778)
USAGE_URL: http://host.containers.internal:8094  # usage-metrics (#266): tool calls, turns, unanswered turns; used only with its token
NOTIFY_TOKEN: !secret BOTE_NOTIFY_TOKEN         # bote-notify (#177): Home Assistant sends it with rest_command.mitteilung
CHECK_IMAGE: docker.io/library/python:3.13-alpine    # bote-check.py, the standard library only (#785)
USAGE_TOKEN: !secret USAGE_METRICS_TOKEN     # bote-check reads the week's conversations with it (#785); empty without usage-metrics
