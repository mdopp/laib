name: frage-image
on:
  push:
    branches: [main]
    paths: ["frage/**", "mcpserver/**", "go.mod", "go.sum"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  id-token: write # cosign signs keyless with this workflow's identity (ADR 0034)
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: frage/Containerfile
          push: true
          tags: ghcr.io/mdopp/laib-frage:latest,ghcr.io/mdopp/laib-frage:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/mdopp/laib
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
        if: github.event_name != 'pull_request'
      - name: sign the image; Laib proposes a digest of ours only with this signature (ADR 0034)
        if: github.event_name != 'pull_request'
        run: cosign sign --yes ghcr.io/mdopp/laib-frage@${{ steps.build.outputs.digest }}
