name: automat-image
on:
  push:
    branches: [main]
    paths: ["automat/**", "mcpserver/**", "go.mod", "go.sum"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  id-token: write # cosign signs keyless with this workflow's identity (ADR 0034)
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: automat/Containerfile
          push: true
          tags: ghcr.io/mdopp/laib-automat:latest,ghcr.io/mdopp/laib-automat:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/mdopp/laib
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: sigstore/cosign-installer@v3
        if: github.event_name != 'pull_request'
      - name: sign the image; Laib proposes a digest of ours only with this signature (ADR 0034)
        if: github.event_name != 'pull_request'
        run: cosign sign --yes ghcr.io/mdopp/laib-automat@${{ steps.build.outputs.digest }}
