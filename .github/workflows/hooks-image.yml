name: hooks-image
on:
  push:
    branches: [main]
  pull_request:
    paths: ["hooks/**", ".github/workflows/hooks-image.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: hooks/Containerfile
          push: true
          tags: ${{ github.event_name == 'push' && 'ghcr.io/mdopp/laib-hooks:latest,' || '' }}ghcr.io/mdopp/laib-hooks:${{ github.sha }}
