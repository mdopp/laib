name: directory-image
on:
  push:
    branches: [main]
    paths: ["directory/**", "mcpserver/**", "go.mod", "go.sum"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: directory/Containerfile
          push: true
          tags: ghcr.io/mdopp/laib-directory:latest,ghcr.io/mdopp/laib-directory:${{ github.sha }}
