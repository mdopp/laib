name: joshua-image
on:
  push:
    branches: [main]
    paths: ["cmd/joshua/**", "internal/joshua/**", "internal/mcpserver/**", "joshua/**", "go.mod", "go.sum"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: joshua/Containerfile
          push: true
          tags: ghcr.io/mdopp/laib-joshua:latest,ghcr.io/mdopp/laib-joshua:${{ github.sha }}
