# Releases come from here only (CLAUDE.md, ADR 0003): release-please cuts
# the version on main, and the binaries are built after a green vm-install
# of that very code — a release never ships code no VM has run (#47). The
# same code is enough: a tree that had a green run, differing from the
# release commit's in release-please's files at most (#604).
# Every asset carries build provenance (actions/attest-build-provenance):
# `gh attestation verify laib-linux-amd64 -R mdopp/laib` on a laptop proves
# which workflow built it from which commit. On the box install-box.sh
# checks SHA256SUMS (CoreOS has no gh); the attestation covers SHA256SUMS too.
name: release
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      sha: ${{ steps.rp.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        # no release-type input: with it the action ignores release-please-config.json,
        # and the extra-files (README, ZIELBILD version lines, drift check 9) never bump
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  binary:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write      # dispatch vm-install for the release commit when no run exists
      id-token: write     # provenance
      attestations: write
      packages: write     # the images of laib's own programs: operator, notify, haushalt, lease (ADR 0027)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          fetch-depth: 20   # the merge before the release and the train head it merged (#604)
      - name: wait for a green vm-install of this code
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          # the same code, proven (#604): a green vm-install of a tree that differs from this commit's
          # in release-please's files at most, typically the train head main merged before the release
          reused() {
            local r run of tree why
            r=$(scripts/vm-install-reuse.sh HEAD) || return 1
            read -r run of tree why <<<"$r"
            echo "reusing vm-install run $run of $of (only release files differ: $why, tree $tree)"
          }
          reused && exit 0
          # '.[]', not '.[0]': with no run, '.[0]' prints "null null null" and the
          # dispatch below never happened — v0.4.0 waited 150 minutes for nothing (#99)
          # not a pull_request run: a single PR's run is green with nothing but its `not run` check (#343)
          run_for_sha() { gh run list --workflow vm-install --commit "$sha" --json databaseId,status,conclusion,event --limit 20 -q '[.[] | select(.event != "pull_request")][:1][] | "\(.databaseId) \(.status) \(.conclusion)"'; }
          if [ -z "$(run_for_sha)" ]; then
            echo "no green vm-install of this code and no run for $sha: dispatching one on $TAG"
            gh workflow run vm-install --ref "$TAG"
            sleep 30
          fi
          for i in $(seq 1 150); do
            reused && exit 0   # main's run of the merge may finish first
            read -r id status conclusion <<<"$(run_for_sha)"
            echo "vm-install $id: $status $conclusion"
            if [ "$status" = completed ]; then
              [ "$conclusion" = success ] && exit 0
              echo "vm-install $id is $conclusion: no release for $sha"; exit 1
            fi
            sleep 60
          done
          echo "vm-install did not finish in time"; exit 1
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # laib-operator, laib-notify, laib-haushalt and laib-lease are containers
      # (ADR 0027): their images are built from this tag and pinned by digest
      # into this laib, so they move with it — the self-update brings them, a
      # self rollback takes the previous laib's back. The release carries no
      # binary of them.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: operator
        uses: docker/build-push-action@v6
        with:
          context: .
          file: operator/Containerfile
          push: true
          tags: ghcr.io/mdopp/laib-operator:${{ needs.release-please.outputs.tag }}
      - id: notify
        uses: docker/build-push-action@v6
        with:
          context: .
          file: notify/Containerfile
          push: true
          tags: ghcr.io/mdopp/laib-notify:${{ needs.release-please.outputs.tag }}
      - id: haushalt
        uses: docker/build-push-action@v6
        with:
          context: .
          file: haushalt/Containerfile
          push: true
          tags: ghcr.io/mdopp/laib-haushalt:${{ needs.release-please.outputs.tag }}
      - id: lease
        uses: docker/build-push-action@v6
        with:
          context: .
          file: lease/Containerfile
          push: true
          tags: ghcr.io/mdopp/laib-lease:${{ needs.release-please.outputs.tag }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/mdopp/laib-operator
          subject-digest: ${{ steps.operator.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/mdopp/laib-notify
          subject-digest: ${{ steps.notify.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/mdopp/laib-haushalt
          subject-digest: ${{ steps.haushalt.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/mdopp/laib-lease
          subject-digest: ${{ steps.lease.outputs.digest }}
          push-to-registry: true
      - name: laib, with the four images pinned by digest
        env:
          OPERATOR: ghcr.io/mdopp/laib-operator@${{ steps.operator.outputs.digest }}
          NOTIFY: ghcr.io/mdopp/laib-notify@${{ steps.notify.outputs.digest }}
          HAUSHALT: ghcr.io/mdopp/laib-haushalt@${{ steps.haushalt.outputs.digest }}
          LEASE: ghcr.io/mdopp/laib-lease@${{ steps.lease.outputs.digest }}
        run: |
          set -euo pipefail
          for i in "$OPERATOR" "$NOTIFY" "$HAUSHALT" "$LEASE"; do case "$i" in *@sha256:?*) ;; *) echo "no digest for the image: $i"; exit 1;; esac; done
          r=github.com/mdopp/laib/internal/render
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w -X main.Version=${{ needs.release-please.outputs.tag }} -X $r.OperatorImage=$OPERATOR -X $r.NotifyImage=$NOTIFY -X $r.HaushaltImage=$HAUSHALT -X $r.LeaseImage=$LEASE" -o laib-linux-amd64 ./cmd/laib
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w" -o laib-disk-linux-amd64 ./disk/cmd/laib-disk
      - run: |
          for t in linux-amd64 darwin-arm64 darwin-amd64 windows-amd64; do
            ext=""; [ "$t" = windows-amd64 ] && ext=.exe
            CGO_ENABLED=0 GOOS=${t%-*} GOARCH=${t#*-} go build -ldflags "-s -w -X main.Version=${{ needs.release-please.outputs.tag }}" -o laib-stick-$t$ext ./stick/cmd/laib-stick
          done
      - run: cp scripts/boot-check.sh laib-boot-check.sh && cp scripts/host-image.sh laib-host-image.sh && cp scripts/install-box.sh laib-install-box.sh && cp scripts/self-update.sh laib-self-update.sh   # the boot check and the host image follower (#368), the installer and Laib's own update (#547), verified with the binaries
      - run: sha256sum laib-* > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            laib-*
            SHA256SUMS
      - run: gh release upload "${{ needs.release-please.outputs.tag }}" laib-linux-amd64 laib-disk-linux-amd64 laib-boot-check.sh laib-host-image.sh laib-install-box.sh laib-self-update.sh laib-stick-* SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
