# The first install, end to end, in a VM on the runner: laib-stick builds the
# ISO, QEMU/KVM boots it, the live system installs Fedora CoreOS to a virtual
# disk and reboots, and the first boot installs THIS commit: install-box.sh and
# the binaries are served from the runner (QEMU's user net reaches it as
# 10.0.2.2), so a change to `laib init`, the first-boot script or install-box.sh
# is tested before it ships (#38). Then we SSH in and do real work on the box.
# This is the closest thing to the NUC without the NUC. BIOS boot (the EFI
# boot-order step is the NUC's job; post-install.sh tolerates no EFI).
#
# Every remote script runs under `set -euo pipefail`, and every probe is its own
# command that can fail: a step that passes has checked what its name says.
name: vm-install
on:
  push:
    branches: [main]
    paths: [usb/**, stick/**, scripts/install-box.sh, cmd/laib/**, internal/**, operator/**, templates/**, .github/workflows/vm-install.yml]
  pull_request:
    # the install path only: kernel PRs dispatch this job when they need it (Actions minutes)
    paths: [usb/**, stick/**, scripts/install-box.sh, .github/workflows/vm-install.yml]
  workflow_dispatch:
concurrency:
  group: vm-install-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  packages: write   # this commit's hooks image (#36)
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # install, mirror sync, two reinstalls and the disaster recovery take ~80 min on the runner
    env:
      SRC: http://10.0.2.2:8000   # this commit's build, as the box sees the runner
      HOOKS: ghcr.io/mdopp/laib-hooks:${{ github.sha }}   # the hooks image of this commit (#36)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: this commit's hooks image, pushed so the box can pull it
        run: |
          podman login ghcr.io -u "${{ github.actor }}" -p "${{ github.token }}"
          podman build -q -t "$HOOKS" -f hooks/Containerfile . && podman push -q "$HOOKS"
          echo "pushed $HOOKS"
      - name: qemu + kvm
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86 qemu-utils
          test -e /dev/kvm && sudo chmod 666 /dev/kvm && echo "kvm ok"
      - name: this commit's build, served to the box; the stick
        run: |
          ssh-keygen -q -t ed25519 -N "" -f key
          go build -o laib-stick ./stick/cmd/laib-stick
          # the release's asset names, plus VERSION, plus install-box.sh: what --source expects
          mkdir -p dist
          for b in laib laib-operator laib-lease; do src=./cmd/$b; [ $b = laib-operator ] && src=./operator/cmd/$b; CGO_ENABLED=0 go build -ldflags "-s -w -X main.Version=${GITHUB_SHA::7}" -o dist/$b-linux-amd64 $src; done
          cp scripts/install-box.sh dist/install-box.sh
          (cd dist && sha256sum laib-*-amd64 > SHA256SUMS && cat SHA256SUMS)
          printf '%s' "${GITHUB_SHA::7}" > dist/VERSION
          nohup python3 -m http.server 8000 --bind 127.0.0.1 --directory dist > http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/VERSION >/dev/null 2>&1 && break; sleep 1; done
          echo "serving $(curl -fsS http://127.0.0.1:8000/VERSION) on :8000"
          ./laib-stick --yes --hostname vm --domain vm.test --lan-ip 10.0.2.15 --ssh-key key.pub --token "${{ github.token }}" --source "$SRC" --tls internal --out laib-vm.iso
          # the same box, a stick that may reinstall it (#33): a plain stick refuses an installed box
          ./laib-stick --yes --hostname vm --domain vm.test --lan-ip 10.0.2.15 --ssh-key key.pub --token "${{ github.token }}" --source "$SRC" --tls internal --reinstall --out laib-vm-reinstall.iso
          ls -la laib-vm.iso laib-vm-reinstall.iso
      - name: cross-check with coreos-installer, serial console for the log
        run: |
          CI_IMG=quay.io/coreos/coreos-installer:release
          podman run --rm -v "$PWD:/data:z" -w /data $CI_IMG iso ignition show laib-vm.iso > live.ign
          python3 -c "import json; d=json.load(open('live.ign')); print('units:', [u['name'] for u in d['systemd']['units']]); print('files:', [f['path'] for f in d['storage']['files']])"
          for iso in laib-vm.iso laib-vm-reinstall.iso; do
            podman run --rm -v "$PWD:/data:z" -w /data $CI_IMG iso kargs modify -a console=ttyS0,115200n8 "$iso"
          done
      - name: boot, install, reboot, first boot — of this commit
        run: |
          # three disks: the OS goes to the smallest (pre-install), the largest
          # becomes the data RAID1 with one member (laib-data-disk), the third
          # joins as the mirror later in this job
          # the runner has ~14 GB free: zero writes (the mirror sync copies a
          # mostly empty 9G member) must punch holes in the qcow2 files, not fill them
          qemu-img create -q -f qcow2 disk.qcow2 8G
          qemu-img create -q -f qcow2 data1.qcow2 9G
          qemu-img create -q -f qcow2 data2.qcow2 9G
          # a fourth disk that turns up after the install (#32): ext4 with a file on it, larger
          # than the data disks, so "the largest disk" would have been it
          mkdir -p foreign && echo "keep me" > foreign/marker
          truncate -s 12G foreign.raw && mkfs.ext4 -q -F -L backup -d foreign foreign.raw
          df -h / | tail -1
          cat > vm.sh <<'EOF'
          #!/usr/bin/env bash
          # $1 = qemu -boot argument: order=cd (disk first, empty disk falls through to the stick),
          # once=d (the stick once = reinstall; without "once" the VM would reinstall forever,
          # the job the EFI post-install step does on real hardware), order=c (the disk only)
          # DISKS = the drives in this order (default: the OS disk and the two data disks)
          drives=()
          for d in ${DISKS:-disk.qcow2 data1.qcow2 data2.qcow2}; do
            f=qcow2; [[ $d == *.raw ]] && f=raw
            # the OS disk without QEMU's zero detection: detect-zeroes=unmap turns the guest's
            # zero writes into qcow2 discards, and a hard reset in the middle of that left a
            # root no real disk would (#81: the same cut was green in run 38308352527 without it,
            # red with it, and a guest-side sync did not help). The data disks keep it (thin images).
            if [ "$d" = disk.qcow2 ]; then drives+=(-drive "file=$d,if=virtio,format=$f")
            else drives+=(-drive "file=$d,if=virtio,format=$f,discard=unmap,detect-zeroes=unmap"); fi
          done
          rm -f qmp.sock
          qemu-system-x86_64 -enable-kvm -cpu host -m 4096 -smp 2 -display none -daemonize \
            -pidfile qemu.pid -serial file:serial.log -qmp unix:qmp.sock,server,nowait "${drives[@]}" \
            -cdrom "${ISO:-laib-vm.iso}" -boot $1 \
            -nic user,model=virtio,hostfwd=tcp::2222-:22,hostfwd=tcp::18080-:8080
          EOF
          # a clean power-off (QEMU gone), and waiting for laib after a boot
          # every remote script runs laib as $L = lw: a verb that meets the apply lock (exit 4,
          # docs/INTERFACE.md) tries again for up to 3 min; any other exit code fails as before.
          # The box's converge timer fires 2 min after each boot, while a step may be at its
          # first mutating verb (#211).
          cat > box.sh <<'EOF'
          SSH="ssh -q -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 -i key -p 2222 core@127.0.0.1"
          off() { local p; p=$(cat qemu.pid 2>/dev/null) || return 0; $SSH 'sudo systemctl poweroff' || true
            for i in $(seq 1 60); do kill -0 "$p" 2>/dev/null || return 0; sleep 2; done; sudo kill "$p"; sleep 3; }
          ready() { for i in $(seq 1 90); do $SSH 'curl -fsS http://127.0.0.1:5900/ready' >/dev/null 2>&1 && { echo "ready after $((i*10)) s"; return 0; }; sleep 10; done
            echo "laib never became ready"; return 1; }
          marker() { debugfs -R "cat /marker" foreign.raw 2>/dev/null | grep -qx "keep me" || { echo "the file on the foreign disk is gone"; return 1; }; echo "foreign disk: its file is intact"; }
          EOF
          chmod +x vm.sh; ./vm.sh order=cd
          SSH="ssh -q -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 -i key -p 2222 core@127.0.0.1"
          for i in $(seq 1 120); do
            # ready AND the first-boot unit finished (it applies and shreds the token after serve is up)
            if $SSH 'systemctl is-active --quiet laib-firstboot.service && curl -fsS http://127.0.0.1:5900/ready' 2>/dev/null; then echo; echo "ready after $((i*10)) s"; break; fi
            [ $i -eq 120 ] && { echo "laib never became ready"; exit 1; }
            sleep 10
          done
          $SSH 'set -euo pipefail
                systemctl status laib-firstboot --no-pager | head -5 || true
                v=$(/var/opt/laib/laib version); echo "$v"
                [ "$v" = "laib '"${GITHUB_SHA::7}"'" ] || { echo "first boot did not install this commit"; exit 1; }
                if [ -e /etc/laib/firstboot.env ]; then echo "firstboot.env still on disk"; exit 1; fi
                test -f /etc/laib/installed || { echo "the first-boot marker is missing"; exit 1; }
                # the end of the first boot is on disk where GRUB reads it (no journal replay, #81)
                systemctl is-active --quiet laib-boot-flag.service || { echo "laib-boot-flag did not run"; systemctl status --no-pager laib-boot-flag.service; exit 1; }
                if sudo debugfs -D -R "ls /" /dev/disk/by-label/boot 2>/dev/null | grep -q ignition.firstboot; then echo "GRUB still sees ignition.firstboot: a power cut now re-runs Ignition (#81)"; exit 1; fi
                echo "first boot over, on disk too"
                test -s ~/.config/containers/auth.json || { echo "the registry login is not in ~/.config/containers/auth.json (#37)"; exit 1; }
                journalctl --no-pager -b -u laib-firstboot | grep -q -- "--token" && { echo "the token was on argv"; exit 1; } || echo "token never on argv"
                /var/opt/laib/laib status || true; /var/opt/laib/laib plan || true; /var/opt/laib/laib diag || true'
      - name: the data disk — RAID1 with one member on /mnt/data, then the mirror joins
        run: |
          SSH="ssh -q -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i key -p 2222 core@127.0.0.1"
          $SSH 'set -euo pipefail
                journalctl --no-pager -b -u laib-data-disk | tail -12
                cat /proc/mdstat; cat /etc/laib/data-disk
                grep -q "md.* xfs" <<<"$(findmnt -n -o SOURCE,FSTYPE /mnt/data)" || { echo "/mnt/data is not the RAID"; exit 1; }
                grep -q "\[U_\]" /proc/mdstat || { echo "array should be degraded by design"; exit 1; }
                lsblk -ndo NAME,SIZE /dev/vda /dev/vdb /dev/vdc
                echo "laib data disk marker $(date -u +%s)" | tee /mnt/data/laib/vm-marker
                # the mirror: the untouched 9G disk (no partitions) joins through laib disk add, resync to [UU]
                spare=""; for d in /dev/vd?; do if [ "$(lsblk -nro NAME "$d" | wc -l)" = 1 ]; then spare=$d; fi; done
                echo "spare: $spare"; test -n "$spare"
                export LAIB_HOME=/mnt/data/laib LAIB_ACTOR=human:core; L=lw; lw() { local i rc; for i in $(seq 1 60); do rc=0; /var/opt/laib/laib "$@" || rc=$?; [ "$rc" = 4 ] || return "$rc"; echo "laib $1: the lock is busy (the converge timer, #211), trying again" >&2; sleep 3; done; return 4; }
                $L disk status
                $L disk add "$spare"
                for i in $(seq 1 120); do grep -q "\[UU\]" /proc/mdstat && break; sleep 2; done
                $L disk status; $L diag || true
                grep -q "\[UU\]" /proc/mdstat || { echo "mirror did not sync"; exit 1; }
                grep -q MEMBERS=2 /etc/laib/data-disk
                sudo sync'
          df -h / | tail -1; ls -la *.qcow2
      - name: a disk that turns up later is never claimed — reboot with a foreign ext4 disk
        run: |
          . ./box.sh
          off
          DISKS="disk.qcow2 data1.qcow2 data2.qcow2 foreign.raw" ./vm.sh order=c
          ready
          $SSH 'set -euo pipefail
                journalctl --no-pager -b -u laib-data-disk | tail -8
                cat /proc/mdstat; cat /etc/laib/data-disk
                grep -q "md.* xfs" <<<"$(findmnt -n -o SOURCE,FSTYPE /mnt/data)" || { echo "/mnt/data is not the RAID"; exit 1; }
                grep -q "\[UU\]" /proc/mdstat || { echo "the mirror did not come back"; exit 1; }
                grep -q MEMBERS=2 /etc/laib/data-disk || { echo "the record lost the mirror"; exit 1; }
                dev=$(sudo blkid -L backup) || { echo "the foreign disk lost its filesystem"; exit 1; }
                [ "$(sudo blkid -s TYPE -o value "$dev")" = ext4 ] || { echo "the foreign disk is no longer ext4"; exit 1; }
                echo "foreign disk $dev: still ext4, label backup"'
          marker
      - name: a stick left in an installed box does nothing — the plain stick refuses
        run: |
          . ./box.sh
          sudo kill "$(cat qemu.pid)"; sleep 3
          # the plain stick, booted on purpose (as a USB-first firmware would): it must stop before any disk is touched
          DISKS="disk.qcow2 data1.qcow2 data2.qcow2 foreign.raw" ./vm.sh once=d
          for i in $(seq 1 60); do grep -aq "Diese Box ist schon installiert" serial.log && break; sleep 5; done
          grep -a "Diese Box ist schon installiert" serial.log | tail -1 || { echo "the plain stick did not refuse an installed box"; tail -c 4000 serial.log; exit 1; }
          sleep 20   # time for a wrong install to start, if one would
          sudo kill "$(cat qemu.pid)"; sleep 3
          DISKS="disk.qcow2 data1.qcow2 data2.qcow2 foreign.raw" ./vm.sh order=c
          ready
          $SSH 'set -euo pipefail
                v=$(/var/opt/laib/laib version); [ "$v" = "laib '"${GITHUB_SHA::7}"'" ] || { echo "the box changed: $v"; exit 1; }
                boots=$(journalctl --list-boots --no-pager | wc -l); echo "boots in the journal: $boots"
                [ "$boots" -ge 2 ] || { echo "the journal starts over: the box was reinstalled"; exit 1; }
                test -f /mnt/data/laib/vm-marker || { echo "the data is gone"; exit 1; }
                echo "the plain stick left the installed box alone"'
          marker
      - name: reinstall from a --reinstall stick — the data disk survives, the foreign disk too
        run: |
          sudo kill "$(cat qemu.pid)"; sleep 3
          ISO=laib-vm-reinstall.iso DISKS="disk.qcow2 data1.qcow2 data2.qcow2 foreign.raw" ./vm.sh once=d
          SSH="ssh -q -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 -i key -p 2222 core@127.0.0.1"
          # a power cut during the first boot (#37): the binaries landed, the marker is not
          # written yet — a hard reset through QMP in that window (what the guest sees of a
          # power cut: no flush, no shutdown; killing QEMU instead also throws away the
          # host-side qcow2 cache and corrupted the root filesystem, run 38163289190);
          # the next boot must finish the install
          # #81 forensics: when the root does not come back, read the OS disk on the runner
          cat > root-forensics.sh <<'SH'
          #!/usr/bin/env bash
          set -x
          sudo kill "$(cat qemu.pid)" 2>/dev/null; sleep 5
          sudo apt-get install -y -q xfsprogs >/dev/null 2>&1
          sudo modprobe nbd max_part=16
          sudo qemu-nbd --read-only -f qcow2 -c /dev/nbd0 disk.qcow2; sleep 3
          sudo fdisk -l /dev/nbd0
          sudo blkid /dev/nbd0p* || true
          echo "--- /boot after the cut as GRUB reads it (no journal replay)"
          sudo debugfs -R "ls -l /" /dev/nbd0p3 2>&1 | head -20
          sudo debugfs -R "cat /grub2/bootuuid.cfg" /dev/nbd0p3 2>&1 | head -5
          sudo debugfs -R "ls -l /loader/entries" /dev/nbd0p3 2>&1 | head
          sudo dumpe2fs -h /dev/nbd0p3 2>/dev/null | grep -iE "features|uuid|state"
          sudo blkid /dev/nbd0p3 /dev/nbd0p4
          sudo xfs_repair -n /dev/nbd0p4 2>&1 | head -80
          sudo xfs_db -r -c "sb 0" -c "print uuid dblocks agcount logstart logblocks features_incompat features_log_incompat" /dev/nbd0p4 2>&1 | head -20
          sudo xfs_logprint -t /dev/nbd0p4 2>&1 | head -40
          sudo mkdir -p /mnt/vroot; sudo dmesg -C
          sudo mount -o ro,norecovery /dev/nbd0p4 /mnt/vroot && { echo "mounts with norecovery"; sudo ls /mnt/vroot /mnt/vroot/ostree/deploy/fedora-coreos/deploy 2>&1 | head; sudo umount /mnt/vroot; }
          sudo mount -o ro /dev/nbd0p4 /mnt/vroot; echo "mount ro (with recovery): rc $?"; sudo dmesg | grep -iE "xfs|nbd0" | tail -40
          sudo umount /mnt/vroot 2>/dev/null; sudo qemu-nbd -d /dev/nbd0
          SH
          chmod +x root-forensics.sh
          cat > reset.py <<'PY'
          import json, socket
          s = socket.socket(socket.AF_UNIX); s.connect("qmp.sock"); f = s.makefile("rw")
          f.readline(); f.write(json.dumps({"execute": "qmp_capabilities"}) + "\n"); f.flush(); f.readline()
          f.write(json.dumps({"execute": "system_reset"}) + "\n"); f.flush(); print(f.readline().strip())
          PY
          # #111: first a cut the moment the first boot starts. The resumed boot must
          # get on with it: no five-minute stall on DNS, no extra reboot. Its binaries
          # land within 240 s of the cut (they took 300-400 s before #111), and then
          # the cut below hits the resumed boot in its own window.
          # #206: the cut waits, at most 30 s after laib-firstboot started, until rpm-ostree has
          # copied a repo's GPG key into its metadata cache. A cut in that window leaves empty
          # files there, and the resumed boot has to heal them; a cut that missed it (the poll
          # lagging) proved that only one run in three.
          early=no; act=""
          for i in $(seq 1 900); do
            if [ -z "$act" ] && [ "$($SSH 'systemctl show -p ActiveState --value laib-firstboot.service' 2>/dev/null)" = activating ]; then act=$(date +%s); fi
            if [ -n "$act" ]; then
              incache=no; $SSH 'sudo sh -c "ls /var/cache/rpm-ostree/repomd/*/RPM-GPG-KEY-*"' >/dev/null 2>&1 && incache=yes
              if [ "$incache" = yes ] || [ $(( $(date +%s) - act )) -ge 30 ]; then
                python3 reset.py; early=yes; t0=$(date +%s)
                echo "early power cut (hard reset) $i s into the first boot, $(( t0 - act )) s after laib-firstboot started; rpm-ostree's cache being written: $incache (#111, #206)"; break
              fi
            fi
            sleep 1
          done
          [ "$early" = yes ] || { echo "the early cut was not reached: laib-firstboot never ran"; exit 1; }
          killed=no; stalled=no
          for i in $(seq 1 900); do
            if [ "$stalled" = no ] && [ $(( $(date +%s) - t0 )) -gt 240 ]; then
              stalled=yes; echo "EARLYCUT_RED=1" >> "$GITHUB_ENV"
              echo "240 s after the early cut the resumed first boot has no binaries yet (#111); its journal so far:"
              $SSH 'journalctl --no-pager --list-boots | tail -4; journalctl --no-pager -b -o short-monotonic -u laib-firstboot -u systemd-resolved | tail -40; systemctl status laib-firstboot systemd-resolved systemd-resolved-varlink.socket --no-pager -l | head -40; getent hosts api.github.com; getent passwd core systemd-resolve; sudo ls -la /etc/laib; journalctl --no-pager -b -p warning -o short-monotonic | tail -40' 2>&1 || echo "(no ssh: rebooting)"
            fi
            if $SSH 'test -f /var/opt/laib/laib && ! test -f /etc/laib/installed' 2>/dev/null; then
              took=$(( $(date +%s) - t0 ))
              echo "after the early cut, the resumed first boot had its binaries in $took s"
              if [ "$took" -gt 240 ]; then
                echo "too slow after an early cut (#111): the resumed first boot stalled"
                $SSH 'journalctl --no-pager -b -o short-monotonic -u laib-firstboot -u systemd-resolved | tail -40' || true
                echo "EARLYCUT_RED=1" >> "$GITHUB_ENV"
              fi
              $SSH 'echo "before the cut: /boot/ignition.firstboot $(test -e /boot/ignition.firstboot && echo present || echo gone) for the kernel, $(sudo debugfs -D -R "ls /" /dev/disk/by-label/boot 2>/dev/null | grep -q ignition.firstboot && echo present || echo gone) for GRUB (no journal replay); up $(cut -d" " -f1 /proc/uptime) s"' || true
              cut_at=$(stat -c %s serial.log); python3 reset.py; killed=yes; echo "power cut (hard reset) $i s into the first boot, after the binaries landed"; break
            fi
            if $SSH 'test -f /etc/laib/installed' 2>/dev/null; then echo "the first boot finished before a cut could be simulated"; break; fi
            sleep 1
          done
          [ "$killed" = yes ] || { echo "the resume path was not exercised: no window between the binaries and the marker within 900 s of the early cut"; [ "$stalled" = yes ] && echo "the resumed first boot stalled after the early cut (#111)"; $SSH 'journalctl --no-pager --list-boots | tail -5; journalctl --no-pager -b -o short-monotonic -u laib-firstboot -u systemd-resolved | tail -60' 2>&1 || true; exit 1; }
          # the reset boots the installed disk (once=d applied to the first boot only)
          for i in $(seq 1 120); do
            if $SSH 'systemctl is-active --quiet laib-firstboot.service && test -f /etc/laib/installed && curl -fsS http://127.0.0.1:5900/ready' 2>/dev/null; then echo; echo "reinstalled, resumed after the cut, ready after $((i*10)) s"; break; fi
            if tail -c +"$((cut_at+1))" serial.log | grep -aq "Entering emergency mode"; then
              echo "emergency mode after the cut (#81)"; echo "--- serial after the cut, the start (firmware, GRUB, cmdline)"; tail -c +"$((cut_at+1))" serial.log | grep -avE "^\s*$" | head -60; echo "--- serial after the cut, the end"; tail -c +"$((cut_at+1))" serial.log | grep -avE "^\s*$" | tail -120; ./root-forensics.sh
              # the cut stays red (the last step fails the job), but the steps after it still run:
              # reinstall once more without a cut, so a flaky cut does not hide every later proof
              echo "POWERCUT_RED=1" >> "$GITHUB_ENV"
              ISO=laib-vm-reinstall.iso DISKS="disk.qcow2 data1.qcow2 data2.qcow2 foreign.raw" ./vm.sh once=d
              for j in $(seq 1 90); do $SSH 'test -f /etc/laib/installed && curl -fsS http://127.0.0.1:5900/ready' >/dev/null 2>&1 && break; sleep 10; done
              $SSH 'test -f /etc/laib/installed' || { echo "the reinstall without a cut did not finish either"; exit 1; }
              echo "reinstalled without a cut; the power-cut proof stays red"; break
            fi
            [ $i -eq 120 ] && { echo "laib never became ready after the reinstall and the cut"; $SSH 'journalctl --no-pager -b -u laib-firstboot | tail -30; echo "--- data disk (#107)"; journalctl --no-pager -b -u laib-data-disk | tail -25; sudo ls -la /etc/laib /etc/mdadm.conf; sudo cat /etc/laib/data-disk; cat /proc/mdstat; findmnt /mnt/data; cat /mnt/data/laib/apply.lock' || echo "(no ssh)"; echo "--- serial (XFS, ostree, firstboot lines)"; grep -aE "XFS|xfs|ostree|growfs|firstboot|EXT4|Ignition|vda4|I/O error|blk_update" serial.log | tail -120; echo "--- serial tail"; tail -c 64000 serial.log | tail -150; ./root-forensics.sh; exit 1; }
            sleep 10
          done
          $SSH 'set -euo pipefail
                if [ -e /etc/laib/firstboot.env ]; then echo "firstboot.env still on disk after the resumed first boot"; exit 1; fi
                echo "resumed: marker present, env file gone"'
          $SSH 'set -euo pipefail
                journalctl --no-pager -b -u laib-data-disk | tail -6; cat /proc/mdstat
                v=$(/var/opt/laib/laib version); echo "$v"
                [ "$v" = "laib '"${GITHUB_SHA::7}"'" ] || { echo "the reinstall did not install this commit"; exit 1; }
                grep -q "md.* xfs" <<<"$(findmnt -n -o SOURCE,FSTYPE /mnt/data)" || { echo "/mnt/data is not the RAID after reinstall"; exit 1; }
                test -f /mnt/data/laib/vm-marker || { echo "marker lost: the data disk was recreated"; exit 1; }
                cat /mnt/data/laib/vm-marker
                # a member that fell behind in the cuts is added back and resyncs (#172): give it a minute
                for i in $(seq 1 30); do grep -q "\[UU\]" /proc/mdstat && break; sleep 2; done
                grep -q "\[UU\]" /proc/mdstat || { echo "mirror not assembled after reinstall"; cat /proc/mdstat; journalctl --no-pager -b -u laib-data-disk | tail -10; exit 1; }
                grep -q "UUID=" /etc/laib/data-disk || { echo "the reinstall did not record the array by UUID"; exit 1; }
                [ "$(sudo blkid -s TYPE -o value "$(sudo blkid -L backup)")" = ext4 ] || { echo "the reinstall touched the foreign disk"; exit 1; }'
          . ./box.sh; marker
      - name: a real apply on real CoreOS — the NUC's step 2 and 3, Caddy with its own CA
        run: |
          SSH="ssh -q -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i key -p 2222 core@127.0.0.1"
          # pre-pull with the box's own login (install-box.sh logged in with the stick's token), so
          # the 90 s unit start does not include the pull; no login from the runner here
          $SSH 'set -euo pipefail; podman pull -q ghcr.io/mdopp/laib-caddy:2 >/dev/null; echo "image pulled with the box'"'"'s own credentials"'
          $SSH 'set -euo pipefail; export LAIB_HOME=/mnt/data/laib LAIB_ACTOR=human:core; L=lw; lw() { local i rc; for i in $(seq 1 60); do rc=0; /var/opt/laib/laib "$@" || rc=$?; [ "$rc" = 4 ] || return "$rc"; echo "laib $1: the lock is busy (the converge timer, #211), trying again" >&2; sleep 3; done; return 4; }
                sysctl -n net.ipv4.ip_unprivileged_port_start
                # --tls internal from the stick reached box.yml through first boot and laib init (#45); no echo into box.yml here
                grep -q "^tls: internal" /mnt/data/laib/state/box.yml || { echo "tls: internal did not reach box.yml from the stick"; exit 1; }
                # hooks run in this commit'"'"'s image (#36): box.yml laib.hooksImage, before the first service with a hook
                if grep -q "^laib:" /mnt/data/laib/state/box.yml; then sed -i "s|^laib:|laib:\n    hooksImage: ${{ env.HOOKS }}|" /mnt/data/laib/state/box.yml; else printf "laib:\n    hooksImage: %s\n" "${{ env.HOOKS }}" >> /mnt/data/laib/state/box.yml; fi
                grep -n hooksImage /mnt/data/laib/state/box.yml
                $L add caddy
                $L status
                podman ps
                root=/mnt/data/stacks/caddy/data/caddy/pki/authorities/local/root.crt
                for i in $(seq 1 30); do [ -s "$root" ] && break; sleep 2; done
                test -s "$root" || { echo "no local root CA at $root"; exit 1; }
                # --cacert replaces only the bundle file; an empty --capath keeps the system roots out too
                none=$(mktemp -d)
                code=000
                for i in $(seq 1 30); do code=$(curl -s --cacert "$root" --capath "$none" --resolve laib.vm.test:443:127.0.0.1 -o /dev/null -w "%{http_code}" https://laib.vm.test/ || true); [ "$code" = 200 ] && break; sleep 2; done
                echo "https://laib.vm.test -> HTTP $code, certificate verified against the local Caddy root"
                [ "$code" = 200 ]
                $L journal --since 1h'
      - name: reboot — the firewall is back in the kernel, the registry login survives, services come up (#37)
        run: |
          . ./box.sh
          probe() { # 18080 → the box's 8080, declared lan: false by the probe service: dropped on the NIC = timeout; no rule = answered
            local rc=0; curl -s -m 6 -o /dev/null http://127.0.0.1:18080/ || rc=$?; echo "$rc"; }
          # a service that really listens on 0.0.0.0:8080 and declares the port lan: false (whoami needs
          # the sso role for its route; busybox httpd needs nothing): from a registry on the box
          $SSH 'set -euo pipefail; export LAIB_HOME=/mnt/data/laib LAIB_ACTOR=human:core; L=lw; lw() { local i rc; for i in $(seq 1 60); do rc=0; /var/opt/laib/laib "$@" || rc=$?; [ "$rc" = 4 ] || return "$rc"; echo "laib $1: the lock is busy (the converge timer, #211), trying again" >&2; sleep 3; done; return 4; }
                R=/mnt/data/laib/registries/vm/templates/probe; mkdir -p "$R"
                printf "name: probe\ntemplate: {registry: vm, name: probe, version: 1}\nroutes: []\nsecrets: []\ndata: []\nports:\n  - {port: 8080, lan: false}\n" > "$R/laib.yml"
                printf "IMAGE: docker.io/library/busybox:stable\n" > "$R/values.example.yml"
                printf "[Container]\nImage=\${IMAGE}\nExec=httpd -f -p 80 -h /tmp\nPublishPort=8080:80\n\n[Service]\nRestart=always\n\n[Install]\nWantedBy=default.target\n" > "$R/probe.container"
                $L add probe
                sudo nft list table inet laib > /tmp/nft.txt 2>&1 || true
                grep -q 8080 /tmp/nft.txt || { echo "8080 is not in the ruleset"; cat /tmp/nft.txt; sudo nft list ruleset; exit 1; }
                # any HTTP answer is an answer (busybox httpd says 404 for / without an index); only no connection fails
                for i in $(seq 1 20); do curl -sS -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
                curl -sS -o /dev/null -w "probe on loopback: HTTP %{http_code}\n" http://127.0.0.1:8080/ || { echo "the probe service does not answer on loopback"; exit 1; }'
          rc=$(probe); echo "probe with the ruleset: curl rc $rc"; [ "$rc" = 28 ] || { echo "a lan: false port answered through the NIC"; exit 1; }
          # the port leaves the drop list and is open at once, without a reboot; and closes again (#102)
          lan() { $SSH "set -euo pipefail; export LAIB_HOME=/mnt/data/laib LAIB_ACTOR=human:core
                sed -i -E 's/lan: (true|false)/lan: $1/' /mnt/data/laib/state/services/probe/laib.yml
                /var/opt/laib/laib apply --reason 'probe lan: $1 (#102)' | tail -3"; }
          lan true
          rc=$(probe); echo "probe after lan: true, no reboot: curl rc $rc"; [ "$rc" != 28 ] || { echo "a port that left the drop list is still dropped (#102)"; $SSH 'sudo nft list ruleset'; exit 1; }
          lan false
          rc=$(probe); echo "probe after lan: false again: curl rc $rc"; [ "$rc" = 28 ] || { echo "the port is not dropped again"; $SSH 'sudo nft list ruleset'; exit 1; }
          $SSH 'sudo nft delete table inet laib'
          rc=$(probe); echo "probe without the ruleset: curl rc $rc"; [ "$rc" != 28 ] || { echo "the probe cannot tell the ruleset apart"; exit 1; }
          $SSH 'set -euo pipefail; export LAIB_HOME=/mnt/data/laib LAIB_ACTOR=human:core; L=lw; lw() { local i rc; for i in $(seq 1 60); do rc=0; /var/opt/laib/laib "$@" || rc=$?; [ "$rc" = 4 ] || return "$rc"; echo "laib $1: the lock is busy (the converge timer, #211), trying again" >&2; sleep 3; done; return 4; }
                curl -fsS http://127.0.0.1:5900/ready | tee /tmp/ready.json; echo
                grep -q "\"firewall\":\"fehlt\"" /tmp/ready.json || { echo "/ready does not say the firewall is missing"; exit 1; }
                $L converge --force || true
                sudo nft list table inet laib >/dev/null || { echo "converge did not load the ruleset"; exit 1; }
                $L journal --since 10m | grep -q "firewall" || { echo "no journal line for the reload"; exit 1; }'
          rc=$(probe); echo "probe after converge: curl rc $rc"; [ "$rc" = 28 ]
          # #257: a container's output is in journald under its service's unit, laib logs shows it, and the
          # journal is the box's own deliberate one (persistent, size and age capped); the line is computed
          # by the container (tr), so the unit's argv never matches it
          $SSH 'set -euo pipefail; export LAIB_HOME=/mnt/data/laib LAIB_ACTOR=human:core; L=lw; lw() { local i rc; for i in $(seq 1 60); do rc=0; /var/opt/laib/laib "$@" || rc=$?; [ "$rc" = 4 ] || return "$rc"; echo "laib $1: the lock is busy (the converge timer, #211), trying again" >&2; sleep 3; done; return 4; }
                R=/mnt/data/laib/registries/vm/templates/logmark; mkdir -p "$R"
                printf "name: logmark\ntemplate: {registry: vm, name: logmark, version: 1}\nroutes: []\nsecrets: []\ndata: []\nports: []\n" > "$R/laib.yml"
                printf "IMAGE: docker.io/library/busybox:stable\n" > "$R/values.example.yml"
                printf "[Container]\nImage=\${IMAGE}\nExec=sh -c \"echo laib-log-marker_${{ github.run_id }} | tr _ -; exec sleep 1000000\"\n\n[Service]\nRestart=always\n\n[Install]\nWantedBy=default.target\n" > "$R/logmark.container"
                $L add logmark
                M=laib-log-marker-${{ github.run_id }}
                for i in $(seq 1 20); do $L logs logmark --since 10m > /tmp/logs.txt; grep -q "$M" /tmp/logs.txt && break; sleep 1; done
                cat /tmp/logs.txt; grep -q "$M" /tmp/logs.txt || { echo "laib logs does not show the container output (#257)"; podman logs systemd-logmark || true; journalctl --user --no-pager -n 30 -o verbose | grep -E "MESSAGE=|_SYSTEMD_USER_UNIT|CONTAINER_NAME" | tail -30; exit 1; }
                echo "log driver: $(podman inspect --format "{{.HostConfig.LogConfig.Type}}" systemd-logmark)"
                [ "$(podman inspect --format "{{.HostConfig.LogConfig.Type}}" systemd-logmark)" = journald ] || { echo "the container does not log to journald (#257)"; exit 1; }
                podman logs systemd-logmark 2>&1 | grep "$M" >/dev/null || { echo "podman logs does not show the container output"; exit 1; }
                systemd-analyze cat-config systemd/journald.conf | grep -vE "^\s*(#|$)" | tee /tmp/journald.txt
                last() { sed -n "s/^$1=//p" /tmp/journald.txt | tail -1; }
                [ "$(last Storage)" = persistent ] && [ "$(last SystemMaxUse)" = 4G ] && [ "$(last MaxRetentionSec)" = 4week ] && [ "$(last MaxFileSec)" = 1week ] || { echo "journald is not on the box'"'"'s limits (#257)"; exit 1; }
                journalctl --no-pager -b -u systemd-journald | grep -E "System Journal|Runtime Journal" | tail -2 || true; journalctl --disk-usage'
          off; DISKS="disk.qcow2 data1.qcow2 data2.qcow2 foreign.raw" ./vm.sh order=c; ready
          $SSH 'set -euo pipefail; export LAIB_HOME=/mnt/data/laib LAIB_ACTOR=human:core; L=lw; lw() { local i rc; for i in $(seq 1 60); do rc=0; /var/opt/laib/laib "$@" || rc=$?; [ "$rc" = 4 ] || return "$rc"; echo "laib $1: the lock is busy (the converge timer, #211), trying again" >&2; sleep 3; done; return 4; }
                sudo nft list table inet laib | grep -q 8080 || { echo "the ruleset is gone after the reboot"; exit 1; }
                curl -fsS http://127.0.0.1:5900/ready | tee /tmp/ready.json; echo
                grep -q "\"firewall\":\"geladen\"" /tmp/ready.json
                grep -q "\"state\":\"bereit\"" /tmp/ready.json || { echo "not bereit after the reboot"; exit 1; }
                systemctl --user is-active caddy.service probe.service
                podman image rm -f ghcr.io/mdopp/laib-caddy:2 >/dev/null 2>&1 || true
                podman pull -q ghcr.io/mdopp/laib-caddy:2 >/dev/null || { echo "a private image cannot be pulled after the reboot: the login did not survive"; exit 1; }
                echo "private image pulled after the reboot with the kept login"
                if systemctl --failed --no-legend --type=mount | grep -q .; then echo "a mount unit failed at boot (#203)"; systemctl --failed --type=mount --no-pager; exit 1; fi
                echo "services up after the reboot, no failed mount"'
          rc=$(probe); echo "probe after the reboot: curl rc $rc"; [ "$rc" = 28 ]
          # #257: the marker of the boot before is still there: the journal is on disk, not in /run
          $SSH 'set -euo pipefail; M=laib-log-marker-${{ github.run_id }}
                journalctl --user --no-pager -b -1 -u logmark.service -o cat | grep "$M" >/dev/null || { echo "the container output of the previous boot is gone: the journal is not persistent (#257)"; journalctl --list-boots --no-pager | tail -3; exit 1; }
                journalctl --user --no-pager -b 0 -u logmark.service -o cat | grep "$M" >/dev/null || { echo "after the reboot the container output is not in journald (#257)"; exit 1; }
                echo "container output in journald under logmark.service, kept across the reboot"
                LAIB_HOME=/mnt/data/laib LAIB_ACTOR=human:core /var/opt/laib/laib remove logmark >/dev/null'
          # #281: a box that never got the box config (the migrated Kraftwerk is never reinstalled) is red in
          # diag, and the migration's step 1 (install-box.sh --box-config, docs/MIGRATION.md) puts it right, no reboot
          $SSH 'set -euo pipefail; export LAIB_HOME=/mnt/data/laib LAIB_ACTOR=human:core
                sudo rm -f /etc/systemd/journald.conf.d/50-laib.conf; rm -f ~/.config/containers/containers.conf.d/50-laib.conf; sudo systemctl restart systemd-journald
                d=$(/var/opt/laib/laib diag 2>&1 || true); grep -E "^rot +box " <<<"$d" || true
                [ "$(grep -cE "^rot +box " <<<"$d")" = 2 ] || { echo "diag is not red twice on a box without its config (#281)"; echo "$d"; exit 1; }
                curl -fsSL ${{ env.SRC }}/install-box.sh | bash -s -- --box-config
                d=$(/var/opt/laib/laib diag 2>&1 || true)
                if grep -qE "^rot +box " <<<"$d"; then echo "still red after install-box.sh --box-config (#281)"; echo "$d"; exit 1; fi
                sleep 2; journalctl --no-pager -u systemd-journald --since -3min | grep "System Journal" | tail -1 | tee /tmp/jd.txt || true
                grep -q "max 4G" /tmp/jd.txt || { echo "journald did not take the limits without a reboot (#281)"; exit 1; }
                echo "box config back from install-box.sh --box-config: diag green on it, journald on 4G"'
          $SSH 'set -euo pipefail; export LAIB_HOME=/mnt/data/laib LAIB_ACTOR=human:core; /var/opt/laib/laib remove probe >/dev/null; rm -rf /mnt/data/laib/registries/vm'

      - name: auth, adguard, radicale — hooks in the image, pre-start before the first start (#36)
        run: |
          SSH="ssh -q -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i key -p 2222 core@127.0.0.1"
          $SSH 'set -euo pipefail; export LAIB_HOME=/mnt/data/laib LAIB_ACTOR=human:core; L=lw; lw() { local i rc; for i in $(seq 1 60); do rc=0; /var/opt/laib/laib "$@" || rc=$?; [ "$rc" = 4 ] || return "$rc"; echo "laib $1: the lock is busy (the converge timer, #211), trying again" >&2; sleep 3; done; return 4; }
                podman pull -q "${{ env.HOOKS }}" >/dev/null; echo "hooks image pulled with the box'"'"'s own credentials"
                # pre-pull, as the caddy step does: a unit start has 90 s and must not include the pull
                for img in docker.io/authelia/authelia:4 docker.io/lldap/lldap:stable docker.io/adguard/adguardhome:latest docker.io/tomsquest/docker-radicale:latest docker.io/library/busybox:stable; do podman pull -q "$img" >/dev/null; done; echo "service images pre-pulled"
                command -v python3 && { echo "the box has python3; this proves nothing"; exit 1; } || echo "no python3 on the box: hooks must run in the image"
                # the operator first password, known to the job: the family login below logs in with it (#254)
                printf "vm-operator-pw-254\n" | $L secret set OPERATOR_PASSWORD
                # #245: a box from ServiceBay. Its Authelia file, with the client of an app not in Laib yet and its
                # signing key, sits where auth pre-start writes Laib config
                sb=/mnt/data/stacks/auth/authelia-config; mkdir -p "$sb"
                podman run --rm "${{ env.HOOKS }}" openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 > /tmp/sb-key.pem
                { printf "identity_providers:\n  oidc:\n    hmac_secret: sb-vm-hmac\n    jwks:\n      - key_id: main\n        algorithm: RS256\n        use: sig\n        key: |\n"
                  sed "s/^/          /" /tmp/sb-key.pem
                  printf "    clients:\n      - client_id: sbvm\n        client_name: ServiceBay app\n        client_secret: \"\$plaintext\$sb-vm-secret\"\n        public: false\n        authorization_policy: one_factor\n        redirect_uris:\n          - https://sbvm.vm.test/callback\n        scopes: [openid, profile, email]\n"
                } > "$sb/configuration.yml"
                $L add auth OPERATOR_USER=core OPERATOR_EMAIL=core@vm.test BASE_DN=dc=vm,dc=test | tee /tmp/add-auth.txt
                grep -q "^ok  auth pre-start" /tmp/add-auth.txt || { echo "auth pre-start is not green"; exit 1; }
                grep -q "^ok  auth post-deploy" /tmp/add-auth.txt || { echo "auth post-deploy (LLDAP seeding) is not green"; exit 1; }
                test -s "$sb/servicebay-clients.yml" || { echo "the ServiceBay clients were not kept (#245)"; exit 1; }
                cmp -s /tmp/sb-key.pem "$sb/oidc.pem" || { echo "the ServiceBay signing key was not kept (#245)"; exit 1; }
                grep -q "client_id: sbvm" "$sb/oidc-clients.yml" || { echo "the kept client is not registered (#245)"; exit 1; }
                grep -q "still ServiceBay.*sbvm" /tmp/add-auth.txt || { echo "the apply does not say which clients are still ServiceBay (#245)"; exit 1; }
                grep -q "lldap seeded" /tmp/add-auth.txt || { echo "the hook output does not say LLDAP was seeded"; exit 1; }
                test -s /mnt/data/stacks/auth/authelia-config/configuration.yml || { echo "pre-start did not write configuration.yml"; exit 1; }
                test -s /mnt/data/stacks/auth/authelia-config/oidc.pem || { echo "pre-start did not generate the OIDC key"; exit 1; }
                systemctl --user is-active auth-authelia.service auth-lldap.service
                # #224: LLDAP's JWT secret is a podman secret — in the container's environment, the same
                # value plan reads back, and on no podman run argv nor in any unit file
                jwt=$(podman exec systemd-auth-lldap sh -c "printf %s \"\$LLDAP_JWT_SECRET\""); [ -n "$jwt" ] || { echo "LLDAP has no LLDAP_JWT_SECRET"; exit 1; }
                [ "$(podman secret inspect --showsecret --format "{{.SecretData}}" laib.auth.auth-lldap.LLDAP_JWT_SECRET)" = "$jwt" ] || { echo "the podman secret and the container disagree"; exit 1; }
                if podman inspect systemd-auth-lldap --format "{{.Config.CreateCommand}}" | grep -qF -- "$jwt"; then echo "LLDAP_JWT_SECRET is on podman run argv (#224)"; exit 1; fi
                if grep -rqF -- "$jwt" ~/.config/containers/systemd/; then echo "a unit file carries LLDAP_JWT_SECRET (#224)"; exit 1; fi
                echo "LLDAP_JWT_SECRET reaches LLDAP as a podman secret, off argv"
                $L add adguard | tee /tmp/add-adguard.txt
                grep -q "^ok  adguard pre-start" /tmp/add-adguard.txt || { echo "adguard pre-start is not green"; exit 1; }
                grep -q "rewrites in step" /tmp/add-adguard.txt || { echo "post-deploy did not sync the rewrites through the API"; exit 1; }
                test -s /mnt/data/stacks/adguard/conf/AdGuardHome.yaml || { echo "pre-start did not write AdGuardHome.yaml"; exit 1; }
                code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8083/control/status); echo "adguard /control/status -> $code (401/403 = the web UI is up and wants the admin login)"; [ "$code" = 401 ] || [ "$code" = 403 ] || [ "$code" = 200 ]
                # CoreOS has no dig: busybox asks AdGuard on :53 for a name the rewrites answer
                podman run --rm --network host docker.io/library/busybox:stable nslookup laib.vm.test 127.0.0.1 | tee /tmp/dns.txt
                grep -A2 "laib.vm.test" /tmp/dns.txt | grep -q "Address" || { echo "adguard does not answer laib.vm.test (the rewrites)"; exit 1; }
                $L add radicale BASE_DN=dc=vm,dc=test | tee /tmp/add-radicale.txt
                grep -q "^ok  radicale pre-start" /tmp/add-radicale.txt || { echo "radicale pre-start is not green"; exit 1; }
                test -s /mnt/data/stacks/radicale/config/config || { echo "pre-start did not write radicale'"'"'s config"; exit 1; }
                $L status
                podman ps --format "{{.Names}} {{.Status}}"
                # the Authelia portal through Caddy, verified against the local root
                root=/mnt/data/stacks/caddy/data/caddy/pki/authorities/local/root.crt; none=$(mktemp -d)
                code=$(curl -s --cacert "$root" --capath "$none" --resolve auth.vm.test:443:127.0.0.1 -o /dev/null -w "%{http_code}" https://auth.vm.test/api/health || true)
                echo "https://auth.vm.test/api/health -> HTTP $code"; [ "$code" = 200 ]
                # and a protected route is sent to the portal, not served
                code=$(curl -s --cacert "$root" --capath "$none" --resolve laib.vm.test:443:127.0.0.1 -o /dev/null -w "%{http_code}" https://laib.vm.test/ || true)
                echo "https://laib.vm.test/ behind Authelia -> HTTP $code"; [ "$code" = 302 ] || [ "$code" = 401 ]
                # #245: the kept client is live in Authelia: an authorization request for it goes to the login, with a flow
                loc=$(curl -s --cacert "$root" --capath "$none" --resolve auth.vm.test:443:127.0.0.1 -o /dev/null -w "%{redirect_url}" "https://auth.vm.test/api/oidc/authorization?client_id=sbvm&response_type=code&redirect_uri=https://sbvm.vm.test/callback&scope=openid&state=vm245state" || true)
                echo "authorization for the kept ServiceBay client -> $loc"
                case "$loc" in https://auth.vm.test/*flow_id=*) ;; *) echo "Authelia does not know the kept ServiceBay client (#245)"; exit 1;; esac
                # #249: the running Authelia judges the config it loaded: the family is kept off the admin hosts, an admin needs two factors there
                pol() { podman exec systemd-auth-authelia authelia access-control check-policy --url "https://$1.vm.test/" ${2:+--username u --groups "$2"} | sed -n "s/^The policy .\([a-z_]*\). .*/\1/p"; }
                for c in "ldap family deny" "dns family deny" "laib family deny" "ldap lldap_strict_readonly deny" "ldap admins two_factor" "dns admins two_factor" "laib admins one_factor" "caldav - bypass"; do
                  set -- $c; g=$2; [ "$g" = - ] && g=; got=$(pol "$1" "$g"); echo "authelia: $1 as ${g:-anonymous} -> $got"
                  [ "$got" = "$3" ] || { echo "Authelia applies ${got:-nothing} to $1 for ${g:-anonymous}, want $3 (#249)"; exit 1; }
                done
                # #231: files sits behind Authelia and File Browser takes the user only from Remote-User
                for img in docker.io/filebrowser/filebrowser:latest docker.io/syncthing/syncthing:latest docker.io/servercontainers/samba:latest docker.io/library/python:3.13-alpine; do podman pull -q "$img" >/dev/null; done
                $L add file-share FILEBROWSER_ADMIN_USER=core
                code=000; for i in $(seq 1 30); do code=$(curl -s -o /dev/null -X POST -H "Remote-User: vmtest" -w "%{http_code}" http://127.0.0.1:8088/api/login || true); [ "$code" = 200 ] && break; sleep 2; done
                echo "File Browser login with Remote-User on loopback -> HTTP $code"; [ "$code" = 200 ]
                code=$(curl -s -o /dev/null -X POST -w "%{http_code}" http://127.0.0.1:8088/api/login || true)
                echo "File Browser login without Remote-User -> HTTP $code (proxy auth: no header, no user)"; [ "$code" != 200 ]
                users() { tok=$(curl -s -X POST -H "Remote-User: $1" http://127.0.0.1:8088/api/login); curl -s -o /dev/null -w "%{http_code}" -H "X-Auth: $tok" http://127.0.0.1:8088/api/users; }
                code=$(users core); echo "File Browser user list as core, the admin from FILEBROWSER_ADMIN_USER -> HTTP $code"; [ "$code" = 200 ]
                code=$(users vmtest); echo "File Browser user list as vmtest, a family member -> HTTP $code"; [ "$code" = 403 ]
                code=$(curl -s --cacert "$root" --capath "$none" --resolve files.vm.test:443:127.0.0.1 -H "Remote-User: admin" -o /dev/null -w "%{http_code}" https://files.vm.test/ || true)
                echo "https://files.vm.test/ with a forged Remote-User, no session -> HTTP $code"; [ "$code" = 302 ] || [ "$code" = 401 ]
                code=$(curl -s --cacert "$root" --capath "$none" --resolve files.vm.test:443:127.0.0.1 -H "Remote-User: admin" -X POST -o /dev/null -w "%{http_code}" https://files.vm.test/api/login || true)
                echo "POST https://files.vm.test/api/login with a forged Remote-User, no session -> HTTP $code"; [ "$code" = 302 ] || [ "$code" = 303 ] || [ "$code" = 401 ]
                # #230: a root-owned entry in the share (a disk import) stops no unit that mounts it
                # a disk import brings its own label too; one equal to the share'"'"'s would let podman skip the file
                S=/mnt/data/stacks/file-share/data/music; sudo install -d -o root -g root "$S/import"; sudo touch "$S/import/root.flac"; sudo chcon -t user_tmp_t "$S/import" "$S/import/root.flac"
                getenforce; ls -dZn "$S" "$S/import" "$S/import/root.flac"
                podman pull -q docker.io/linuxserver/beets:latest >/dev/null
                $L add beets
                systemctl --user restart file-share-filebrowser.service file-share-samba.service file-share-syncthing.service beets.service
                sleep 20
                for u in file-share-filebrowser file-share-samba file-share-syncthing beets; do
                  n=$(systemctl --user show -p NRestarts --value "$u.service"); a=$(systemctl --user is-active "$u.service" || true); echo "$u after a restart with a root-owned file in the share: $a, restarts $n"
                  [ "$a" = active ] && [ "$n" = 0 ] || { journalctl --user -u "$u.service" --no-pager | tail -20; exit 1; }
                done
                # no unit walked the share: the import keeps its own label
                l=$(stat -c %C "$S/import/root.flac"); echo "root.flac after the restarts: $l"; case "$l" in *user_tmp_t*) ;; *) echo "a unit relabelled the share"; exit 1;; esac
                # what :z does to the same tree on this VM, recorded, not gated: on the CI VM it left the
                # root-owned file alone (rc 0, label kept); ServiceBay'"'"'s box crashed on it (#1731, #1923)
                rc=0; podman run --rm -v "$S:/m:z" docker.io/library/busybox:stable true 2>/tmp/relabel.txt || rc=$?
                echo "observation, :z on the share -> rc $rc, music $(stat -c %C "$S"), root.flac $(stat -c %C "$S/import/root.flac") $(tail -1 /tmp/relabel.txt)"
                # #252: auth.<domain> from a rootless container (pasta, as every Laib unit without Network=host),
                # mapped as the templates map it: to the host gateway, alone and in a pod; the LAN IP for the record
                hc() { podman run --rm "$@" -v "$root:/ca.crt:ro,z" "${{ env.HOOKS }}" curl -s -m 10 -o /dev/null -w "%{http_code}" --cacert /ca.crt https://auth.vm.test/api/health || true; }
                podman --version
                echo "auth.vm.test at the LAN IP, from a container: HTTP $(hc --add-host auth.vm.test:10.0.2.15)"
                code=$(hc --add-host auth.vm.test:host-gateway); echo "auth.vm.test at host-gateway, from a container: HTTP $code"
                [ "$code" = 200 ] || { echo "a container cannot reach Authelia at host-gateway (#252)"; exit 1; }
                podman pod create --name p252 --add-host auth.vm.test:host-gateway >/dev/null
                code=$(hc --pod p252); podman pod rm -f p252 >/dev/null; echo "auth.vm.test at host-gateway, from a pod: HTTP $code"
                [ "$code" = 200 ] || { echo "a pod cannot reach Authelia at host-gateway (#252)"; exit 1; }
                $L diag || true'
      - name: file-share — one Samba account per family member, the password through Haus's channel (#296)
        run: |
          SSH="ssh -q -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i key -p 2222 core@127.0.0.1"
          $SSH bash -s <<'EOS'
          set -euo pipefail
          A=/mnt/data/stacks/file-share/samba-accounts; PW='Fam1lie äö-x'
          sec() { podman secret inspect --showsecret --format "{{.SecretData}}" "$1"; }
          # LLDAP as its admin, the token and the bodies in files, off argv
          printf '{"username":"admin","password":"%s"}' "$(sec laib.auth.auth-lldap.LLDAP_LDAP_USER_PASS)" > /tmp/login.json
          curl -fsS -H "Content-Type: application/json" -d @/tmp/login.json http://127.0.0.1:17170/auth/simple/login | sed 's/.*"token":"\([^"]*\)".*/Authorization: Bearer \1/' > /tmp/auth.h; rm /tmp/login.json
          gql() { printf '%s' "$1" > /tmp/q.json; curl -fsS -H @/tmp/auth.h -H "Content-Type: application/json" -d @/tmp/q.json http://127.0.0.1:17170/api/graphql; }
          fam=$(gql '{"query":"{ groups { id displayName } }"}' | grep -o '"id":[0-9]*,"displayName":"family"' | sed 's/"id":\([0-9]*\).*/\1/'); test -n "$fam"
          gql '{"query":"mutation { createUser(user:{id:\"anna\",email:\"anna@vm.test\"}){ id } }"}' >/dev/null
          gql "{\"query\":\"mutation { addUserToGroup(userId:\\\"anna\\\", groupId:$fam){ ok } }\"}" >/dev/null
          echo "LLDAP: anna in family"
          # the member list is read every five minutes; a restart reads it now
          systemctl --user restart file-share-samba-members.service
          for i in $(seq 1 30); do grep -qx anna "$A/members" 2>/dev/null && break; sleep 2; done
          grep -qx anna "$A/members" || { echo "anna is not in samba's member list"; journalctl --user -u file-share-samba-members.service --no-pager | tail -20; exit 1; }
          grep -qx file-share "$A/members" && { echo "the read-only account got a Samba account"; exit 1; }
          for i in $(seq 1 30); do grep -qx "anna 0" "$A/status" 2>/dev/null && break; sleep 2; done
          grep -qx "anna 0" "$A/status" || { echo "anna is not in the status as without a password"; cat "$A/status" || true; exit 1; }
          echo "anna is a member without a password, as the status says"
          test -p "$A/passwords" && [ "$(stat -c %a "$A/passwords")" = 600 ] || { echo "no FIFO, or not 600"; ls -la "$A"; exit 1; }
          # what Haus writes (haus#52): one line, the password base64 inside, into the FIFO
          printf 'set anna %s\n' "$(printf %s "$PW" | base64 -w0)" > "$A/passwords"
          for i in $(seq 1 15); do grep -q "^anna [1-9]" "$A/status" && break; sleep 1; done
          grep -q "^anna [1-9]" "$A/status" || { echo "anna's password was not set"; journalctl --user -u file-share-samba.service --no-pager | tail -20; exit 1; }
          if journalctl --user -u file-share-samba.service --no-pager | grep -qF -- "$PW"; then echo "the password is in the log"; exit 1; fi
          # smbclient from the samba image, the credentials in a file (-A), as anna
          smb() { printf 'username=%s\npassword=%s\n' "$1" "$2" > /tmp/smb.cred; rc=0; podman run --rm --network host --security-opt label=disable -v /tmp/smb.cred:/cred:ro -v /etc/hostname:/hn:ro --entrypoint smbclient docker.io/servercontainers/samba:latest //127.0.0.1/data -A /cred -c "$3" >/tmp/smb.out 2>&1 || rc=$?; rm -f /tmp/smb.cred; return $rc; }
          smb anna "$PW" "put /hn anna.txt" || { echo "anna cannot log in with the password from Haus's channel"; cat /tmp/smb.out; exit 1; }
          f=/mnt/data/stacks/file-share/data/anna.txt; test -f "$f"; [ "$(stat -c %U "$f")" = core ] || { echo "anna's file is not core's: $(stat -c %U "$f")"; exit 1; }
          echo "anna logged in with the password set through Haus's channel and wrote anna.txt, owned by core"
          smb anna wrong "ls" && { echo "a wrong password logs in"; exit 1; }
          # a restart: the passdb stays, the POSIX side is made again
          systemctl --user restart file-share-samba.service; sleep 15
          smb anna "$PW" "ls anna.txt" || { echo "anna cannot log in after a samba restart"; cat /tmp/smb.out; exit 1; }
          echo "anna logs in after a restart of samba"
          # the shared account stays
          smb samba "$(sec laib.file-share.file-share-samba.ACCOUNT_samba)" "ls" || { echo "the shared account no longer logs in"; cat /tmp/smb.out; exit 1; }
          echo "the shared account still logs in"
          # anna leaves LLDAP: her account goes
          gql '{"query":"mutation { deleteUser(userId:\"anna\"){ ok } }"}' >/dev/null; rm /tmp/auth.h
          systemctl --user restart file-share-samba-members.service
          for i in $(seq 1 45); do grep -q "^anna " "$A/status" || break; sleep 2; done
          smb anna "$PW" "ls" && { echo "anna still logs in after she left LLDAP"; exit 1; }
          echo "anna, removed from LLDAP, cannot log in any more"
          journalctl --user -u file-share-samba.service --no-pager | grep "samba: " | tail -10
          EOS
      - name: immich — a family member's OIDC login end to end against the real Authelia (#254, #251, #252)
        run: |
          SSH="ssh -q -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i key -p 2222 core@127.0.0.1"
          # the shipped immich template from a registry on the box, two things changed for the VM: no machine
          # learning (it needs the NUC's GPU) and Caddy's local CA trusted by Node (the NUC has a public cert).
          # Its post-deploy and its units are otherwise the built-in's.
          $SSH 'rm -rf /tmp/immich && mkdir -p /tmp/immich'
          tar -C templates/immich -cf - --exclude tests . | $SSH 'tar -C /tmp/immich -xf -'
          $SSH 'cat > /tmp/oidc-login.py' < scripts/oidc-login.py
          $SSH 'set -euo pipefail; export LAIB_HOME=/mnt/data/laib LAIB_ACTOR=human:core; L=lw; lw() { local i rc; for i in $(seq 1 60); do rc=0; /var/opt/laib/laib "$@" || rc=$?; [ "$rc" = 4 ] || return "$rc"; echo "laib $1: the lock is busy (the converge timer, #211), trying again" >&2; sleep 3; done; return 4; }
                root=/mnt/data/stacks/caddy/data/caddy/pki/authorities/local/root.crt
                R=/mnt/data/laib/registries/vm/templates/immich; mkdir -p "$(dirname "$R")"; rm -rf "$R"; mv /tmp/immich "$R"
                rm "$R/immich-ml.container"
                sed -i -e "/^gpu: true/d" -e "s/^after: .*/after: [auth]/" "$R/laib.yml"
                sed -i "s|^Pod=immich.pod|Pod=immich.pod\nEnvironment=NODE_EXTRA_CA_CERTS=/laib-ca.crt\nVolume=$root:/laib-ca.crt:ro,z|" "$R/immich.container"
                grep -q "^AddHost=auth.\${DOMAIN}:host-gateway" "$R/immich.pod" || { echo "the pod does not map auth to the host gateway"; exit 1; }
                for img in ghcr.io/immich-app/immich-server:release ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0 docker.io/library/redis:6.2-alpine; do podman pull -q "$img" >/dev/null; done; echo "immich images pre-pulled"
                mkdir -p /mnt/data/stacks/immich-photos
                $L add immich PHOTOS_RO=/mnt/data/stacks/immich-photos ADMIN_EMAIL=admin@vm.test | tee /tmp/add-immich.txt
                grep -q "^ok  immich post-deploy" /tmp/add-immich.txt || { echo "immich post-deploy is not green"; exit 1; }
                grep -q "family login (OIDC via Authelia) set from Laib" /tmp/add-immich.txt || { echo "post-deploy did not set the family login"; exit 1; }
                grep -q "client_id: immich" /mnt/data/laib/render/authelia/laib-clients.yml || { echo "Authelia has no immich client"; exit 1; }
                for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:9091/api/health && break; sleep 2; done
                # the login, as a browser: Immich → Authelia (password, consent) → Immich exchanges the code
                export OIDC_USER=core OIDC_PASSWORD=vm-operator-pw-254 OIDC_EMAIL=core@vm.test
                podman run --rm --network host --add-host auth.vm.test:127.0.0.1 --add-host photos.vm.test:127.0.0.1 \
                  -e OIDC_USER -e OIDC_PASSWORD -e OIDC_EMAIL -e OIDC_CA=/ca.crt -v "$root:/ca.crt:ro,z" -v /tmp/oidc-login.py:/oidc-login.py:ro,z \
                  "${{ env.HOOKS }}" python3 /oidc-login.py immich https://photos.vm.test
                $L secret list | grep -qx IMMICH_API_KEY || { echo "the API key was not handed back into secrets.age"; $L secret list | tr "\n" " "; echo
                  git -C /mnt/data/laib/state log --oneline -6; git -C /mnt/data/laib/state status --short; git -C /mnt/data/laib/state log --oneline -3 -- secrets.age; $L journal --since 15m | tail -15; exit 1; }   # #307
                # the drift ServiceBay repaired in the database (#1556 there) cannot stay: a new client secret reaches
                # Authelia and Immich in one apply, Immich through its post-deploy with the minted key
                $L secret rotate OIDC_IMMICH_SECRET | tee /tmp/rotate-immich.txt
                grep -q "family login (OIDC via Authelia) set from Laib" /tmp/rotate-immich.txt || { echo "the rotation did not reach Immich"; exit 1; }
                for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:9091/api/health && break; sleep 2; done
                podman run --rm --network host --add-host auth.vm.test:127.0.0.1 --add-host photos.vm.test:127.0.0.1 \
                  -e OIDC_USER -e OIDC_PASSWORD -e OIDC_EMAIL -e OIDC_CA=/ca.crt -v "$root:/ca.crt:ro,z" -v /tmp/oidc-login.py:/oidc-login.py:ro,z \
                  "${{ env.HOOKS }}" python3 /oidc-login.py immich https://photos.vm.test
                $L remove immich >/dev/null
                rm -rf "$R"; podman unshare rm -rf /mnt/data/stacks/immich /mnt/data/stacks/immich-photos   # Postgres owns pgdata inside the user namespace
                podman image rm -f ghcr.io/immich-app/immich-server:release ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0 >/dev/null || true
                echo "immich: a family member logged in through Authelia"'
      - name: home-assistant — the family login (auth_oidc) loads on a real Home Assistant, from ServiceBay's configuration.yaml (#253)
        run: |
          SSH="ssh -q -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i key -p 2222 core@127.0.0.1"
          # the shipped template from a registry on the box, without Z-Wave JS and Matter (the NUC's stick and fabric);
          # Home Assistant's unit and pre-start are the built-in's
          $SSH 'rm -rf /tmp/ha && mkdir -p /tmp/ha'
          tar -C templates/home-assistant -cf - --exclude tests . | $SSH 'tar -C /tmp/ha -xf -'
          $SSH 'set -euo pipefail; export LAIB_HOME=/mnt/data/laib LAIB_ACTOR=human:core; L=lw; lw() { local i rc; for i in $(seq 1 60); do rc=0; /var/opt/laib/laib "$@" || rc=$?; [ "$rc" = 4 ] || return "$rc"; echo "laib $1: the lock is busy (the converge timer, #211), trying again" >&2; sleep 3; done; return 4; }
                R=/mnt/data/laib/registries/vm/templates/home-assistant; mkdir -p "$(dirname "$R")"; rm -rf "$R"; mv /tmp/ha "$R"
                rm "$R/home-assistant-zwave.container" "$R/home-assistant-matter.container"
                sed -i "s/^after: .*/after: [auth]/" "$R/laib.yml"
                # what ServiceBay left: its top-level block with its secret, and a component it installed
                C=/mnt/data/stacks/home-assistant/homeassistant; mkdir -p "$C/custom_components/auth_oidc"
                echo v1.1.0 > "$C/custom_components/auth_oidc/.sb_installed_version"
                printf "default_config:\n\nauth_oidc:\n  client_id: homeassistant\n  client_secret: servicebay-old\n  discovery_url: https://auth.vm.test/.well-known/openid-configuration\n  roles:\n    admin: admins\n\nlogger:\n  default: warning\n" > "$C/configuration.yaml"
                touch "$C/automations.yaml" "$C/scripts.yaml" "$C/scenes.yaml"
                podman pull -q ghcr.io/home-assistant/home-assistant:stable >/dev/null; echo "home assistant image pre-pulled"
                $L add home-assistant | tee /tmp/add-ha.txt
                grep -q "^ok  home-assistant pre-start" /tmp/add-ha.txt || { echo "home-assistant pre-start is not green"; exit 1; }
                grep -q "auth_oidc installed" /tmp/add-ha.txt || { echo "the pinned component was not installed"; exit 1; }
                if grep -q "^auth_oidc:" "$C/configuration.yaml"; then echo "ServiceBay block is still in configuration.yaml"; exit 1; fi
                grep -q "AUTH_OIDC_SECRET" "$C/packages/laib_auth_oidc.yaml"
                if grep -rqF "$(podman secret inspect --showsecret --format "{{.SecretData}}" laib.home-assistant.home-assistant.AUTH_OIDC_SECRET)" "$C"; then echo "the OIDC secret is in a file under the config"; exit 1; fi
                A=/mnt/data/laib/render/authelia/laib-clients.yml
                grep -A6 "client_id: homeassistant" "$A" | grep -q "token_endpoint_auth_method: client_secret_post" || { echo "Authelia has no homeassistant client for client_secret_post"; cat "$A"; exit 1; }
                # the component runs with the package: its welcome page answers and names the family account
                code=000; for i in $(seq 1 90); do code=$(curl -s -o /tmp/welcome.html -w "%{http_code}" http://127.0.0.1:8123/auth/oidc/welcome || true); [ "$code" = 200 ] && break; sleep 5; done
                echo "home assistant /auth/oidc/welcome -> HTTP $code"
                [ "$code" = 200 ] && grep -q "Familienkonto" /tmp/welcome.html || { echo "auth_oidc is not set up from the package"; podman logs --tail 80 systemd-home-assistant 2>&1 | grep -i -B2 -A8 "auth_oidc\|error" | tail -60; exit 1; }
                if podman logs systemd-home-assistant 2>&1 | grep -i "auth_oidc" | grep -qi "duplicate\|invalid config"; then echo "Home Assistant complains about auth_oidc"; exit 1; fi
                $L remove home-assistant >/dev/null
                rm -rf "$R"; podman unshare rm -rf /mnt/data/stacks/home-assistant
                podman image rm -f ghcr.io/home-assistant/home-assistant:stable >/dev/null || true
                echo "home-assistant: the family login loaded from Laib package, ServiceBay block gone"'
      - name: media — a family member logs in to Jellyfin with the LLDAP account, through a read-only bind (#256)
        run: |
          SSH="ssh -q -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i key -p 2222 core@127.0.0.1"
          # the shipped template from a registry on the box, without the GPU (the NUC's); post-deploy is the built-in's
          $SSH 'rm -rf /tmp/media && mkdir -p /tmp/media'
          tar -C templates/media -cf - --exclude tests . | $SSH 'tar -C /tmp/media -xf -'
          $SSH 'set -euo pipefail; export LAIB_HOME=/mnt/data/laib LAIB_ACTOR=human:core; L=lw; lw() { local i rc; for i in $(seq 1 60); do rc=0; /var/opt/laib/laib "$@" || rc=$?; [ "$rc" = 4 ] || return "$rc"; echo "laib $1: the lock is busy (the converge timer, #211), trying again" >&2; sleep 3; done; return 4; }
                R=/mnt/data/laib/registries/vm/templates/media; mkdir -p "$(dirname "$R")"; rm -rf "$R"; mv /tmp/media "$R"
                sed -i -e "/^gpu: true/d" -e "s/^after: .*/after: [auth]/" "$R/laib.yml"
                sed -i "/^AddDevice=nvidia/d" "$R/media.container"
                mkdir -p /mnt/data/stacks/jf-media/music
                podman pull -q docker.io/jellyfin/jellyfin:latest >/dev/null; echo "jellyfin image pre-pulled"
