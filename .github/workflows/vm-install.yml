# The first install, end to end, in a VM on the runner: laib-stick builds the
# ISO, QEMU/KVM boots it, the live system installs Fedora CoreOS to a virtual
# disk and reboots, and the first boot installs THIS commit: install-box.sh and
# the binaries are served from the runner (QEMU's user net reaches it as
# 10.0.2.2), so a change to `laib init`, the first-boot script or install-box.sh
# is tested before it ships (#38). Then we SSH in and do real work on the box.
# This is the closest thing to the NUC without the NUC. BIOS boot (the EFI
# boot-order step is the NUC's job; post-install.sh tolerates no EFI).
#
# Every remote script runs under `set -euo pipefail`, and every probe is its own
# command that can fail: a step that passes has checked what its name says.
name: vm-install
on:
  push:
    branches: [main]
    paths: [usb/**, internal/stick/**, cmd/laib-stick/**, scripts/install-box.sh, cmd/laib/**, internal/**, templates/**, .github/workflows/vm-install.yml]
  pull_request:
    # the install path only: kernel PRs dispatch this job when they need it (Actions minutes)
    paths: [usb/**, internal/stick/**, cmd/laib-stick/**, scripts/install-box.sh, .github/workflows/vm-install.yml]
  workflow_dispatch:
concurrency:
  group: vm-install-${{ github.ref }}
  cancel-in-progress: true
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # install, mirror sync, two reinstalls and the disaster recovery take ~80 min on the runner
    env:
      SRC: http://10.0.2.2:8000   # this commit's build, as the box sees the runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: qemu + kvm
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86 qemu-utils
          test -e /dev/kvm && sudo chmod 666 /dev/kvm && echo "kvm ok"
      - name: this commit's build, served to the box; the stick
        run: |
          ssh-keygen -q -t ed25519 -N "" -f key
          go build -o laib-stick ./cmd/laib-stick
          # the release's asset names, plus VERSION, plus install-box.sh: what --source expects
          mkdir -p dist
          for b in laib laib-operator laib-lease; do CGO_ENABLED=0 go build -ldflags "-s -w -X main.Version=${GITHUB_SHA::7}" -o dist/$b-linux-amd64 ./cmd/$b; done
          cp scripts/install-box.sh dist/install-box.sh
          (cd dist && sha256sum laib-*-amd64 > SHA256SUMS && cat SHA256SUMS)
          printf '%s' "${GITHUB_SHA::7}" > dist/VERSION
          nohup python3 -m http.server 8000 --bind 127.0.0.1 --directory dist > http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/VERSION >/dev/null 2>&1 && break; sleep 1; done
          echo "serving $(curl -fsS http://127.0.0.1:8000/VERSION) on :8000"
          ./laib-stick --yes --hostname vm --domain vm.test --ssh-key key.pub --token "${{ github.token }}" --source "$SRC" --out laib-vm.iso
          # the same box, a stick that may reinstall it (#33): a plain stick refuses an installed box
          ./laib-stick --yes --hostname vm --domain vm.test --ssh-key key.pub --token "${{ github.token }}" --source "$SRC" --reinstall --out laib-vm-reinstall.iso
          ls -la laib-vm.iso laib-vm-reinstall.iso
      - name: cross-check with coreos-installer, serial console for the log
        run: |
          CI_IMG=quay.io/coreos/coreos-installer:release
          podman run --rm -v "$PWD:/data:z" -w /data $CI_IMG iso ignition show laib-vm.iso > live.ign
          python3 -c "import json; d=json.load(open('live.ign')); print('units:', [u['name'] for u in d['systemd']['units']]); print('files:', [f['path'] for f in d['storage']['files']])"
          for iso in laib-vm.iso laib-vm-reinstall.iso; do
            podman run --rm -v "$PWD:/data:z" -w /data $CI_IMG iso kargs modify -a console=ttyS0,115200n8 "$iso"
          done
      - name: boot, install, reboot, first boot — of this commit
        run: |
          # three disks: the OS goes to the smallest (pre-install), the largest
          # becomes the data RAID1 with one member (laib-data-disk), the third
          # joins as the mirror later in this job
          # the runner has ~14 GB free: zero writes (the mirror sync copies a
          # mostly empty 9G member) must punch holes in the qcow2 files, not fill them
          qemu-img create -q -f qcow2 disk.qcow2 8G
          qemu-img create -q -f qcow2 data1.qcow2 9G
          qemu-img create -q -f qcow2 data2.qcow2 9G
          # a fourth disk that turns up after the install (#32): ext4 with a file on it, larger
          # than the data disks, so "the largest disk" would have been it
          mkdir -p foreign && echo "keep me" > foreign/marker
          truncate -s 12G foreign.raw && mkfs.ext4 -q -F -L backup -d foreign foreign.raw
          df -h / | tail -1
          cat > vm.sh <<'EOF'
          #!/usr/bin/env bash
          # $1 = qemu -boot argument: order=cd (disk first, empty disk falls through to the stick),
          # once=d (the stick once = reinstall; without "once" the VM would reinstall forever,
          # the job the EFI post-install step does on real hardware), order=c (the disk only)
          # DISKS = the drives in this order (default: the OS disk and the two data disks)
          drives=()
          for d in ${DISKS:-disk.qcow2 data1.qcow2 data2.qcow2}; do
            f=qcow2; [[ $d == *.raw ]] && f=raw
            drives+=(-drive "file=$d,if=virtio,format=$f,discard=unmap,detect-zeroes=unmap")
          done
          qemu-system-x86_64 -enable-kvm -cpu host -m 4096 -smp 2 -display none -daemonize \
            -pidfile qemu.pid -serial file:serial.log "${drives[@]}" \
            -cdrom "${ISO:-laib-vm.iso}" -boot $1 \
            -nic user,model=virtio,hostfwd=tcp::2222-:22,hostfwd=tcp::18080-:8080
          EOF
          # a clean power-off (QEMU gone), and waiting for laib after a boot
          cat > box.sh <<'EOF'
          SSH="ssh -q -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 -i key -p 2222 core@127.0.0.1"
          off() { local p; p=$(cat qemu.pid 2>/dev/null) || return 0; $SSH 'sudo systemctl poweroff' || true
            for i in $(seq 1 60); do kill -0 "$p" 2>/dev/null || return 0; sleep 2; done; sudo kill "$p"; sleep 3; }
          ready() { for i in $(seq 1 90); do $SSH 'curl -fsS http://127.0.0.1:5900/ready' >/dev/null 2>&1 && { echo "ready after $((i*10)) s"; return 0; }; sleep 10; done
            echo "laib never became ready"; return 1; }
          marker() { debugfs -R "cat /marker" foreign.raw 2>/dev/null | grep -qx "keep me" || { echo "the file on the foreign disk is gone"; return 1; }; echo "foreign disk: its file is intact"; }
          EOF
          chmod +x vm.sh; ./vm.sh order=cd
          SSH="ssh -q -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 -i key -p 2222 core@127.0.0.1"
          for i in $(seq 1 120); do
            # ready AND the first-boot unit finished (it applies and shreds the token after serve is up)
            if $SSH 'systemctl is-active --quiet laib-firstboot.service && curl -fsS http://127.0.0.1:5900/ready' 2>/dev/null; then echo; echo "ready after $((i*10)) s"; break; fi
            [ $i -eq 120 ] && { echo "laib never became ready"; exit 1; }
            sleep 10
          done
          $SSH 'set -euo pipefail
                systemctl status laib-firstboot --no-pager | head -5 || true
                v=$(/var/opt/laib/laib version); echo "$v"
                [ "$v" = "laib '"${GITHUB_SHA::7}"'" ] || { echo "first boot did not install this commit"; exit 1; }
                if [ -e /etc/laib/firstboot.env ]; then echo "firstboot.env still on disk"; exit 1; fi
                test -f /etc/laib/installed || { echo "the first-boot marker is missing"; exit 1; }
                test -s ~/.config/containers/auth.json || { echo "the registry login is not in ~/.config/containers/auth.json (#37)"; exit 1; }
                journalctl --no-pager -b -u laib-firstboot | grep -q -- "--token" && { echo "the token was on argv"; exit 1; } || echo "token never on argv"
                /var/opt/laib/laib status || true; /var/opt/laib/laib plan || true; /var/opt/laib/laib diag || true'
      - name: the data disk — RAID1 with one member on /mnt/data, then the mirror joins
        run: |
          SSH="ssh -q -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i key -p 2222 core@127.0.0.1"
          $SSH 'set -euo pipefail
                journalctl --no-pager -b -u laib-data-disk | tail -12
                cat /proc/mdstat; cat /etc/laib/data-disk
                grep -q "md.* xfs" <<<"$(findmnt -n -o SOURCE,FSTYPE /mnt/data)" || { echo "/mnt/data is not the RAID"; exit 1; }
                grep -q "\[U_\]" /proc/mdstat || { echo "array should be degraded by design"; exit 1; }
                lsblk -ndo NAME,SIZE /dev/vda /dev/vdb /dev/vdc
                echo "laib data disk marker $(date -u +%s)" | tee /mnt/data/laib/vm-marker
                # the mirror: the untouched 9G disk (no partitions) joins through laib disk add, resync to [UU]
                spare=""; for d in /dev/vd?; do if [ "$(lsblk -nro NAME "$d" | wc -l)" = 1 ]; then spare=$d; fi; done
                echo "spare: $spare"; test -n "$spare"
                export LAIB_HOME=/mnt/data/laib LAIB_ACTOR=human:core; L=/var/opt/laib/laib
                $L disk status
                $L disk add "$spare"
                for i in $(seq 1 120); do grep -q "\[UU\]" /proc/mdstat && break; sleep 2; done
                $L disk status; $L diag || true
                grep -q "\[UU\]" /proc/mdstat || { echo "mirror did not sync"; exit 1; }
                grep -q MEMBERS=2 /etc/laib/data-disk
                sudo sync'
          df -h / | tail -1; ls -la *.qcow2
      - name: a disk that turns up later is never claimed — reboot with a foreign ext4 disk
        run: |
          . ./box.sh
          off
          DISKS="disk.qcow2 data1.qcow2 data2.qcow2 foreign.raw" ./vm.sh order=c
          ready
          $SSH 'set -euo pipefail
                journalctl --no-pager -b -u laib-data-disk | tail -8
                cat /proc/mdstat; cat /etc/laib/data-disk
                grep -q "md.* xfs" <<<"$(findmnt -n -o SOURCE,FSTYPE /mnt/data)" || { echo "/mnt/data is not the RAID"; exit 1; }
                grep -q "\[UU\]" /proc/mdstat || { echo "the mirror did not come back"; exit 1; }
                grep -q MEMBERS=2 /etc/laib/data-disk || { echo "the record lost the mirror"; exit 1; }
                dev=$(sudo blkid -L backup) || { echo "the foreign disk lost its filesystem"; exit 1; }
                [ "$(sudo blkid -s TYPE -o value "$dev")" = ext4 ] || { echo "the foreign disk is no longer ext4"; exit 1; }
                echo "foreign disk $dev: still ext4, label backup"'
          marker
      - name: a stick left in an installed box does nothing — the plain stick refuses
        run: |
          . ./box.sh
          sudo kill "$(cat qemu.pid)"; sleep 3
          # the plain stick, booted on purpose (as a USB-first firmware would): it must stop before any disk is touched
          DISKS="disk.qcow2 data1.qcow2 data2.qcow2 foreign.raw" ./vm.sh once=d
          for i in $(seq 1 60); do grep -aq "Diese Box ist schon installiert" serial.log && break; sleep 5; done
          grep -a "Diese Box ist schon installiert" serial.log | tail -1 || { echo "the plain stick did not refuse an installed box"; tail -c 4000 serial.log; exit 1; }
          sleep 20   # time for a wrong install to start, if one would
          sudo kill "$(cat qemu.pid)"; sleep 3
          DISKS="disk.qcow2 data1.qcow2 data2.qcow2 foreign.raw" ./vm.sh order=c
          ready
          $SSH 'set -euo pipefail
                v=$(/var/opt/laib/laib version); [ "$v" = "laib '"${GITHUB_SHA::7}"'" ] || { echo "the box changed: $v"; exit 1; }
                boots=$(journalctl --list-boots --no-pager | wc -l); echo "boots in the journal: $boots"
                [ "$boots" -ge 2 ] || { echo "the journal starts over: the box was reinstalled"; exit 1; }
                test -f /mnt/data/laib/vm-marker || { echo "the data is gone"; exit 1; }
                echo "the plain stick left the installed box alone"'
          marker
      - name: reinstall from a --reinstall stick — the data disk survives, the foreign disk too
        run: |
          sudo kill "$(cat qemu.pid)"; sleep 3
          ISO=laib-vm-reinstall.iso DISKS="disk.qcow2 data1.qcow2 data2.qcow2 foreign.raw" ./vm.sh once=d
          SSH="ssh -q -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 -i key -p 2222 core@127.0.0.1"
          # a power cut during the first boot (#37): the binaries landed, the marker is not
          # written yet — kill QEMU in that window; the next boot must finish the install
          killed=no
          for i in $(seq 1 900); do
            if $SSH 'test -f /var/opt/laib/laib && ! test -f /etc/laib/installed' 2>/dev/null; then
              sudo kill -9 "$(cat qemu.pid)"; killed=yes; echo "power cut $i s into the first boot, after the binaries landed"; break
            fi
            if $SSH 'test -f /etc/laib/installed' 2>/dev/null; then echo "the first boot finished before a cut could be simulated"; break; fi
            sleep 1
          done
          [ "$killed" = yes ] || { echo "the resume path was not exercised: no window between the binaries and the marker"; exit 1; }
          sleep 3; DISKS="disk.qcow2 data1.qcow2 data2.qcow2 foreign.raw" ./vm.sh order=c
          for i in $(seq 1 120); do
            if $SSH 'systemctl is-active --quiet laib-firstboot.service && test -f /etc/laib/installed && curl -fsS http://127.0.0.1:5900/ready' 2>/dev/null; then echo; echo "reinstalled, resumed after the cut, ready after $((i*10)) s"; break; fi
            [ $i -eq 120 ] && { echo "laib never became ready after the reinstall and the cut"; $SSH 'journalctl --no-pager -b -u laib-firstboot | tail -30; cat /mnt/data/laib/apply.lock' || true; exit 1; }
            sleep 10
          done
          $SSH 'set -euo pipefail
                if [ -e /etc/laib/firstboot.env ]; then echo "firstboot.env still on disk after the resumed first boot"; exit 1; fi
                echo "resumed: marker present, env file gone"'
          $SSH 'set -euo pipefail
                journalctl --no-pager -b -u laib-data-disk | tail -6; cat /proc/mdstat
                v=$(/var/opt/laib/laib version); echo "$v"
                [ "$v" = "laib '"${GITHUB_SHA::7}"'" ] || { echo "the reinstall did not install this commit"; exit 1; }
                grep -q "md.* xfs" <<<"$(findmnt -n -o SOURCE,FSTYPE /mnt/data)" || { echo "/mnt/data is not the RAID after reinstall"; exit 1; }
                test -f /mnt/data/laib/vm-marker || { echo "marker lost: the data disk was recreated"; exit 1; }
                cat /mnt/data/laib/vm-marker
                grep -q "\[UU\]" /proc/mdstat || { echo "mirror not assembled after reinstall"; exit 1; }
                grep -q "UUID=" /etc/laib/data-disk || { echo "the reinstall did not record the array by UUID"; exit 1; }
                [ "$(sudo blkid -s TYPE -o value "$(sudo blkid -L backup)")" = ext4 ] || { echo "the reinstall touched the foreign disk"; exit 1; }'
          . ./box.sh; marker
      - name: a real apply on real CoreOS — the NUC's step 2 and 3, Caddy with its own CA
        run: |
          SSH="ssh -q -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i key -p 2222 core@127.0.0.1"
          # pre-pull with the box's own login (install-box.sh logged in with the stick's token), so
          # the 90 s unit start does not include the pull; no login from the runner here
          $SSH 'set -euo pipefail; podman pull -q ghcr.io/mdopp/laib-caddy:2 >/dev/null; echo "image pulled with the box'"'"'s own credentials"'
          $SSH 'set -euo pipefail; export LAIB_HOME=/mnt/data/laib LAIB_ACTOR=human:core; L=/var/opt/laib/laib
                sysctl -n net.ipv4.ip_unprivileged_port_start
                grep -q "^tls:" /mnt/data/laib/state/box.yml || echo "tls: internal" >> /mnt/data/laib/state/box.yml
                $L add caddy
                $L status
                podman ps
                root=/mnt/data/stacks/caddy/data/caddy/pki/authorities/local/root.crt
                for i in $(seq 1 30); do [ -s "$root" ] && break; sleep 2; done
                test -s "$root" || { echo "no local root CA at $root"; exit 1; }
                # --cacert replaces only the bundle file; an empty --capath keeps the system roots out too
                none=$(mktemp -d)
                code=000
                for i in $(seq 1 30); do code=$(curl -s --cacert "$root" --capath "$none" --resolve laib.vm.test:443:127.0.0.1 -o /dev/null -w "%{http_code}" https://laib.vm.test/ || true); [ "$code" = 200 ] && break; sleep 2; done
                echo "https://laib.vm.test -> HTTP $code, certificate verified against the local Caddy root"
                [ "$code" = 200 ]
                $L journal --since 1h'
      - name: reboot — the firewall is back in the kernel, the registry login survives, services come up (#37)
        run: |
          . ./box.sh
          probe() { # 18080 → the box's 8080, declared lan: false by whoami: dropped on the NIC = timeout; no rule = refused at once
            local rc=0; curl -s -m 6 -o /dev/null http://127.0.0.1:18080/ || rc=$?; echo "$rc"; }
          $SSH 'set -euo pipefail; export LAIB_HOME=/mnt/data/laib LAIB_ACTOR=human:core; L=/var/opt/laib/laib
                $L add whoami
                sudo nft list table inet laib | grep -q 8080 || { echo "8080 is not in the ruleset"; exit 1; }'
          rc=$(probe); echo "probe with the ruleset: curl rc $rc"; [ "$rc" = 28 ] || { echo "a lan: false port answered through the NIC"; exit 1; }
          $SSH 'sudo nft delete table inet laib'
          rc=$(probe); echo "probe without the ruleset: curl rc $rc"; [ "$rc" != 28 ] || { echo "the probe cannot tell the ruleset apart"; exit 1; }
          $SSH 'set -euo pipefail; export LAIB_HOME=/mnt/data/laib LAIB_ACTOR=human:core; L=/var/opt/laib/laib
                curl -fsS http://127.0.0.1:5900/ready | tee /tmp/ready.json; echo
                grep -q "\"firewall\":\"fehlt\"" /tmp/ready.json || { echo "/ready does not say the firewall is missing"; exit 1; }
                $L converge --force || true
                sudo nft list table inet laib >/dev/null || { echo "converge did not load the ruleset"; exit 1; }
                $L journal --since 10m | grep -q "firewall" || { echo "no journal line for the reload"; exit 1; }'
          rc=$(probe); echo "probe after converge: curl rc $rc"; [ "$rc" = 28 ]
          off; DISKS="disk.qcow2 data1.qcow2 data2.qcow2 foreign.raw" ./vm.sh order=c; ready
          $SSH 'set -euo pipefail; export LAIB_HOME=/mnt/data/laib LAIB_ACTOR=human:core; L=/var/opt/laib/laib
                sudo nft list table inet laib | grep -q 8080 || { echo "the ruleset is gone after the reboot"; exit 1; }
                curl -fsS http://127.0.0.1:5900/ready | tee /tmp/ready.json; echo
                grep -q "\"firewall\":\"geladen\"" /tmp/ready.json
                grep -q "\"state\":\"bereit\"" /tmp/ready.json || { echo "not bereit after the reboot"; exit 1; }
                systemctl --user is-active caddy.service whoami.service
                podman image rm -f ghcr.io/mdopp/laib-caddy:2 >/dev/null 2>&1 || true
                podman pull -q ghcr.io/mdopp/laib-caddy:2 >/dev/null || { echo "a private image cannot be pulled after the reboot: the login did not survive"; exit 1; }
                echo "private image pulled after the reboot with the kept login"
                $L remove whoami >/dev/null'
          rc=$(probe); echo "probe after the reboot: curl rc $rc"; [ "$rc" = 28 ]
      - name: backup and restore — restic in the day-one repo laib init wrote
        run: |
          SSH="ssh -q -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i key -p 2222 core@127.0.0.1"
          $SSH 'set -euo pipefail; export LAIB_HOME=/mnt/data/laib LAIB_ACTOR=human:core; L=/var/opt/laib/laib
                # box.yml is rewritten by laib add (yaml.Marshal, four-space indent): read repo: inside backup: at any indent
                repo=$(sed -n "/^backup:/,/^[^ #]/s/^ *repo: *\([^ #]*\).*/\1/p" /mnt/data/laib/state/box.yml)
                echo "backup.repo from box.yml: $repo"; test -n "$repo"
                echo "caddy marker before backup" > /mnt/data/stacks/caddy/data/vm-marker
                $L backup
                test -f "$repo/config" || { echo "no restic repo at $repo"; exit 1; }
                rm /mnt/data/stacks/caddy/data/vm-marker
                $L restore latest caddy
                grep -q "before backup" /mnt/data/stacks/caddy/data/vm-marker
                $L journal --since 1h > /tmp/journal.txt
                grep -E "backup|restore" /tmp/journal.txt'
      - name: update path — a pinned release, the latest release, then this commit again
        run: |
          SSH="ssh -q -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i key -p 2222 core@127.0.0.1"
          $SSH 'set -euo pipefail; export LAIB_GH_TOKEN="${{ github.token }}" SRC="${{ env.SRC }}"
                curl -fsSL "$SRC/install-box.sh" -o /tmp/install-box.sh   # this commit'"'"'s installer, against real releases
                bash /tmp/install-box.sh --version v0.3.2 > /tmp/ib1.log 2>&1 || { tail -20 /tmp/ib1.log; exit 1; }
                v=$(/var/opt/laib/laib version); echo "pinned: $v"; [ "$v" = "laib v0.3.2" ]
                bash /tmp/install-box.sh > /tmp/ib2.log 2>&1 || { tail -20 /tmp/ib2.log; exit 1; }
                v=$(/var/opt/laib/laib version); echo "latest: $v"
                case "$v" in "laib v"*) ;; *) echo "latest is not a release version"; exit 1;; esac
                [ "$v" != "laib v0.3.2" ]
                bash /tmp/install-box.sh --source "$SRC" > /tmp/ib3.log 2>&1 || { tail -20 /tmp/ib3.log; exit 1; }
                v=$(/var/opt/laib/laib version); echo "this commit: $v"; [ "$v" = "laib '"${GITHUB_SHA::7}"'" ]
                curl -fsS http://127.0.0.1:5900/ready > /tmp/ready.json; cat /tmp/ready.json; echo
                grep -q bereit /tmp/ready.json
                # the RUNNING service is the new version (enable --now never restarted it, #37)
                grep -q "\"version\":\"'"${GITHUB_SHA::7}"'\"" /tmp/ready.json || { echo "the running laib is not this commit"; exit 1; }
                test -f /var/opt/laib/laib.prev || { echo "no previous binary kept for laib self rollback"; exit 1; }
                systemctl --user is-active laib.service caddy.service
                # and back: self rollback restores the previous release and restarts
                export LAIB_HOME=/mnt/data/laib LAIB_ACTOR=human:core; L=/var/opt/laib/laib
                $L self rollback
                for i in $(seq 1 20); do curl -fsS http://127.0.0.1:5900/ready > /tmp/ready.json 2>/dev/null && break; sleep 1; done
                cat /tmp/ready.json; echo
                prev=$(/var/opt/laib/laib version); echo "rolled back to: $prev"; [ "$prev" != "laib '"${GITHUB_SHA::7}"'" ]
                bash /tmp/install-box.sh --source "$SRC" > /tmp/ib4.log 2>&1 || { tail -20 /tmp/ib4.log; exit 1; }
                v=$(/var/opt/laib/laib version); echo "forward again: $v"; [ "$v" = "laib '"${GITHUB_SHA::7}"'" ]'
      - name: remove — units stopped, files gone, data kept
        run: |
          SSH="ssh -q -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i key -p 2222 core@127.0.0.1"
          $SSH 'set -euo pipefail; export LAIB_HOME=/mnt/data/laib LAIB_ACTOR=human:core; L=/var/opt/laib/laib
                sed -i -E "s/proxy: caddy/proxy: \"\"/" /mnt/data/laib/state/box.yml; grep -n proxy /mnt/data/laib/state/box.yml   # caddy holds the proxy role; free it first
                $L remove caddy
                sleep 2
                if podman ps --format "{{.Names}}" | grep -q caddy; then echo "caddy still running"; exit 1; fi
                if systemctl --user is-active --quiet caddy.service; then echo "caddy.service still active"; exit 1; fi
                if [ -e ~/.config/containers/systemd/caddy ]; then echo "Quadlet files left in ~/.config/containers/systemd/caddy"; exit 1; fi
                if [ -e /mnt/data/laib/state/services/caddy ]; then echo "caddy is still in the state"; exit 1; fi
                test -f /mnt/data/stacks/caddy/data/vm-marker || { echo "the data was not kept"; exit 1; }
                echo "units stopped, files gone, data kept"
                $L status; $L diag || true'
      - name: a lost mirror member is red, not "by design" — boot without one data disk
        run: |
          . ./box.sh
          off
          # data2 is gone; the device names shift (the foreign disk is vdc now): assembly goes by UUID
          DISKS="disk.qcow2 data1.qcow2 foreign.raw" ./vm.sh order=c
          ready
          $SSH 'set -euo pipefail
                cat /proc/mdstat; cat /etc/laib/data-disk
                grep -qE "\[(U_|_U)\]" /proc/mdstat || { echo "the array should run degraded now"; exit 1; }
                grep -q "md.* xfs" <<<"$(findmnt -n -o SOURCE,FSTYPE /mnt/data)" || { echo "the degraded array is not mounted"; exit 1; }
                grep -q MEMBERS=2 /etc/laib/data-disk || { echo "the record forgot the mirror"; exit 1; }
                test -f /mnt/data/laib/vm-marker || { echo "the data is not there"; exit 1; }
                d=$(LAIB_HOME=/mnt/data/laib /var/opt/laib/laib diag 2>&1 || true); echo "$d"
                grep -qE "^rot +raid " <<<"$d" || { echo "diag does not say the mirror is gone"; exit 1; }'
          marker
      - name: disaster recovery — backup to a second disk, data disks gone, reinstall, restore --box with only the sheet (#40)
        run: |
          . ./box.sh
          # the foreign ext4 disk (label backup) is the off-box repo; a database service from a
          # registry (postgres, quiesce: true) carries a row that must survive
          $SSH 'set -euo pipefail; export LAIB_HOME=/mnt/data/laib LAIB_ACTOR=human:core; L=/var/opt/laib/laib
                sudo mkdir -p /mnt/backup && sudo mount -L backup /mnt/backup && sudo chown core:core /mnt/backup
                sed -i -E "s|^( *repo:) .*|\1 /mnt/backup/restic|" /mnt/data/laib/state/box.yml; grep -n "repo:" /mnt/data/laib/state/box.yml
                R=/mnt/data/laib/registries/vm/templates/pgtest; mkdir -p "$R"
                printf "name: pgtest\ntemplate: {registry: vm, name: pgtest, version: 1}\nroutes: []\nsecrets: []\ndata:\n  - path: \${DATA_DIR}/pgtest/pgdata\n    quiesce: true\nports: []\n" > "$R/laib.yml"
                printf "IMAGE: docker.io/library/postgres:16-alpine\n" > "$R/values.example.yml"
                printf "[Container]\nImage=\${IMAGE}\nEnvironment=POSTGRES_PASSWORD=vmtest\nVolume=\${DATA_DIR}/pgtest/pgdata:/var/lib/postgresql/data:z\nPublishPort=127.0.0.1:5432:5432\n\n[Service]\nRestart=always\n\n[Install]\nWantedBy=default.target\n" > "$R/pgtest.container"
                podman pull -q docker.io/library/postgres:16-alpine >/dev/null
                $L add caddy; $L add pgtest
                for i in $(seq 1 30); do podman exec systemd-pgtest pg_isready -U postgres >/dev/null 2>&1 && break; sleep 2; done
                podman exec systemd-pgtest psql -U postgres -c "create table t(x int); insert into t values (42);"
                echo "caddy marker for the recovery" > /mnt/data/stacks/caddy/data/vm-marker
                $L backup | tee /tmp/backup.txt
                grep -q "angehalten für den Snapshot: pgtest" /tmp/backup.txt || { echo "the database was not quiesced for the snapshot"; exit 1; }
                systemctl --user is-active pgtest.service || { echo "pgtest not started again after the snapshot"; exit 1; }
                $L backup check | tee /tmp/check.txt; grep -q "grün" /tmp/check.txt
                $L recovery-sheet > /tmp/sheet.txt; sed -n "s/^  \(AGE-SECRET-KEY-.*\)$/\1/p" /tmp/sheet.txt > /tmp/age.key; sed -n "s/^restic-Passwort: *//p" /tmp/sheet.txt > /tmp/restic.pw
                test -s /tmp/age.key && test -s /tmp/restic.pw || { echo "the sheet lacks the key or the password"; cat /tmp/sheet.txt; exit 1; }
                $L recovery-sheet --confirm
                $L diag || true
                sudo umount /mnt/backup'
          # the sheet, as the human would have it on paper
          $SSH 'cat /tmp/age.key' > sheet-age.key; $SSH 'cat /tmp/restic.pw' > sheet-restic.pw
          off
          # the data disks are gone: two new, empty ones; the OS disk and the backup disk stay
          qemu-img create -q -f qcow2 data1.qcow2 9G; qemu-img create -q -f qcow2 data2.qcow2 9G
          ISO=laib-vm-reinstall.iso DISKS="disk.qcow2 data1.qcow2 data2.qcow2 foreign.raw" ./vm.sh once=d
          for i in $(seq 1 120); do
            if $SSH 'systemctl is-active --quiet laib-firstboot.service && test -f /etc/laib/installed && curl -fsS http://127.0.0.1:5900/ready' 2>/dev/null; then echo; echo "reinstalled on fresh data disks after $((i*10)) s"; break; fi
            [ $i -eq 120 ] && { echo "laib never became ready after the reinstall"; exit 1; }
            sleep 10
          done
          scp -q -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i key -P 2222 sheet-age.key sheet-restic.pw core@127.0.0.1:/tmp/
          $SSH 'set -euo pipefail; export LAIB_HOME=/mnt/data/laib LAIB_ACTOR=human:core; L=/var/opt/laib/laib
                test -f /mnt/data/laib/vm-marker && { echo "the old data disk is still there"; exit 1; } || echo "fresh data disk, as intended"
                # step 2 of the sheet: the key, the repo reachable, box.yml pointing at it
                install -m 0600 /tmp/sheet-age.key /mnt/data/laib/age.key
                sudo mkdir -p /mnt/backup && sudo mount -L backup /mnt/backup
                sed -i -E "s|^( *repo:) .*|\1 /mnt/backup/restic|" /mnt/data/laib/state/box.yml
                # step 3
                RESTIC_PASSWORD="$(cat /tmp/sheet-restic.pw)" $L restore --box latest | tee /tmp/restore.txt
                # step 4
                $L status | tee /tmp/status.txt
                grep -q "before\|for the recovery" /mnt/data/stacks/caddy/data/vm-marker || { echo "caddy data not back"; exit 1; }
                for i in $(seq 1 30); do podman exec systemd-pgtest pg_isready -U postgres >/dev/null 2>&1 && break; sleep 2; done
                v=$(podman exec systemd-pgtest psql -U postgres -tAc "select x from t"); echo "row after recovery: $v"; [ "$v" = 42 ]
                curl -fsS http://127.0.0.1:5900/ready | tee /tmp/ready.json; echo; grep -q "\"state\":\"bereit\"" /tmp/ready.json
                $L secret list | grep -q RESTIC_PASSWORD
                $L journal --since 1h | grep -E "restore|backup" | tail -8
                echo "disaster recovery done with the sheet alone"'
      - name: logs
        if: always()
        run: |
          echo "--- serial"; tail -c 20000 serial.log || true
          echo "--- build server"; tail -20 http.log || true
          ssh -q -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 -i key -p 2222 core@127.0.0.1 'echo "--- ready"; curl -s -w " HTTP %{http_code}\n" http://127.0.0.1:5900/ready; echo "--- lock"; cat /mnt/data/laib/apply.lock 2>/dev/null || echo none; echo "--- data disk"; journalctl --no-pager -b -u laib-data-disk | tail -12; cat /proc/mdstat; findmnt -n /mnt/data || echo "/mnt/data not mounted"; echo "--- system"; cat /proc/cmdline; journalctl --no-pager --list-boots | tail -5; findmnt -n -o SOURCE,TARGET / /sysroot /var 2>/dev/null; ls -la /usr/local/bin/ /var/usrlocal/bin/ 2>&1 | head -20; rpm-ostree status 2>/dev/null | head -12; echo "--- firstboot"; journalctl --no-pager -b -u laib-firstboot | tail -20; echo "--- laib"; journalctl --user --no-pager -u laib | tail -30; LAIB_HOME=/mnt/data/laib /var/opt/laib/laib status 2>&1 | head -5; echo "--- caddy"; journalctl --user --no-pager -u caddy | tail -20; podman ps -a' || true
          [ -f qemu.pid ] && sudo kill "$(cat qemu.pid)" || true
