# The first install, end to end, in a VM on the runner: laib-stick builds the
# ISO, QEMU/KVM boots it, the live system installs Fedora CoreOS to a virtual
# disk and reboots, the first boot fetches install-box.sh with the job's
# token and runs `laib init`; then we SSH in and do a real `laib add`.
# This is the closest thing to the NUC without the NUC. BIOS boot (the EFI
# boot-order step is the NUC's job; post-install.sh tolerates no EFI).
name: vm-install
on:
  push:
    branches: [main]
    paths: [usb/**, internal/stick/**, cmd/laib-stick/**, scripts/install-box.sh, cmd/laib/**, internal/**, templates/**, .github/workflows/vm-install.yml]
  workflow_dispatch:
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # install, mirror sync and a reinstall take ~60 min on the runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: qemu + kvm
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86 qemu-utils
          test -e /dev/kvm && sudo chmod 666 /dev/kvm && echo "kvm ok"
      - name: the stick
        run: |
          ssh-keygen -q -t ed25519 -N "" -f key
          go build -o laib-stick ./cmd/laib-stick
          # the box installs the latest release on first boot; the apply step
          # below then swaps in this commit's binaries so every push is tested
          for b in laib laib-operator laib-lease; do CGO_ENABLED=0 go build -ldflags "-s -w -X main.Version=${GITHUB_SHA::7}" -o bin-$b ./cmd/$b; done
          ./laib-stick --yes --hostname vm --domain vm.test --ssh-key key.pub --token "${{ github.token }}" --out laib-vm.iso
          ls -la laib-vm.iso
      - name: cross-check with coreos-installer, serial console for the log
        run: |
          CI_IMG=quay.io/coreos/coreos-installer:release
          podman run --rm -v "$PWD:/data:z" -w /data $CI_IMG iso ignition show laib-vm.iso > live.ign
          python3 -c "import json; d=json.load(open('live.ign')); print('units:', [u['name'] for u in d['systemd']['units']]); print('files:', [f['path'] for f in d['storage']['files']])"
          podman run --rm -v "$PWD:/data:z" -w /data $CI_IMG iso kargs modify -a console=ttyS0,115200n8 laib-vm.iso
      - name: boot, install, reboot, first boot
        run: |
          # three disks: the OS goes to the smallest (pre-install), the largest
          # becomes the data RAID1 with one member (laib-data-disk), the third
          # joins as the mirror later in this job
          # the runner has ~14 GB free: zero writes (the mirror sync copies a
          # mostly empty 9G member) must punch holes in the qcow2 files, not fill them
          qemu-img create -q -f qcow2 disk.qcow2 8G
          qemu-img create -q -f qcow2 data1.qcow2 9G
          qemu-img create -q -f qcow2 data2.qcow2 9G
          df -h / | tail -1
          cat > vm.sh <<'EOF'
          #!/usr/bin/env bash
          # $1 = qemu -boot argument: order=cd (disk first, empty disk falls through to the stick),
          # once=d (the stick once = reinstall; without "once" the VM would reinstall forever,
          # the job the EFI post-install step does on real hardware)
          qemu-system-x86_64 -enable-kvm -cpu host -m 4096 -smp 2 -display none -daemonize \
            -pidfile qemu.pid -serial file:serial.log \
            -drive file=disk.qcow2,if=virtio,format=qcow2,discard=unmap,detect-zeroes=unmap \
            -drive file=data1.qcow2,if=virtio,format=qcow2,discard=unmap,detect-zeroes=unmap \
            -drive file=data2.qcow2,if=virtio,format=qcow2,discard=unmap,detect-zeroes=unmap \
            -cdrom laib-vm.iso -boot $1 \
            -nic user,model=virtio,hostfwd=tcp::2222-:22
          EOF
          chmod +x vm.sh; ./vm.sh order=cd
          SSH="ssh -q -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 -i key -p 2222 core@127.0.0.1"
          for i in $(seq 1 120); do
            # ready AND the first-boot unit finished (it applies and shreds the token after serve is up)
            if $SSH 'systemctl is-active --quiet laib-firstboot.service && curl -fsS http://127.0.0.1:5900/ready' 2>/dev/null; then echo; echo "ready after $((i*10)) s"; break; fi
            [ $i -eq 120 ] && { echo "laib never became ready"; exit 1; }
            sleep 10
          done
          $SSH 'systemctl status laib-firstboot --no-pager; /var/opt/laib/laib version; /var/opt/laib/laib status; /var/opt/laib/laib plan; /var/opt/laib/laib diag; cat /etc/laib/firstboot.env 2>/dev/null && { echo "firstboot.env still on disk"; exit 1; } || true'
      - name: the data disk — RAID1 with one member on /mnt/data, then the mirror joins
        run: |
          SSH="ssh -q -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i key -p 2222 core@127.0.0.1"
          # this commit's binaries replace the release's (installed on first boot), so laib disk / add / backup test main
          scp -q -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i key -P 2222 bin-laib bin-laib-operator bin-laib-lease core@127.0.0.1:/tmp/
          $SSH 'for b in laib laib-operator laib-lease; do sudo install -m 0755 /tmp/bin-$b /var/opt/laib/$b; done; systemctl --user restart laib.service; sleep 2; /var/opt/laib/laib version'
          $SSH 'set -e
                journalctl --no-pager -b -u laib-data-disk | tail -12
                cat /proc/mdstat; cat /etc/laib/data-disk
                findmnt -n -o SOURCE,FSTYPE /mnt/data | grep -q "md.* xfs" || { echo "/mnt/data is not the RAID"; exit 1; }
                grep -q "\[U_\]" /proc/mdstat || { echo "array should be degraded by design"; exit 1; }
                lsblk -ndo NAME,SIZE /dev/vda /dev/vdb /dev/vdc
                echo "laib data disk marker $(date -u +%s)" | tee /mnt/data/laib/vm-marker
                # the mirror: the untouched 9G disk (no partitions) joins through laib disk add, resync to [UU]
                spare=""; for d in /dev/vd?; do [ "$(lsblk -nro NAME "$d" | wc -l)" = 1 ] && spare=$d; done
                echo "spare: $spare"; test -n "$spare"
                export LAIB_HOME=/mnt/data/laib LAIB_ACTOR=human:core; L=/var/opt/laib/laib
                $L disk status
                $L disk add "$spare"
                for i in $(seq 1 120); do grep -q "\[UU\]" /proc/mdstat && break; sleep 2; done
                $L disk status; $L diag || true
                grep -q "\[UU\]" /proc/mdstat || { echo "mirror did not sync"; exit 1; }
                cat /etc/laib/data-disk | grep -q MEMBERS=2
                sudo sync'
          df -h / | tail -1; ls -la *.qcow2
      - name: reinstall from the stick — the data disk survives
        run: |
          sudo kill "$(cat qemu.pid)"; sleep 3
          ./vm.sh once=d
          SSH="ssh -q -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 -i key -p 2222 core@127.0.0.1"
          for i in $(seq 1 120); do
            if $SSH 'test -f /var/opt/laib/laib && curl -fsS http://127.0.0.1:5900/ready' 2>/dev/null; then echo; echo "reinstalled and ready after $((i*10)) s"; break; fi
            [ $i -eq 120 ] && { echo "laib never became ready after the reinstall"; exit 1; }
            sleep 10
          done
          $SSH 'set -e; journalctl --no-pager -b -u laib-data-disk | tail -6; cat /proc/mdstat
                findmnt -n -o SOURCE,FSTYPE /mnt/data | grep -q "md.* xfs" || { echo "/mnt/data is not the RAID after reinstall"; exit 1; }
                test -f /mnt/data/laib/vm-marker && cat /mnt/data/laib/vm-marker || { echo "marker lost: the data disk was recreated"; exit 1; }
                grep -q "\[UU\]" /proc/mdstat || { echo "mirror not assembled after reinstall"; exit 1; }'
      - name: a real apply on real CoreOS — the NUC's step 2 and 3, Caddy with its own CA
        run: |
          SSH="ssh -q -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i key -p 2222 core@127.0.0.1"
          # the reinstall brought the release's binaries back: this commit's again
          scp -q -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i key -P 2222 bin-laib bin-laib-operator bin-laib-lease core@127.0.0.1:/tmp/
          $SSH 'for b in laib laib-operator laib-lease; do sudo install -m 0755 /tmp/bin-$b /var/opt/laib/$b; done; systemctl --user restart laib.service; sleep 2; /var/opt/laib/laib version'
          # the job token may read this repo's packages; a box uses a PAT with packages:read or public packages
          $SSH "printf '%s' '${{ github.token }}' | podman login ghcr.io -u '${{ github.actor }}' --password-stdin && podman pull -q ghcr.io/mdopp/laib-caddy:2 >/dev/null && echo 'image pulled'"
          $SSH 'export LAIB_HOME=/mnt/data/laib LAIB_ACTOR=human:core; L=/var/opt/laib/laib
                set -e
                sysctl -n net.ipv4.ip_unprivileged_port_start
                echo "tls: internal" >> /mnt/data/laib/state/box.yml
                $L add caddy
                $L status
                podman ps
                for i in $(seq 1 30); do code=$(curl -sk --resolve laib.vm.test:443:127.0.0.1 -o /dev/null -w "%{http_code}" https://laib.vm.test/ || true); [ -n "$code" ] && [ "$code" != 000 ] && break; sleep 2; done
                echo "https://laib.vm.test -> HTTP $code (Caddy, own CA)"
                echo "$code" | grep -Eq "^(200|30[0-9]|40[13])$"
                $L journal --since 1h'
      - name: backup and restore — restic against a real repo
        run: |
          SSH="ssh -q -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i key -p 2222 core@127.0.0.1"
          $SSH 'set -e; export LAIB_HOME=/mnt/data/laib LAIB_ACTOR=human:core; L=/var/opt/laib/laib
                echo "backup:" >> /mnt/data/laib/state/box.yml; echo "  repo: /var/home/core/restic-repo" >> /mnt/data/laib/state/box.yml
                echo "caddy marker before backup" > /mnt/data/stacks/caddy/data/vm-marker
                $L backup
                rm /mnt/data/stacks/caddy/data/vm-marker
                $L restore latest caddy
                cat /mnt/data/stacks/caddy/data/vm-marker | grep -q "before backup"
                $L journal --since 1h | grep -E "backup|restore"'
      - name: update path — install-box.sh again, a pinned version, then latest
        run: |
          SSH="ssh -q -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i key -p 2222 core@127.0.0.1"
          $SSH 'set -e; export LAIB_GH_TOKEN="${{ github.token }}"
                fetch() { curl -fsSL -H "Authorization: Bearer $LAIB_GH_TOKEN" -H "Accept: application/vnd.github.raw" https://api.github.com/repos/mdopp/laib/contents/scripts/install-box.sh; }
                fetch | bash -s -- --version v0.3.2 | tail -3
                /var/opt/laib/laib version | grep -q v0.3.2
                fetch | bash -s -- | tail -3
                /var/opt/laib/laib version | grep -qv v0.3.2
                curl -fsS http://127.0.0.1:5900/ready | grep -q bereit
                systemctl --user is-active laib.service caddy.service'
      - name: remove — units stopped, files gone, data kept
        run: |
          SSH="ssh -q -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i key -p 2222 core@127.0.0.1"
          $SSH 'for b in laib laib-operator laib-lease; do sudo install -m 0755 /tmp/bin-$b /var/opt/laib/$b; done; systemctl --user restart laib.service; sleep 2'
          $SSH 'set -e; export LAIB_HOME=/mnt/data/laib LAIB_ACTOR=human:core; L=/var/opt/laib/laib
                sed -i -E "s/proxy: caddy/proxy: \"\"/" /mnt/data/laib/state/box.yml; grep -n proxy /mnt/data/laib/state/box.yml   # caddy holds the proxy role; free it first
                $L remove caddy
                sleep 2; podman ps --format "{{.Names}}" | grep -q caddy && { echo "caddy still running"; exit 1; }
                systemctl --user is-active caddy.service && exit 1 || true
                test -f /mnt/data/stacks/caddy/data/vm-marker && echo "data kept"
                $L status; $L diag || true'
      - name: logs
        if: always()
        run: |
          echo "--- serial"; tail -c 20000 serial.log || true
          ssh -q -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 -i key -p 2222 core@127.0.0.1 'journalctl --no-pager -b -u laib-firstboot; journalctl --user --no-pager -u laib | tail -50; echo "--- caddy"; journalctl --user --no-pager -u caddy | tail -40; podman ps -a' || true
          [ -f qemu.pid ] && sudo kill "$(cat qemu.pid)" || true
