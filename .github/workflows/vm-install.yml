                $L add probe
                sudo nft list table inet laib > /tmp/nft.txt 2>&1 || true
                grep -q 8080 /tmp/nft.txt || { echo "8080 is not in the ruleset"; cat /tmp/nft.txt; sudo nft list ruleset; exit 1; }
                # any HTTP answer is an answer (busybox httpd says 404 for / without an index); only no connection fails
                for i in $(seq 1 20); do curl -sS -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
                curl -sS -o /dev/null -w "probe on loopback: HTTP %{http_code}\n" http://127.0.0.1:8080/ || { echo "the probe service does not answer on loopback"; exit 1; }'
          rc=$(probe); echo "probe with the ruleset: curl rc $rc"; [ "$rc" = 28 ] || { echo "a lan: false port answered through the NIC"; exit 1; }
          # the port leaves the drop list and is open at once, without a reboot; and closes again (#102)
          lan() { $SSH "set -euo pipefail; export LAIB_HOME=/mnt/data/laib LAIB_ACTOR=human:core
                sed -i -E 's/lan: (true|false)/lan: $1/' /mnt/data/laib/state/services/probe/laib.yml
                /var/opt/laib/laib apply --reason 'probe lan: $1 (#102)' | tail -3"; }
          lan true
          rc=$(probe); echo "probe after lan: true, no reboot: curl rc $rc"; [ "$rc" != 28 ] || { echo "a port that left the drop list is still dropped (#102)"; $SSH 'sudo nft list ruleset'; exit 1; }
          lan false
          rc=$(probe); echo "probe after lan: false again: curl rc $rc"; [ "$rc" = 28 ] || { echo "the port is not dropped again"; $SSH 'sudo nft list ruleset'; exit 1; }
          $SSH 'sudo nft delete table inet laib'
          rc=$(probe); echo "probe without the ruleset: curl rc $rc"; [ "$rc" != 28 ] || { echo "the probe cannot tell the ruleset apart"; exit 1; }
          $SSH 'set -euo pipefail; export LAIB_HOME=/mnt/data/laib LAIB_ACTOR=human:core; L=lw; lw() { local i rc; for i in $(seq 1 60); do rc=0; /var/opt/laib/laib "$@" || rc=$?; [ "$rc" = 4 ] || return "$rc"; echo "laib $1: the lock is busy (the converge timer, #211), trying again" >&2; sleep 3; done; return 4; }
                curl -fsS http://127.0.0.1:5900/ready | tee /tmp/ready.json; echo
                grep -q "\"firewall\":\"fehlt\"" /tmp/ready.json || { echo "/ready does not say the firewall is missing"; exit 1; }
                $L converge --force || true
                sudo nft list table inet laib >/dev/null || { echo "converge did not load the ruleset"; exit 1; }
                grep -q "firewall" <<<"$($L journal --since 10m)" || { echo "no journal line for the reload"; exit 1; }'
          rc=$(probe); echo "probe after converge: curl rc $rc"; [ "$rc" = 28 ]
          # #257: a container's output is in journald under its service's unit, laib logs shows it, and the
          # journal is the box's own deliberate one (persistent, size and age capped); the line is computed
          # by the container (tr), so the unit's argv never matches it
          $SSH 'set -euo pipefail; export LAIB_HOME=/mnt/data/laib LAIB_ACTOR=human:core; L=lw; lw() { local i rc; for i in $(seq 1 60); do rc=0; /var/opt/laib/laib "$@" || rc=$?; [ "$rc" = 4 ] || return "$rc"; echo "laib $1: the lock is busy (the converge timer, #211), trying again" >&2; sleep 3; done; return 4; }
                R=/mnt/data/laib/registries/vm/templates/logmark; mkdir -p "$R"
                printf "name: logmark\ntemplate: {registry: vm, name: logmark, version: 1}\nroutes: []\nsecrets: []\ndata: []\nports: []\n" > "$R/laib.yml"
                printf "IMAGE: mirror.gcr.io/library/busybox:stable\n" > "$R/values.example.yml"
                printf "[Container]\nImage=\${IMAGE}\nExec=sh -c \"echo laib-log-marker_${{ github.run_id }} | tr _ -; exec sleep 1000000\"\n\n[Service]\nRestart=always\n\n[Install]\nWantedBy=default.target\n" > "$R/logmark.container"
                $L add logmark
                M=laib-log-marker-${{ github.run_id }}
                for i in $(seq 1 20); do $L logs logmark --since 10m > /tmp/logs.txt; grep -q "$M" /tmp/logs.txt && break; sleep 1; done
                cat /tmp/logs.txt; grep -q "$M" /tmp/logs.txt || { echo "laib logs does not show the container output (#257)"; podman logs systemd-logmark || true; journalctl --user --no-pager -n 30 -o verbose | grep -E "MESSAGE=|_SYSTEMD_USER_UNIT|CONTAINER_NAME" | tail -30; exit 1; }
                echo "log driver: $(podman inspect --format "{{.HostConfig.LogConfig.Type}}" systemd-logmark)"
                [ "$(podman inspect --format "{{.HostConfig.LogConfig.Type}}" systemd-logmark)" = journald ] || { echo "the container does not log to journald (#257)"; exit 1; }
                grep -q "$M" <<<"$(podman logs systemd-logmark 2>&1)" || { echo "podman logs does not show the container output"; exit 1; }
                systemd-analyze cat-config systemd/journald.conf | grep -vE "^\s*(#|$)" | tee /tmp/journald.txt
                last() { sed -n "s/^$1=//p" /tmp/journald.txt | tail -1; }
                [ "$(last Storage)" = persistent ] && [ "$(last SystemMaxUse)" = 4G ] && [ "$(last MaxRetentionSec)" = 4week ] && [ "$(last MaxFileSec)" = 1week ] || { echo "journald is not on the box'"'"'s limits (#257)"; exit 1; }
                journalctl --no-pager -b -u systemd-journald | grep -E "System Journal|Runtime Journal" | tail -2 || true; journalctl --disk-usage'
          off; DISKS="disk.qcow2 data1.qcow2 data2.qcow2 foreign.raw" ./vm.sh order=c; ready
          $SSH 'set -euo pipefail; export LAIB_HOME=/mnt/data/laib LAIB_ACTOR=human:core; L=lw; lw() { local i rc; for i in $(seq 1 60); do rc=0; /var/opt/laib/laib "$@" || rc=$?; [ "$rc" = 4 ] || return "$rc"; echo "laib $1: the lock is busy (the converge timer, #211), trying again" >&2; sleep 3; done; return 4; }
                grep -q 8080 <<<"$(sudo nft list table inet laib)" || { echo "the ruleset is gone after the reboot"; exit 1; }
                curl -fsS http://127.0.0.1:5900/ready | tee /tmp/ready.json; echo
                grep -q "\"firewall\":\"geladen\"" /tmp/ready.json
                grep -q "\"state\":\"bereit\"" /tmp/ready.json || { echo "not bereit after the reboot"; exit 1; }
                systemctl --user is-active caddy.service probe.service
                podman image rm -f ghcr.io/mdopp/laib-caddy:2 >/dev/null 2>&1 || true
                podman pull -q ghcr.io/mdopp/laib-caddy:2 >/dev/null || { echo "a private image cannot be pulled after the reboot: the login did not survive"; exit 1; }
                echo "private image pulled after the reboot with the kept login"
                if grep -q . <<<"$(systemctl --failed --no-legend --type=mount)"; then echo "a mount unit failed at boot (#203)"; systemctl --failed --type=mount --no-pager; exit 1; fi
                echo "services up after the reboot, no failed mount"'
          rc=$(probe); echo "probe after the reboot: curl rc $rc"; [ "$rc" = 28 ]
          # #257: the marker of the boot before is still there: the journal is on disk, not in /run
          $SSH 'set -euo pipefail; M=laib-log-marker-${{ github.run_id }}
                grep -q "$M" <<<"$(journalctl --user --no-pager -b -1 -u logmark.service -o cat)" || { echo "the container output of the previous boot is gone: the journal is not persistent (#257)"; journalctl --list-boots --no-pager | tail -3; exit 1; }
                grep -q "$M" <<<"$(journalctl --user --no-pager -b 0 -u logmark.service -o cat)" || { echo "after the reboot the container output is not in journald (#257)"; exit 1; }
                echo "container output in journald under logmark.service, kept across the reboot"
                LAIB_HOME=/mnt/data/laib LAIB_ACTOR=human:core /var/opt/laib/laib remove logmark >/dev/null'
          # #281: a box that never got the box config (the migrated Kraftwerk is never reinstalled) is red in
          # diag, and install-box.sh --box-config puts it right, no reboot
          $SSH 'set -euo pipefail; export LAIB_HOME=/mnt/data/laib LAIB_ACTOR=human:core
                sudo rm -f /etc/systemd/journald.conf.d/50-laib.conf; rm -f ~/.config/containers/containers.conf.d/50-laib.conf; sudo systemctl restart systemd-journald
                d=$(/var/opt/laib/laib diag 2>&1 || true); grep -E "^rot +box " <<<"$d" || true
                [ "$(grep -cE "^rot +box " <<<"$d")" = 2 ] || { echo "diag is not red twice on a box without its config (#281)"; echo "$d"; exit 1; }
                curl -fsSL ${{ env.SRC }}/install-box.sh | bash -s -- --box-config
                d=$(/var/opt/laib/laib diag 2>&1 || true)
                if grep -qE "^rot +box " <<<"$d"; then echo "still red after install-box.sh --box-config (#281)"; echo "$d"; exit 1; fi
                sleep 2; journalctl --no-pager -u systemd-journald --since -3min | grep "System Journal" | tail -1 | tee /tmp/jd.txt || true
                grep -q "max 4G" /tmp/jd.txt || { echo "journald did not take the limits without a reboot (#281)"; exit 1; }
                echo "box config back from install-box.sh --box-config: diag green on it, journald on 4G"'
          $SSH 'set -euo pipefail; export LAIB_HOME=/mnt/data/laib LAIB_ACTOR=human:core; /var/opt/laib/laib remove probe >/dev/null; rm -rf /mnt/data/laib/registries/vm'

      - name: auth, adguard, radicale — hooks in the image, pre-start before the first start (#36)
        if: matrix.part == 'services' || matrix.part == 'logins'
        run: |
          SSH="ssh -q -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i key -p 2222 core@127.0.0.1"
          $SSH 'set -euo pipefail; export LAIB_HOME=/mnt/data/laib LAIB_ACTOR=human:core; L=lw; lw() { local i rc; for i in $(seq 1 60); do rc=0; /var/opt/laib/laib "$@" || rc=$?; [ "$rc" = 4 ] || return "$rc"; echo "laib $1: the lock is busy (the converge timer, #211), trying again" >&2; sleep 3; done; return 4; }
                podman pull -q "${{ env.HOOKS }}" >/dev/null; echo "hooks image pulled with the box'"'"'s own credentials"
