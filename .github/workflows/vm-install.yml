                grep -q "\"IsAdministrator\":true" /tmp/jf.json || { echo "a member of admins is no Jellyfin administrator"; exit 1; }
                code=$(jf -d "{\"Username\":\"core\",\"Pw\":\"not-the-password\"}" http://127.0.0.1:8096/Users/AuthenticateByName)
                echo "jellyfin login as core with a wrong password: HTTP $code"; [ "$code" = 401 ] || exit 1
                [ "$(curl -s http://127.0.0.1:8096/QuickConnect/Enabled)" = true ] || { echo "Quick Connect is off"; exit 1; }
                echo "quick connect on"
                $L remove media >/dev/null
                rm -rf "$R"; podman unshare rm -rf /mnt/data/stacks/media /mnt/data/stacks/jf-media
                podman image rm -f docker.io/jellyfin/jellyfin:latest >/dev/null || true
                echo "media: the family logs in to Jellyfin with LLDAP"'
