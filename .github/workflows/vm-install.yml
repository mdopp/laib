                grep -q "LDAP-Authentication plugin installed" /tmp/add-media.txt || { echo "the LDAP plugin was not installed"; exit 1; }
                X=/mnt/data/stacks/media/jellyfin-config/plugins/configurations/LDAP-Auth.xml
                podman unshare grep -q "<LdapBindUser>uid=jellyfin,ou=people,dc=vm,dc=test</LdapBindUser>" "$X" || { echo "the plugin does not bind read-only"; exit 1; }
                C="MediaBrowser Client=\"vm\", Device=\"vm\", DeviceId=\"vm-256\", Version=\"1\""
                jf() { curl -s -o /tmp/jf.json -w "%{http_code}" -H "Authorization: $C" -H "Content-Type: application/json" "$@"; }
                code=$(jf -d "{\"Username\":\"core\",\"Pw\":\"vm-operator-pw-254\"}" http://127.0.0.1:8096/Users/AuthenticateByName)
