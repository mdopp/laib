                for img in docker.io/filebrowser/filebrowser:latest docker.io/syncthing/syncthing:latest docker.io/servercontainers/samba:latest docker.io/library/python:3.13-alpine; do podman pull -q "$img" >/dev/null; done
                $L add file-share FILEBROWSER_ADMIN_USER=core
                code=000; for i in $(seq 1 30); do code=$(curl -s -o /dev/null -X POST -H "Remote-User: vmtest" -w "%{http_code}" http://127.0.0.1:8088/api/login || true); [ "$code" = 200 ] && break; sleep 2; done
                echo "File Browser login with Remote-User on loopback -> HTTP $code"; [ "$code" = 200 ]
                code=$(curl -s -o /dev/null -X POST -w "%{http_code}" http://127.0.0.1:8088/api/login || true)
                echo "File Browser login without Remote-User -> HTTP $code (proxy auth: no header, no user)"; [ "$code" != 200 ]
                users() { tok=$(curl -s -X POST -H "Remote-User: $1" http://127.0.0.1:8088/api/login); curl -s -o /dev/null -w "%{http_code}" -H "X-Auth: $tok" http://127.0.0.1:8088/api/users; }
                code=$(users core); echo "File Browser user list as core, the admin from FILEBROWSER_ADMIN_USER -> HTTP $code"; [ "$code" = 200 ]
                code=$(users vmtest); echo "File Browser user list as vmtest, a family member -> HTTP $code"; [ "$code" = 403 ]
                code=$(curl -s --cacert "$root" --capath "$none" --resolve files.vm.test:443:127.0.0.1 -H "Remote-User: admin" -o /dev/null -w "%{http_code}" https://files.vm.test/ || true)
                echo "https://files.vm.test/ with a forged Remote-User, no session -> HTTP $code"; [ "$code" = 302 ] || [ "$code" = 401 ]
                code=$(curl -s --cacert "$root" --capath "$none" --resolve files.vm.test:443:127.0.0.1 -H "Remote-User: admin" -X POST -o /dev/null -w "%{http_code}" https://files.vm.test/api/login || true)
                echo "POST https://files.vm.test/api/login with a forged Remote-User, no session -> HTTP $code"; [ "$code" = 302 ] || [ "$code" = 303 ] || [ "$code" = 401 ]
                # #230: a root-owned entry in the share (a disk import) stops no unit that mounts it
                # a disk import brings its own label too; one equal to the share'"'"'s would let podman skip the file
                S=/mnt/data/stacks/file-share/data/music; sudo install -d -o root -g root "$S/import"; sudo touch "$S/import/root.flac"; sudo chcon -t user_tmp_t "$S/import" "$S/import/root.flac"
                getenforce; ls -dZn "$S" "$S/import" "$S/import/root.flac"
                podman pull -q docker.io/linuxserver/beets:latest >/dev/null
                $L add beets
                systemctl --user restart file-share-filebrowser.service file-share-samba.service file-share-syncthing.service beets.service
                sleep 20
                for u in file-share-filebrowser file-share-samba file-share-syncthing beets; do
                  n=$(systemctl --user show -p NRestarts --value "$u.service"); a=$(systemctl --user is-active "$u.service" || true); echo "$u after a restart with a root-owned file in the share: $a, restarts $n"
                  [ "$a" = active ] && [ "$n" = 0 ] || { journalctl --user -u "$u.service" --no-pager | tail -20; exit 1; }
                done
                # no unit walked the share: the import keeps its own label
                l=$(stat -c %C "$S/import/root.flac"); echo "root.flac after the restarts: $l"; case "$l" in *user_tmp_t*) ;; *) echo "a unit relabelled the share"; exit 1;; esac
                # what :z does to the same tree on this VM, recorded, not gated: on the CI VM it left the
                # root-owned file alone (rc 0, label kept); ServiceBay'"'"'s box crashed on it (#1731, #1923)
                rc=0; podman run --rm -v "$S:/m:z" mirror.gcr.io/library/busybox:stable true 2>/tmp/relabel.txt || rc=$?
                echo "observation, :z on the share -> rc $rc, music $(stat -c %C "$S"), root.flac $(stat -c %C "$S/import/root.flac") $(tail -1 /tmp/relabel.txt)"
                # #252: auth.<domain> from a rootless container (pasta, as every Laib unit without Network=host),
                # mapped as the templates map it: to the host gateway, alone and in a pod; the LAN IP for the record
                hc() { podman run --rm "$@" -v "$root:/ca.crt:ro,z" "${{ env.HOOKS }}" curl -s -m 10 -o /dev/null -w "%{http_code}" --cacert /ca.crt https://auth.vm.test/api/health || true; }
                podman --version
                echo "auth.vm.test at the LAN IP, from a container: HTTP $(hc --add-host auth.vm.test:10.0.2.15)"
                code=$(hc --add-host auth.vm.test:host-gateway); echo "auth.vm.test at host-gateway, from a container: HTTP $code"
                [ "$code" = 200 ] || { echo "a container cannot reach Authelia at host-gateway (#252)"; exit 1; }
                podman pod create --name p252 --add-host auth.vm.test:host-gateway >/dev/null
                code=$(hc --pod p252); podman pod rm -f p252 >/dev/null; echo "auth.vm.test at host-gateway, from a pod: HTTP $code"
                [ "$code" = 200 ] || { echo "a pod cannot reach Authelia at host-gateway (#252)"; exit 1; }
                $L diag || true'
      - name: auth — "Passwort vergessen" reaches a mail server, its password a podman secret (#359)
        if: matrix.part == 'logins'
        run: |
          SSH="ssh -q -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i key -p 2222 core@127.0.0.1"
          $SSH bash -s <<'EOS'
          set -euo pipefail
          export LAIB_HOME=/mnt/data/laib LAIB_ACTOR=human:core
          lw() { local i rc; for i in $(seq 1 60); do rc=0; /var/opt/laib/laib "$@" || rc=$?; [ "$rc" = 4 ] || return "$rc"; echo "laib $1: the lock is busy (the converge timer, #211), trying again" >&2; sleep 3; done; return 4; }
          S=/mnt/data/laib/state; V=$S/services/auth/values.yml; D=/mnt/data/stacks/auth
          setv() { sed -i "s|^$1:.*|$1: $2|" "$V"; grep -q "^$1: $2\$" "$V"; }
          commit() { git -C "$S" -c user.name=core -c user.email=core@vm.test commit -qam "$1"; }
          root=/mnt/data/stacks/caddy/data/caddy/pki/authorities/local/root.crt; none=$(mktemp -d)
          # a fresh box without a mail server: the file notifier, and diag and status say so
          grep -q '^SMTP_HOST: ""' "$V" || { echo "values.yml has no empty SMTP_HOST"; cat "$V"; exit 1; }
          grep -q "filesystem:" "$D/authelia-config/configuration.yml"
          lw diag auth | tee /tmp/diag-auth.txt || true
          grep -qE "^gelb +status +auth +Passwort-Mails gehen nicht" /tmp/diag-auth.txt || { echo "diag does not say that resets cannot be mailed"; exit 1; }
          grep -q "Passwort-Mails gehen nicht" <<<"$(lw status)" || { echo "laib status does not say it"; lw status; exit 1; }
          # the sink: mailpit on the box's host network; pods reach it at host.containers.internal
          podman run -d -q --name mailpit --network host docker.io/axllent/mailpit:v1.31.6 >/dev/null
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:8025/api/v1/messages && break; sleep 2; done
          # 1. a login, as a Gmail account has one: the password goes in as a podman secret, never into a file or argv
          PW="vm-smtp-pw-359 'x\""
          printf '%s\n' "$PW" | lw secret set AUTHELIA_SMTP_PASSWORD
          setv SMTP_HOST host.containers.internal; setv SMTP_PORT '"1025"'; setv SMTP_USER box@vm.test; setv SMTP_FROM "'Die Box <box@vm.test>'"
          commit "vm: auth mails with a login (#359)"
          lw apply auth | tee /tmp/apply-auth.txt
          grep -q "notifier: smtp via host.containers.internal" /tmp/apply-auth.txt || { echo "pre-start did not render the smtp notifier"; exit 1; }
          [ "$(podman secret inspect --showsecret --format "{{.SecretData}}" laib.auth.auth-authelia.X_LAIB_SMTP_PASSWORD)" = "$PW" ] || { echo "the podman secret is not the password"; exit 1; }
          pid=$(podman inspect --format "{{.State.Pid}}" systemd-auth-authelia)  # the image has no printenv: read its environment from the host
          grep -qxF "X_LAIB_SMTP_PASSWORD=$PW" <<<"$(tr "\\0" "\\n" < /proc/$pid/environ)" || { echo "Authelia does not get the password"; exit 1; }
          if grep -qF -- "vm-smtp-pw-359" <<<"$(podman inspect systemd-auth-authelia --format "{{.Config.CreateCommand}}"; cat "$D/authelia-config/configuration.yml" /tmp/apply-auth.txt)"; then echo "the SMTP password is on argv, in configuration.yml or in the apply's output"; exit 1; fi
          code=$(curl -s --cacert "$root" --capath "$none" --resolve auth.vm.test:443:127.0.0.1 -o /dev/null -w "%{http_code}" https://auth.vm.test/api/health || true)
          [ "$code" = 200 ] || { echo "Authelia is not healthy with the smtp notifier: $code"; podman logs --tail 30 systemd-auth-authelia; exit 1; }
          echo "Authelia runs with the smtp notifier; the password reached it as a podman secret only"
          # 2. the sink takes no login over plain SMTP (nor would Authelia send one): a relay without TLS and login
          setv SMTP_SECURITY none; setv SMTP_USER '""'
          commit "vm: auth mails through the sink (#359)"
          lw apply auth >/dev/null
          grep -q "Passwort-Mails über host.containers.internal" <<<"$(lw status)" || { echo "laib status does not name the mail server"; lw status; exit 1; }
          rm -f "$D/authelia-data/notification.txt"
          code=$(curl -s --cacert "$root" --capath "$none" --resolve auth.vm.test:443:127.0.0.1 -o /tmp/reset.json -w "%{http_code}" \
                   -H "Content-Type: application/json" -d '{"username":"core"}' https://auth.vm.test/api/reset-password/identity/start || true)
          echo "Passwort vergessen for core -> HTTP $code $(cat /tmp/reset.json)"; [ "$code" = 200 ]
          id=""; for i in $(seq 1 30); do
            id=$(curl -fsS "http://127.0.0.1:8025/api/v1/search?query=to:core@vm.test" | grep -o '"ID":"[^"]*"' | sed -n '1s/"ID":"\(.*\)"/\1/p' || true)
            [ -n "$id" ] && break; sleep 2; done
          [ -n "$id" ] || { echo "no reset mail reached the sink"; podman logs --tail 40 systemd-auth-authelia; exit 1; }
          curl -fsS "http://127.0.0.1:8025/api/v1/message/$id" > /tmp/mail.json
          grep -q 'https://auth.vm.test/reset-password/step2?token=' /tmp/mail.json || { echo "the mail holds no reset link"; head -c 2000 /tmp/mail.json; exit 1; }
          grep -q '"Address":"box@vm.test"' <<<"$(grep -o '"From":{[^}]*}' /tmp/mail.json)" || { echo "the mail is not from SMTP_FROM"; grep -o '"From":{[^}]*}' /tmp/mail.json; exit 1; }
          test ! -e "$D/authelia-data/notification.txt" || { echo "the reset still went into the file"; exit 1; }
          echo "the reset mail for core reached the sink, from box@vm.test, with its link"
          EOS
      - name: invite a person — LLDAP without a password, the link by mail or back, a first password, a login (#360)
        if: matrix.part == 'logins'
        run: |
          SSH="ssh -q -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i key -p 2222 core@127.0.0.1"
          $SSH bash -s <<'EOS'
          set -euo pipefail
          export LAIB_HOME=/mnt/data/laib LAIB_ACTOR=human:core
          lw() { local i rc; for i in $(seq 1 60); do rc=0; /var/opt/laib/laib "$@" || rc=$?; [ "$rc" = 4 ] || return "$rc"; echo "laib $1: the lock is busy (the converge timer, #211), trying again" >&2; sleep 3; done; return 4; }
          root=/mnt/data/stacks/caddy/data/caddy/pki/authorities/local/root.crt; none=$(mktemp -d)
          au() { local p=$1; shift; curl -s --cacert "$root" --capath "$none" --resolve auth.vm.test:443:127.0.0.1 -b /tmp/jar -c /tmp/jar -H "Content-Type: application/json" -o /tmp/au.json -w "%{http_code}" "$@" "https://auth.vm.test$p" || true; }
          # the link to a first password, as the person follows it: the token, a password, then a login
          first_password() {   # <user> <token> <password>
            rm -f /tmp/jar
            [ "$(au /api/reset-password/identity/finish -d "{\"token\":\"$2\"}")" = 200 ] || { echo "$1: Authelia does not take the link: $(cat /tmp/au.json)"; exit 1; }
            [ "$(au /api/reset-password -d "{\"password\":\"$3\"}")" = 200 ] || { echo "$1: the password was not set: $(cat /tmp/au.json)"; exit 1; }
            rm -f /tmp/jar
            [ "$(au /api/firstfactor -d "{\"username\":\"$1\",\"password\":\"$3\",\"keepMeLoggedIn\":false}")" = 200 ] || { echo "$1 cannot log in with the first password: $(cat /tmp/au.json)"; exit 1; }
            echo "$1 set a first password through the link and logged in"
          }
          # 1. with the mail server (#359's sink): the link is mailed, German, with the way to Haus
          lw person invite lena --first Lena --last Muster --email lena@vm.test --json | tee /tmp/inv.json
          grep -q '"mailed": true' /tmp/inv.json && ! grep -q '"link"' /tmp/inv.json || { echo "the invite was not mailed"; exit 1; }
          grep -q '"user": "lena"' <<<"$(lw person pending --json)" || { echo "lena is not pending"; exit 1; }
          lw person invite lena --first Lena --last Muster --email lena@vm.test > /tmp/again.txt 2>&1 && { echo "a second invite was not refused"; exit 1; }
          grep -q "gibt es schon" /tmp/again.txt || { cat /tmp/again.txt; exit 1; }
          id=""; for i in $(seq 1 30); do
            id=$(curl -fsS "http://127.0.0.1:8025/api/v1/search?query=to:lena@vm.test" | grep -o '"ID":"[^"]*"' | sed -n '1s/"ID":"\(.*\)"/\1/p' || true)
            [ -n "$id" ] && break; sleep 2; done
          [ -n "$id" ] || { echo "no invitation reached the sink"; podman logs --tail 40 systemd-auth-authelia; exit 1; }
          curl -fsS "http://127.0.0.1:8025/api/v1/message/$id" > /tmp/mail.json
          for w in "Hallo Lena Muster" "Los geht es hier: https://laib.vm.test/" "24 Stunden"; do grep -qF "$w" /tmp/mail.json || { echo "the mail does not say: $w"; head -c 3000 /tmp/mail.json; exit 1; }; done
          tok=$(grep -o 'step2?token=[A-Za-z0-9._-]*' /tmp/mail.json | sed -n '1s/.*token=//p')
          [ -n "$tok" ] || { echo "no link in the mail"; exit 1; }
          first_password lena "$tok" 'Lena-Passwort-360!'
          if grep -q '"user": "lena"' <<<"$(lw person pending --json)"; then echo "lena is still pending after her first password"; exit 1; fi
          # 2. without a mail server: the link comes back, to be passed on
          S=/mnt/data/laib/state; sed -i 's|^SMTP_HOST:.*|SMTP_HOST: ""|' "$S/services/auth/values.yml"
          git -C "$S" -c user.name=core -c user.email=core@vm.test commit -qam "vm: auth without a mail server (#360)"
          lw apply auth >/dev/null
          lw person invite max --first Max --last Muster --email max@vm.test --json | tee /tmp/inv.json
          grep -q '"mailed": false' /tmp/inv.json || { echo "an invite without SMTP says it was mailed"; exit 1; }
          link=$(grep -o '"link": "[^"]*"' /tmp/inv.json | sed 's/"link": "\(.*\)"/\1/')
          case "$link" in https://auth.vm.test/reset-password/step2?token=*) ;; *) echo "no link back: $link"; exit 1;; esac
          grep -q '"expires": "20' /tmp/inv.json || { echo "no expiry"; exit 1; }
          first_password max "${link#*token=}" 'Max-Passwort-360!'
          # #369: max's session survives a restart of the auth pod (Authelia's sessions in the pod's Valkey, on disk)
          files() { curl -s --cacert "$root" --capath "$none" --resolve files.vm.test:443:127.0.0.1 -b /tmp/jar -o /dev/null -w "%{http_code}" https://files.vm.test/ || true; }
          [ "$(files)" = 200 ] || { echo "max's session does not open files.vm.test: $(files)"; exit 1; }
          systemctl --user restart auth-pod.service
          for i in $(seq 1 60); do [ "$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:9091/api/health || true)" = 200 ] && break; sleep 2; done
          code=$(files); echo "files.vm.test with max's session after a restart of the auth pod -> HTTP $code"
          [ "$code" = 200 ] || { echo "the restart logged max out (#369)"; podman logs --tail 20 systemd-auth-authelia; exit 1; }
          grep -q "person" <<<"$(lw journal --since 15m)" || { echo "the invites are not in the journal"; exit 1; }
          EOS
      - name: file-share — one Samba account per family member, the password through Haus's channel (#296)
        if: matrix.part == 'services'
        run: |
          SSH="ssh -q -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i key -p 2222 core@127.0.0.1"
          $SSH bash -s <<'EOS'
          set -euo pipefail
          A=/mnt/data/stacks/file-share/samba-accounts; PW='Fam1lie äö-x'
          sec() { podman secret inspect --showsecret --format "{{.SecretData}}" "$1"; }
          # LLDAP as its admin, the token and the bodies in files, off argv
          printf '{"username":"admin","password":"%s"}' "$(sec laib.auth.auth-lldap.LLDAP_LDAP_USER_PASS)" > /tmp/login.json
          curl -fsS -H "Content-Type: application/json" -d @/tmp/login.json http://127.0.0.1:17170/auth/simple/login | sed 's/.*"token":"\([^"]*\)".*/Authorization: Bearer \1/' > /tmp/auth.h; rm /tmp/login.json
          gql() { printf '%s' "$1" > /tmp/q.json; curl -fsS -H @/tmp/auth.h -H "Content-Type: application/json" -d @/tmp/q.json http://127.0.0.1:17170/api/graphql; }
          fam=$(gql '{"query":"{ groups { id displayName } }"}' | grep -o '"id":[0-9]*,"displayName":"family"' | sed 's/"id":\([0-9]*\).*/\1/'); test -n "$fam"
          gql '{"query":"mutation { createUser(user:{id:\"anna\",email:\"anna@vm.test\"}){ id } }"}' >/dev/null
          gql "{\"query\":\"mutation { addUserToGroup(userId:\\\"anna\\\", groupId:$fam){ ok } }\"}" >/dev/null
          echo "LLDAP: anna in family"
          # the member list is read every five minutes; a restart reads it now
          systemctl --user restart file-share-samba-members.service
          for i in $(seq 1 30); do grep -qx anna "$A/members" 2>/dev/null && break; sleep 2; done
          grep -qx anna "$A/members" || { echo "anna is not in samba's member list"; journalctl --user -u file-share-samba-members.service --no-pager | tail -20; exit 1; }
          grep -qx file-share "$A/members" && { echo "the read-only account got a Samba account"; exit 1; }
          for i in $(seq 1 30); do grep -qx "anna 0" "$A/status" 2>/dev/null && break; sleep 2; done
          grep -qx "anna 0" "$A/status" || { echo "anna is not in the status as without a password"; cat "$A/status" || true; exit 1; }
          echo "anna is a member without a password, as the status says"
          test -p "$A/passwords" && [ "$(stat -c %a "$A/passwords")" = 600 ] || { echo "no FIFO, or not 600"; ls -la "$A"; exit 1; }
          # what Haus writes (haus#52): one line, the password base64 inside, into the FIFO
          printf 'set anna %s\n' "$(printf %s "$PW" | base64 -w0)" > "$A/passwords"
          for i in $(seq 1 15); do grep -q "^anna [1-9]" "$A/status" && break; sleep 1; done
          grep -q "^anna [1-9]" "$A/status" || { echo "anna's password was not set"; journalctl --user -u file-share-samba.service --no-pager | tail -20; exit 1; }
          if grep -qF -- "$PW" <<<"$(journalctl --user -u file-share-samba.service --no-pager)"; then echo "the password is in the log"; exit 1; fi
          # smbclient from the samba image, the credentials in a file (-A), as anna
          smb() { printf 'username=%s\npassword=%s\n' "$1" "$2" > /tmp/smb.cred; rc=0; podman run --rm --network host --security-opt label=disable -v /tmp/smb.cred:/cred:ro -v /etc/hostname:/hn:ro --entrypoint smbclient docker.io/servercontainers/samba:latest //127.0.0.1/data -A /cred -c "$3" >/tmp/smb.out 2>&1 || rc=$?; rm -f /tmp/smb.cred; return $rc; }
          smb anna "$PW" "put /hn anna.txt" || { echo "anna cannot log in with the password from Haus's channel"; cat /tmp/smb.out; exit 1; }
          f=/mnt/data/stacks/file-share/data/anna.txt; test -f "$f"; [ "$(stat -c %U "$f")" = core ] || { echo "anna's file is not core's: $(stat -c %U "$f")"; exit 1; }
          echo "anna logged in with the password set through Haus's channel and wrote anna.txt, owned by core"
          smb anna wrong "ls" && { echo "a wrong password logs in"; exit 1; }
          # a restart: the passdb stays, the POSIX side is made again
          systemctl --user restart file-share-samba.service; sleep 15
          smb anna "$PW" "ls anna.txt" || { echo "anna cannot log in after a samba restart"; cat /tmp/smb.out; exit 1; }
          echo "anna logs in after a restart of samba"
          # the shared account stays
          smb samba "$(sec laib.file-share.file-share-samba.ACCOUNT_samba)" "ls" || { echo "the shared account no longer logs in"; cat /tmp/smb.out; exit 1; }
          echo "the shared account still logs in"
          # anna leaves LLDAP: her account goes
          gql '{"query":"mutation { deleteUser(userId:\"anna\"){ ok } }"}' >/dev/null; rm /tmp/auth.h
          systemctl --user restart file-share-samba-members.service
          for i in $(seq 1 45); do grep -q "^anna " "$A/status" || break; sleep 2; done
          smb anna "$PW" "ls" && { echo "anna still logs in after she left LLDAP"; exit 1; }
          echo "anna, removed from LLDAP, cannot log in any more"
          journalctl --user -u file-share-samba.service --no-pager | grep "samba: " | tail -10
          EOS
      - name: immich — a family member's OIDC login end to end against the real Authelia (#254, #251, #252)
        if: matrix.part == 'logins'
        run: |
          SSH="ssh -q -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i key -p 2222 core@127.0.0.1"
          # the shipped immich template from a registry on the box, two things changed for the VM: no machine
          # learning (it needs the NUC's GPU) and Caddy's local CA trusted by Node (the NUC has a public cert).
          # Its post-deploy and its units are otherwise the built-in's.
          $SSH 'rm -rf /tmp/immich && mkdir -p /tmp/immich'
          tar -C templates/immich -cf - --exclude tests . | $SSH 'tar -C /tmp/immich -xf -'
          $SSH 'cat > /tmp/oidc-login.py' < scripts/oidc-login.py
          $SSH 'set -euo pipefail; export LAIB_HOME=/mnt/data/laib LAIB_ACTOR=human:core; L=lw; lw() { local i rc; for i in $(seq 1 60); do rc=0; /var/opt/laib/laib "$@" || rc=$?; [ "$rc" = 4 ] || return "$rc"; echo "laib $1: the lock is busy (the converge timer, #211), trying again" >&2; sleep 3; done; return 4; }
                root=/mnt/data/stacks/caddy/data/caddy/pki/authorities/local/root.crt
                R=/mnt/data/laib/registries/vm/templates/immich; mkdir -p "$(dirname "$R")"; rm -rf "$R"; mv /tmp/immich "$R"
                rm "$R/immich-ml.container"
                sed -i -e "/^gpu: true/d" -e "s/^after: .*/after: [auth]/" "$R/laib.yml"
                sed -i "s|^Pod=immich.pod|Pod=immich.pod\nEnvironment=NODE_EXTRA_CA_CERTS=/laib-ca.crt\nVolume=$root:/laib-ca.crt:ro,z|" "$R/immich.container"
                grep -q "^AddHost=auth.\${DOMAIN}:host-gateway" "$R/immich.pod" || { echo "the pod does not map auth to the host gateway"; exit 1; }
                for img in ghcr.io/immich-app/immich-server:release ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0 docker.io/library/redis:6.2-alpine; do podman pull -q "$img" >/dev/null; done; echo "immich images pre-pulled"
                mkdir -p /mnt/data/stacks/immich-photos
                $L add immich PHOTOS_RO=/mnt/data/stacks/immich-photos ADMIN_EMAIL=admin@vm.test | tee /tmp/add-immich.txt
                grep -q "^ok  immich post-deploy" /tmp/add-immich.txt || { echo "immich post-deploy is not green"; exit 1; }
                grep -q "family login (OIDC via Authelia) set from Laib" /tmp/add-immich.txt || { echo "post-deploy did not set the family login"; exit 1; }
                grep -q "client_id: immich" /mnt/data/laib/render/authelia/laib-clients.yml || { echo "Authelia has no immich client"; exit 1; }
                for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:9091/api/health && break; sleep 2; done
                # the login, as a browser: Immich → Authelia (password, consent) → Immich exchanges the code
                export OIDC_USER=core OIDC_PASSWORD=vm-operator-pw-254 OIDC_EMAIL=core@vm.test
                podman run --rm --network host --add-host auth.vm.test:127.0.0.1 --add-host photos.vm.test:127.0.0.1 \
                  -e OIDC_USER -e OIDC_PASSWORD -e OIDC_EMAIL -e OIDC_CA=/ca.crt -v "$root:/ca.crt:ro,z" -v /tmp/oidc-login.py:/oidc-login.py:ro,z \
                  "${{ env.HOOKS }}" python3 /oidc-login.py immich https://photos.vm.test
                grep -qx IMMICH_API_KEY <<<"$($L secret list)" || { echo "the API key was not handed back into secrets.age"; $L secret list | tr "\n" " "; echo
                  git -C /mnt/data/laib/state log --oneline -6; git -C /mnt/data/laib/state status --short; git -C /mnt/data/laib/state log --oneline -3 -- secrets.age; $L journal --since 15m | tail -15; exit 1; }   # #307
                # the drift ServiceBay repaired in the database (#1556 there) cannot stay: a new client secret reaches
                # Authelia and Immich in one apply, Immich through its post-deploy with the minted key
                $L secret rotate OIDC_IMMICH_SECRET | tee /tmp/rotate-immich.txt
                grep -q "family login (OIDC via Authelia) set from Laib" /tmp/rotate-immich.txt || { echo "the rotation did not reach Immich"; exit 1; }
                for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:9091/api/health && break; sleep 2; done
                podman run --rm --network host --add-host auth.vm.test:127.0.0.1 --add-host photos.vm.test:127.0.0.1 \
                  -e OIDC_USER -e OIDC_PASSWORD -e OIDC_EMAIL -e OIDC_CA=/ca.crt -v "$root:/ca.crt:ro,z" -v /tmp/oidc-login.py:/oidc-login.py:ro,z \
                  "${{ env.HOOKS }}" python3 /oidc-login.py immich https://photos.vm.test
                $L remove immich >/dev/null
                rm -rf "$R"; podman unshare rm -rf /mnt/data/stacks/immich /mnt/data/stacks/immich-photos   # Postgres owns pgdata inside the user namespace
                podman image rm -f ghcr.io/immich-app/immich-server:release ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0 >/dev/null || true
                echo "immich: a family member logged in through Authelia"'
      - name: home-assistant — the family login (auth_oidc) loads on a real Home Assistant, added to the admin's configuration.yaml (#253); Laib mints its tokens (#349)
        if: matrix.part == 'logins'
        run: |
          SSH="ssh -q -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i key -p 2222 core@127.0.0.1"
          # the shipped template from a registry on the box, without Z-Wave JS and Matter (the NUC's stick and fabric);
          # Home Assistant's unit and pre-start are the built-in's
          $SSH 'rm -rf /tmp/ha && mkdir -p /tmp/ha'
          tar -C templates/home-assistant -cf - --exclude tests . | $SSH 'tar -C /tmp/ha -xf -'
          $SSH 'set -euo pipefail; export LAIB_HOME=/mnt/data/laib LAIB_ACTOR=human:core; L=lw; lw() { local i rc; for i in $(seq 1 60); do rc=0; /var/opt/laib/laib "$@" || rc=$?; [ "$rc" = 4 ] || return "$rc"; echo "laib $1: the lock is busy (the converge timer, #211), trying again" >&2; sleep 3; done; return 4; }
                R=/mnt/data/laib/registries/vm/templates/home-assistant; mkdir -p "$(dirname "$R")"; rm -rf "$R"; mv /tmp/ha "$R"
                rm "$R/home-assistant-zwave.container" "$R/home-assistant-matter.container"
                sed -i "s/^after: .*/after: [auth]/" "$R/laib.yml"
                # a configuration.yaml the admin wrote: pre-start only adds the packages include to it
                C=/mnt/data/stacks/home-assistant/homeassistant; mkdir -p "$C"
                printf "default_config:\n\nlogger:\n  default: warning\n" > "$C/configuration.yaml"
                touch "$C/automations.yaml" "$C/scripts.yaml" "$C/scenes.yaml"
                podman pull -q ghcr.io/home-assistant/home-assistant:stable >/dev/null; echo "home assistant image pre-pulled"
                # #349: a stand-in for Haus and the Bote, there before Home Assistant: it declares their tokens as they
                # do, so the apply that mints them must hand them to it (as podman secrets the probe can read)
                T=/mnt/data/laib/registries/vm/templates/tokens; mkdir -p "$T"
                printf "name: tokens\ntemplate: {registry: vm, name: tokens, version: 1}\nroutes: []\nsecrets:\n  - {name: HAUS_HA_TOKEN, external: true, optional: true}\n  - {name: BOTE_HA_TOKEN, external: true, optional: true}\ndata: []\n" > "$T/laib.yml"
                printf "IMAGE: mirror.gcr.io/library/busybox:stable\nHAUS: !secret HAUS_HA_TOKEN\nBOTE: !secret BOTE_HA_TOKEN\n" > "$T/values.example.yml"
                printf "[Container]\nImage=\${IMAGE}\nExec=sleep infinity\nEnvironment=HAUS=\${HAUS}\nEnvironment=BOTE=\${BOTE}\n\n[Install]\nWantedBy=default.target\n" > "$T/tokens.container"
                $L add tokens >/dev/null
                $L add home-assistant | tee /tmp/add-ha.txt
                grep -q "^ok  home-assistant pre-start" /tmp/add-ha.txt || { echo "home-assistant pre-start is not green"; exit 1; }
                grep -q "auth_oidc installed" /tmp/add-ha.txt || { echo "the pinned component was not installed"; exit 1; }
                grep -q "packages: !include_dir_named packages" "$C/configuration.yaml" || { echo "pre-start did not include the packages of laib in configuration.yaml"; exit 1; }
                grep -q "AUTH_OIDC_SECRET" "$C/packages/laib_auth_oidc.yaml"
                if grep -rqF "$(podman secret inspect --showsecret --format "{{.SecretData}}" laib.home-assistant.home-assistant.AUTH_OIDC_SECRET)" "$C"; then echo "the OIDC secret is in a file under the config"; exit 1; fi
                A=/mnt/data/laib/render/authelia/laib-clients.yml
                grep -q "token_endpoint_auth_method: client_secret_post" <<<"$(grep -A6 "client_id: homeassistant" "$A")" || { echo "Authelia has no homeassistant client for client_secret_post"; cat "$A"; exit 1; }
                # the component runs with the package: its welcome page answers and names the family account
                code=000; for i in $(seq 1 90); do code=$(curl -s -o /tmp/welcome.html -w "%{http_code}" http://127.0.0.1:8123/auth/oidc/welcome || true); [ "$code" = 200 ] && break; sleep 5; done
                echo "home assistant /auth/oidc/welcome -> HTTP $code"
                [ "$code" = 200 ] && grep -q "Familienkonto" /tmp/welcome.html || { echo "auth_oidc is not set up from the package"; podman logs --tail 80 systemd-home-assistant 2>&1 | grep -i -B2 -A8 "auth_oidc\|error" | tail -60; exit 1; }
                if grep -qi "duplicate\|invalid config" <<<"$(grep -i "auth_oidc" <<<"$(podman logs systemd-home-assistant 2>&1)")"; then echo "Home Assistant complains about auth_oidc"; exit 1; fi
                # the template owns the integrations checklist (#309): its check runs inside Home Assistant,
                # writes the status file, and laib diag shows it with its age; a wrong token is a finding, never a failed unit
                systemctl --user is-enabled home-assistant-check.timer >/dev/null || { echo "the hourly check timer is not enabled"; exit 1; }
                # #349: the tokens, minted by post-deploy against this real Home Assistant: onboarded as laib, one token
                # per consumer, the Bote a user of its own; none of it typed, none of it in the output of the apply
                grep -q "onboarded, administrator laib" /tmp/add-ha.txt || { echo "post-deploy did not onboard Home Assistant"; exit 1; }
                for n in HA_TOKEN HAUS_HA_TOKEN BOTE_AUTOMAT_HA_TOKEN BOTE_HA_TOKEN; do grep -q "$n minted" /tmp/add-ha.txt || { echo "$n was not minted"; exit 1; }; done
                tok() { podman secret inspect --showsecret --format "{{.SecretData}}" "laib.tokens.tokens.$1"; }
                [ -n "$(tok HAUS)" ] && [ -n "$(tok BOTE)" ] || { echo "the stand-in did not get the tokens in the apply that minted them"; exit 1; }
                if grep -qFf <(printf "%s\n" "$(tok HAUS)" "$(tok BOTE)") /tmp/add-ha.txt || grep -q "laib-secret" /tmp/add-ha.txt; then echo "a token is in the apply output"; exit 1; fi
                # the token rides in a header file (curl -H @), never on argv
                ha() { curl -s -o /tmp/ha-body.json -w "%{http_code}" -H @<(printf "Authorization: Bearer %s" "$(tok "$1")") "http://127.0.0.1:8123$2"; }
                for i in $(seq 1 45); do code=$(ha HAUS /api/states/sun.sun); [ "$code" = 200 ] && break; sleep 2; done   # a restarted HA sets sun up shortly after it answers
                echo "Haus reads sun.sun -> HTTP $code"; [ "$code" = 200 ] || { cat /tmp/ha-body.json; exit 1; }
                code=$(ha BOTE /api/states/sun.sun); echo "the Bote reads sun.sun -> HTTP $code"; [ "$code" = 200 ]
                # an admin-only call (the automation config API of HA): Haus is let through (no such automation: 404), the Bote refused
                code=$(ha HAUS /api/config/automation/config/laib-349); echo "Haus, admin-only call -> HTTP $code"; [ "$code" = 404 ]
                code=$(ha BOTE /api/config/automation/config/laib-349); echo "the Bote, admin-only call -> HTTP $code"; [ "$code" = 401 ] || { echo "the Bote token is an administrator token"; exit 1; }
                # the check lists the integrations with the minted HA_TOKEN
                systemctl --user start home-assistant-check.service || { journalctl --user -u home-assistant-check.service --no-pager | tail -20; exit 1; }
                grep -q "\"at\"" "$C/.laib-status.json" || { echo "the check wrote no status file"; ls -la "$C"; exit 1; }
                $L diag --json home-assistant > /tmp/diag-ha.json
                grep -q "Wyoming Whisper: fehlt" /tmp/diag-ha.json && grep -q "geprüft" /tmp/diag-ha.json || { echo "diag does not show the integrations the check listed"; cat /tmp/diag-ha.json; exit 1; }
                if grep -q "antwortet nicht" /tmp/diag-ha.json; then echo "the check could not read the integrations with HA_TOKEN"; exit 1; fi
                echo "home-assistant: the minted HA_TOKEN lists the integrations; diag shows them"
                # the next apply keeps what works; a token HA refuses is replaced
                $L apply home-assistant | tee /tmp/apply-ha2.txt
                if grep -q " minted" /tmp/apply-ha2.txt; then echo "a working token was minted again"; exit 1; fi
                grep -q "tokens for the check, Haus, the Automat and the Bote work" /tmp/apply-ha2.txt
                echo vm-not-a-token-349 | $L secret set HA_TOKEN >/dev/null
                $L apply home-assistant | tee /tmp/apply-ha3.txt
                grep -q "HA_TOKEN minted (replaces one HA refuses)" /tmp/apply-ha3.txt || { echo "the refused HA_TOKEN was not replaced"; exit 1; }
                systemctl --user start home-assistant-check.service
                $L diag --json home-assistant > /tmp/diag-ha3.json
                grep -q "Wyoming Whisper: fehlt" /tmp/diag-ha3.json || { echo "the check does not read with the replaced token"; cat /tmp/diag-ha3.json; exit 1; }
                echo "home-assistant: tokens minted, kept, and a refused one replaced (#349)"
                $L remove tokens >/dev/null; rm -rf "$T"
                $L remove home-assistant >/dev/null
                rm -rf "$R"; podman unshare rm -rf /mnt/data/stacks/home-assistant
                podman image rm -f ghcr.io/home-assistant/home-assistant:stable >/dev/null || true
                echo "home-assistant: the family login loaded from Laib package"'
      - name: media — a family member logs in to Jellyfin with the LLDAP account, through a read-only bind (#256)
        if: matrix.part == 'logins'
        run: |
          SSH="ssh -q -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i key -p 2222 core@127.0.0.1"
          # the shipped template from a registry on the box, without the GPU (the NUC's); post-deploy is the built-in's
          $SSH 'rm -rf /tmp/media && mkdir -p /tmp/media'
          tar -C templates/media -cf - --exclude tests . | $SSH 'tar -C /tmp/media -xf -'
          $SSH 'set -euo pipefail; export LAIB_HOME=/mnt/data/laib LAIB_ACTOR=human:core; L=lw; lw() { local i rc; for i in $(seq 1 60); do rc=0; /var/opt/laib/laib "$@" || rc=$?; [ "$rc" = 4 ] || return "$rc"; echo "laib $1: the lock is busy (the converge timer, #211), trying again" >&2; sleep 3; done; return 4; }
                R=/mnt/data/laib/registries/vm/templates/media; mkdir -p "$(dirname "$R")"; rm -rf "$R"; mv /tmp/media "$R"
                sed -i -e "/^gpu: true/d" -e "s/^after: .*/after: [auth]/" "$R/laib.yml"
                sed -i "/^AddDevice=nvidia/d" "$R/media.container"
                mkdir -p /mnt/data/stacks/jf-media/music
                podman pull -q docker.io/jellyfin/jellyfin:latest >/dev/null; echo "jellyfin image pre-pulled"
                $L add media MEDIA_ROOT=/mnt/data/stacks/jf-media BASE_DN=dc=vm,dc=test | tee /tmp/add-media.txt
                grep -q "^ok  media post-deploy" /tmp/add-media.txt || { echo "media post-deploy is not green"; exit 1; }
                grep -q "LDAP-Authentication plugin installed" /tmp/add-media.txt || { echo "the LDAP plugin was not installed"; exit 1; }
                X=/mnt/data/stacks/media/jellyfin-config/plugins/configurations/LDAP-Auth.xml
                podman unshare grep -q "<LdapBindUser>uid=jellyfin,ou=people,dc=vm,dc=test</LdapBindUser>" "$X" || { echo "the plugin does not bind read-only"; exit 1; }
                C="MediaBrowser Client=\"vm\", Device=\"vm\", DeviceId=\"vm-256\", Version=\"1\""
                jf() { curl -s -o /tmp/jf.json -w "%{http_code}" -H "Authorization: $C" -H "Content-Type: application/json" "$@"; }
                code=$(jf -d "{\"Username\":\"core\",\"Pw\":\"vm-operator-pw-254\"}" http://127.0.0.1:8096/Users/AuthenticateByName)
                echo "jellyfin login as core (LLDAP, admins): HTTP $code"
                [ "$code" = 200 ] || { echo "a family member cannot log in with the LLDAP account"; podman logs --tail 60 systemd-media 2>&1 | grep -i ldap | tail -20; exit 1; }
                grep -q "\"IsAdministrator\":true" /tmp/jf.json || { echo "a member of admins is no Jellyfin administrator"; exit 1; }
                code=$(jf -d "{\"Username\":\"core\",\"Pw\":\"not-the-password\"}" http://127.0.0.1:8096/Users/AuthenticateByName)
                echo "jellyfin login as core with a wrong password: HTTP $code"; [ "$code" = 401 ] || exit 1
                [ "$(curl -s http://127.0.0.1:8096/QuickConnect/Enabled)" = true ] || { echo "Quick Connect is off"; exit 1; }
                echo "quick connect on"
                $L remove media >/dev/null
                rm -rf "$R"; podman unshare rm -rf /mnt/data/stacks/media /mnt/data/stacks/jf-media
                podman image rm -f docker.io/jellyfin/jellyfin:latest >/dev/null || true
                echo "media: the family logs in to Jellyfin with LLDAP"'
      - name: audiobookshelf — a family member's OIDC login end to end, and after a rotation (#255)
        if: matrix.part == 'logins'
        run: |
          SSH="ssh -q -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i key -p 2222 core@127.0.0.1"
          # the shipped template from a registry on the box, Caddy's local CA trusted by Node (the NUC has a public cert)
          $SSH 'rm -rf /tmp/abs && mkdir -p /tmp/abs'
          tar -C templates/audiobookshelf -cf - --exclude tests . | $SSH 'tar -C /tmp/abs -xf -'
          $SSH 'cat > /tmp/oidc-login.py' < scripts/oidc-login.py
          $SSH 'set -euo pipefail; export LAIB_HOME=/mnt/data/laib LAIB_ACTOR=human:core; L=lw; lw() { local i rc; for i in $(seq 1 60); do rc=0; /var/opt/laib/laib "$@" || rc=$?; [ "$rc" = 4 ] || return "$rc"; echo "laib $1: the lock is busy (the converge timer, #211), trying again" >&2; sleep 3; done; return 4; }
                root=/mnt/data/stacks/caddy/data/caddy/pki/authorities/local/root.crt
                R=/mnt/data/laib/registries/vm/templates/audiobookshelf; mkdir -p "$(dirname "$R")"; rm -rf "$R"; mv /tmp/abs "$R"
                sed -i "s/^after: .*/after: [auth]/" "$R/laib.yml"
                sed -i "s|^PublishPort=13378:80|PublishPort=13378:80\nEnvironment=NODE_EXTRA_CA_CERTS=/laib-ca.crt\nVolume=$root:/laib-ca.crt:ro,z|" "$R/audiobookshelf.container"
                grep -q "^AddHost=auth.\${DOMAIN}:host-gateway" "$R/audiobookshelf.container" || { echo "ABS does not map auth to the host gateway"; exit 1; }
                podman pull -q ghcr.io/advplyr/audiobookshelf:latest >/dev/null; echo "audiobookshelf image pre-pulled"
                mkdir -p /mnt/data/stacks/abs-media/audiobooks /mnt/data/stacks/abs-media/podcasts
                $L add audiobookshelf AUDIOBOOKS=/mnt/data/stacks/abs-media/audiobooks PODCASTS=/mnt/data/stacks/abs-media/podcasts | tee /tmp/add-abs.txt
                grep -q "^ok  audiobookshelf post-deploy" /tmp/add-abs.txt || { echo "audiobookshelf post-deploy is not green"; exit 1; }
                grep -q "family login (OIDC via Authelia) set from Laib" /tmp/add-abs.txt || { echo "post-deploy did not set the family login"; exit 1; }
                for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:9091/api/health && break; sleep 2; done
                login() { podman run --rm --network host --add-host auth.vm.test:127.0.0.1 --add-host hoerbuecher.vm.test:127.0.0.1 \
