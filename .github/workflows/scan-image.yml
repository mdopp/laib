name: scan-image
on:
  push:
    branches: [main]
    paths: ["scan/**", ".github/workflows/scan-image.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: scan/Containerfile
          push: true
          tags: ghcr.io/mdopp/laib-scan:latest,ghcr.io/mdopp/laib-scan:${{ github.sha }}
