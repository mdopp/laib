# README.md's architecture section (owner, 2026-10-27): every day
# scripts/architektur.sh regenerates it from scripts/loc.sh and templates/;
# when it changed, scripts/architektur-pr.sh opens or updates one PR from
# bot/architektur with a docs(readme) commit. Nothing is pushed to main.
name: architektur
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
permissions:
  contents: write      # push bot/architektur
  pull-requests: write # open, update or close its PR
concurrency:
  group: architektur
jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: regenerate the architecture section and open or update its PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/architektur-pr.sh
