name: boot
on:
  push:
    branches: [main]
  pull_request:
jobs:
  quadlet:
    # Real systemd --user + Podman Quadlet on the runner, no shims (#7).
    runs-on: ubuntu-24.04
    env:
      OPERATOR_IMAGE: localhost/laib-operator:boot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # the Operator's image from this commit (ADR 0027), pinned into this laib as a release pins its digest
      - run: podman build -q -t "$OPERATOR_IMAGE" -f operator/Containerfile .
      - run: CGO_ENABLED=0 go build -ldflags "-X github.com/mdopp/laib/internal/render.OperatorImage=$OPERATOR_IMAGE" -o laib ./cmd/laib && CGO_ENABLED=0 go build -o laib-operator ./operator/cmd/laib-operator
      - run: |
          podman --version
          systemctl --user status --no-pager | head -3 || true
          loginctl enable-linger "$(id -un)" || sudo loginctl enable-linger "$(id -un)" || true
      - run: scripts/boot-test.sh
        env:
          XDG_RUNTIME_DIR: /run/user/1001
