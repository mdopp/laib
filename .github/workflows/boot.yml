name: boot
on:
  push:
    branches: [main]
  pull_request:
jobs:
  quadlet:
    # Real systemd --user + Podman Quadlet on the runner, no shims (#7).
    runs-on: ubuntu-24.04
    env:
      OPERATOR_IMAGE: localhost/laib-operator:boot
      HAUSHALT_IMAGE: localhost/laib-haushalt:boot
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # the Operator's and laib-haushalt's images from this commit (ADR 0027), pinned into this laib as a release pins their digests
      - run: podman build -q -t "$OPERATOR_IMAGE" -f operator/Containerfile . && podman build -q -t "$HAUSHALT_IMAGE" -f haushalt/Containerfile .
      - run: CGO_ENABLED=0 go build -ldflags "-X github.com/mdopp/laib/internal/render.OperatorImage=$OPERATOR_IMAGE -X github.com/mdopp/laib/internal/render.HaushaltImage=$HAUSHALT_IMAGE" -o laib ./cmd/laib && CGO_ENABLED=0 go build -o laib-operator ./operator/cmd/laib-operator
      - run: |
          podman --version
          systemctl --user status --no-pager | head -3 || true
          loginctl enable-linger "$(id -un)" || sudo loginctl enable-linger "$(id -un)" || true
      - run: scripts/boot-test.sh
        env:
          XDG_RUNTIME_DIR: /run/user/1001
