name: werkstatt-image
on:
  push:
    branches: [main]
    paths: ["werkstatt/**"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  id-token: write # cosign signs keyless with this workflow's identity (ADR 0034)
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # the newest release whose assets are uploaded (#1061): on a release
      # commit the new release is "latest" before release.yml has built its
      # binary, so releases/latest/download answers 404. This build takes the
      # release before it; release.yml dispatches this workflow once the new
      # release's assets are up, and that run takes the new one.
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh api "repos/${{ github.repository }}/releases?per_page=10" -q '[.[] | select((.draft or .prerelease) | not) | select(any(.assets[]; .name == "laib-linux-amd64") and any(.assets[]; .name == "SHA256SUMS"))][0].tag_name // ""')
          [ -n "$tag" ] || { echo "no release among the last ten has laib-linux-amd64 and SHA256SUMS"; exit 1; }
          echo "the Werkstatt gets laib $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: werkstatt
          file: werkstatt/Containerfile
          build-args: LAIB_DOWNLOAD=https://github.com/${{ github.repository }}/releases/download/${{ steps.release.outputs.tag }}
          push: true
          tags: ghcr.io/mdopp/laib-werkstatt:latest,ghcr.io/mdopp/laib-werkstatt:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/mdopp/laib
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: github.event_name != 'pull_request'
      - name: sign the image; Laib proposes a digest of ours only with this signature (ADR 0034)
        if: github.event_name != 'pull_request'
        run: cosign sign --yes --new-bundle-format=false --use-signing-config=false ghcr.io/mdopp/laib-werkstatt@${{ steps.build.outputs.digest }}
