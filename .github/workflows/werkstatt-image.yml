name: werkstatt-image
on:
  push:
    branches: [main]
    paths: ["werkstatt/**"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: werkstatt
          file: werkstatt/Containerfile
          push: true
          tags: ghcr.io/mdopp/laib-werkstatt:latest,ghcr.io/mdopp/laib-werkstatt:${{ github.sha }}
