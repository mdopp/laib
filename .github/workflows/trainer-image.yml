name: trainer-image
on:
  push:
    branches: [main]
    paths: ["stimme/trainer/**", ".github/workflows/trainer-image.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the TensorFlow-GPU base is ~10 GB unpacked; the runner needs the room
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: stimme/trainer/Containerfile
          build-args: TRAINER_BUILD=${{ github.sha }}
          push: true
          tags: ghcr.io/mdopp/laib-wakeword-trainer:latest,ghcr.io/mdopp/laib-wakeword-trainer:${{ github.sha }}
