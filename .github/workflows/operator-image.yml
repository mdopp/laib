# laib-operator's image (ADR 0027) on every main push that touches it: :latest
# and :<sha>, what a build from source renders. A release builds its own
# from the release tag and pins that digest into laib (release.yml).
name: operator-image
on:
  push:
    branches: [main]
    paths: ["operator/**", "skills/**", "werkstatt/evals/incidents*.json", "go.mod", "go.sum", ".github/workflows/operator-image.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: operator/Containerfile
          push: true
          tags: ghcr.io/mdopp/laib-operator:latest,ghcr.io/mdopp/laib-operator:${{ github.sha }}
