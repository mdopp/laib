name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: CGO_ENABLED=0 go build -ldflags "-s -w -X main.Version=${GITHUB_SHA::7}" -o laib ./cmd/laib
      - run: CGO_ENABLED=0 go build -ldflags "-s -w" -o laib-operator ./cmd/laib-operator
      - run: CGO_ENABLED=0 go build -ldflags "-s -w" -o laib-lease ./cmd/laib-lease && CGO_ENABLED=0 go build -o /dev/null ./cmd/frage && CGO_ENABLED=0 go build -o /dev/null ./cmd/automat
      - run: for t in linux/amd64 darwin/arm64 windows/amd64; do CGO_ENABLED=0 GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null ./cmd/laib-stick; done
      - run: for t in templates/*/; do ./laib template lint "$t"; done
      - run: python3 -m unittest werkstatt/tests/test_autoloop.py werkstatt/tests/test_werkstatt44.py && python3 -m py_compile werkstatt/laibctl.py templates/llama/post-deploy
      - run: scripts/loc.sh
      - run: scripts/drift.sh
      - run: scripts/e2e.sh
