name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # ghcr.io/mdopp/laib-caddy for the Caddyfile check
      issues: write # the Kern-Diät issue (scripts/kern-diaet.sh, #309)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - name: authelia's own verdict on the rendered access rules (#249) and the SMTP notifier (#359)
        run: |
          # the binary from the image the auth template pins, so the rules are judged by what the box runs
          img=$(sed -n 's/^AUTHELIA_IMAGE: //p' templates/auth/values.example.yml)
          id=$(docker create "$img") && docker cp "$id:/app/authelia" "$RUNNER_TEMP/authelia" && docker rm "$id" >/dev/null
          "$RUNNER_TEMP/authelia" --version
          LAIB_AUTHELIA="$RUNNER_TEMP/authelia" go test -count=1 -run 'TestAuthelia.*OnTheRealBinary' -v ./internal/render/
      - run: CGO_ENABLED=0 go build -ldflags "-s -w -X main.Version=${GITHUB_SHA::7}" -o laib ./cmd/laib
      - run: CGO_ENABLED=0 go build -ldflags "-s -w" -o laib-operator ./operator/cmd/laib-operator
      - run: CGO_ENABLED=0 go build -ldflags "-s -w" -o laib-lease ./cmd/laib-lease && CGO_ENABLED=0 go build -o laib-disk ./disk/cmd/laib-disk && CGO_ENABLED=0 go build -o laib-notify ./notify/cmd/laib-notify && CGO_ENABLED=0 go build -o laib-haushalt ./haushalt/cmd/laib-haushalt && CGO_ENABLED=0 go build -o /dev/null ./frage/cmd/frage && CGO_ENABLED=0 go build -o /dev/null ./automat/cmd/automat && CGO_ENABLED=0 go build -o /dev/null ./cmd/relay
      - run: for t in linux/amd64 darwin/arm64 windows/amd64; do CGO_ENABLED=0 GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null ./stick/cmd/laib-stick; done
      - run: for t in templates/*/; do ./laib template lint "$t"; done
      - name: rendered files, checked by the programs that read them
        run: |
          # Caddy: the box's own image, so the DNS provider modules match; the
          # cloudflare module checks the token's shape, so the dummy has one
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          for f in testdata/golden/*/expected/caddy/Caddyfile; do
            echo "caddy validate $f"
            docker run --rm -e LAIB_DNS_TOKEN=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx -v "$PWD/$(dirname "$f"):/etc/caddy:ro" ghcr.io/mdopp/laib-caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          done
          # Quadlet: podman 5 as on Fedora CoreOS (the runner's podman 4.9 knows no Pod= key)
          for d in testdata/golden/*/expected/quadlet; do
            echo "quadlet -dryrun $d"
            docker run --rm -e QUADLET_UNIT_DIRS=/q -v "$PWD/$d:/q:ro" quay.io/podman/stable:v5 /usr/libexec/podman/quadlet -dryrun -user >/dev/null
          done
      - run: python3 -m unittest scripts/test_import_google.py scripts/test_vm_install_reuse.py scripts/test_solaris_links_off.py scripts/test_solaris_off.py scripts/test_laib_import.py scripts/test_bote_schalttest.py werkstatt/tests/test_autoloop.py werkstatt/tests/test_werkstatt44.py werkstatt/tests/test_home241.py werkstatt/tests/test_pi261.py werkstatt/tests/test_sessions383.py werkstatt/tests/test_piweb384.py werkstatt/tests/test_session380.py stimme/trainer/tests/test_trainer.py scan/tests/test_scan.py templates/*/tests/test_*.py werkstatt/tests/test_apps262.py werkstatt/tests/test_mcp392.py werkstatt/tests/test_skills394.py werkstatt/tests/test_move498.py werkstatt/tests/test_rejections544.py werkstatt/tests/test_stdin617.py templates/bote/tests/test_notify.py templates/bote/tests/test_post_deploy.py templates/auth/tests/test_post_deploy.py templates/mosquitto/tests/test_hooks.py && python3 -m py_compile werkstatt/laibctl.py templates/bote/notify.py stimme/trainer/train.py stimme/trainer/trainer.py scan/scan.py $(grep -l '^#!/usr/bin/env python3' templates/*/pre-start templates/*/post-deploy)
      - name: the Bote's plugins (usage, persona, ablage, journal) under Hermes' own loader, turn finalizer and gateway hooks (#266, #471, #521, #586, #587, #591)
        run: |
          # the image the template pins: a hook Hermes renames shows up here, not as counts that stop or screens that vanish
          d=$(mktemp -d)
          # something that answers on PAPERLESS_URL, so post-deploy turns laib-ablage on (#521)
          python3 -m http.server 18731 --bind 127.0.0.1 >/dev/null 2>&1 & fake=$!
          sleep 1
          LAIB_DATA_DIR=$d LAIB_RENDER_DIR=$d/none SIGNAL_ACCOUNT=+490 MODEL_URL=http://127.0.0.1:1/v1 MODEL_NAME=m THINKING_MODEL=t \
            PAPERLESS_URL=http://127.0.0.1:18731 LAIB_SECRET_BOTE_LAIB_TOKEN=x LAIB_SECRET_USAGE_METRICS_TOKEN=proof LAIB_SECRET_BOTE_HA_TOKEN=x templates/bote/post-deploy
          kill $fake
          grep -q 'enabled: \[laib-persona, laib-journal, laib-nutzung, laib-ablage\]' $d/bote/hermes/config.yaml
          docker run --rm --user "$(id -u)" --entrypoint python -e HOME=/tmp -e HERMES_HOME=/data/bote/hermes -e USAGE_METRICS_TOKEN=proof \
            -v "$d:/data" -v "$PWD/templates/bote/tests:/t:ro" "$(sed -n 's/^HERMES_IMAGE: *//p' templates/bote/values.example.yml)" /t/hermes_plugin_proof.py /opt/hermes
      - run: scripts/loc.sh
      - name: the Kern-Diät issue at 95 % of the kernel's cap (#309)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/kern-diaet.sh
      - run: scripts/drift.sh
      - run: scripts/workflow-syntax.sh
      - run: scripts/e2e.sh
