name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build -ldflags "-s -w -X main.Version=${GITHUB_SHA::7}" -o laib ./cmd/laib
      - run: CGO_ENABLED=0 go build -ldflags "-s -w" -o laib-operator ./cmd/laib-operator
      - run: CGO_ENABLED=0 go build -ldflags "-s -w" -o laib-lease ./cmd/laib-lease && CGO_ENABLED=0 go build -o /dev/null ./cmd/frage && CGO_ENABLED=0 go build -o /dev/null ./cmd/automat && CGO_ENABLED=0 go build -o /dev/null ./cmd/relay
      - run: for t in linux/amd64 darwin/arm64 windows/amd64; do CGO_ENABLED=0 GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null ./cmd/laib-stick; done
      - run: for t in templates/*/; do ./laib template lint "$t"; done
      - name: rendered files, checked by the programs that read them
        run: |
          # Caddy: the box's own image, so the DNS provider modules match; the
          # cloudflare module checks the token's shape, so the dummy has one
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          for f in testdata/golden/*/expected/caddy/Caddyfile; do
            echo "caddy validate $f"
            docker run --rm -e LAIB_DNS_TOKEN=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx -v "$PWD/$(dirname "$f"):/etc/caddy:ro" ghcr.io/mdopp/laib-caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          done
          # Quadlet: podman 5 as on Fedora CoreOS (the runner's podman 4.9 knows no Pod= key)
          for d in testdata/golden/*/expected/quadlet; do
            echo "quadlet -dryrun $d"
            docker run --rm -e QUADLET_UNIT_DIRS=/q -v "$PWD/$d:/q:ro" quay.io/podman/stable:v5 /usr/libexec/podman/quadlet -dryrun -user >/dev/null
          done
      - run: python3 -m unittest scripts/test_migrate_servicebay.py scripts/test_carry_servicebay_secrets.py werkstatt/tests/test_autoloop.py werkstatt/tests/test_werkstatt44.py stimme/trainer/tests/test_trainer.py templates/bote/tests/test_notify.py templates/bote/tests/test_post_deploy.py templates/auth/tests/test_post_deploy.py templates/mosquitto/tests/test_hooks.py && python3 -m py_compile werkstatt/laibctl.py templates/bote/notify.py stimme/trainer/train.py stimme/trainer/trainer.py $(grep -l '^#!/usr/bin/env python3' templates/*/pre-start templates/*/post-deploy)
      - run: scripts/loc.sh
      - run: scripts/drift.sh
      - run: scripts/workflow-syntax.sh
      - run: scripts/e2e.sh
