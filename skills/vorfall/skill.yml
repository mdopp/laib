# The incident session (ADR 0023 §6): what a red event did before skills.
# restart is granted only while the ops ceiling is apply (ADR 0023 §4).
# #792, #839: an incident a look opened gets its first aid from the script
# (run.py) before the model: the last log line, the restart diag offers,
# diag again, one note; nothing red any more ends it without a model.
# #978: a look's red in a planned stop's window never opens one (diag holds
# it, laib planned's code); for a red the kernel posted, the model asks
# planned for the windows and for what the service depends on.
description: Wenn etwas rot wird — nachsehen, Ursache finden, rückgängig machbar reparieren oder eskalieren.
trigger: {event: red}
tools: [diag, logs, inspect, restart, propose, repair, wahl, escalate, note]   # repair and wahl only propose: their prompt names them for every model (#858)
more: [look, read, journal, plan, apply, planned]   # a capable model also looks inside the container, at the journal and the plan (#286)
run: run.py
modell: frei     # the agentic loop with the granted tools: the model diagnoses and chooses
output: note
prompt: |
  Schau dir den Dienst an (diag, logs, inspect), finde die Ursache, korrigiere wenn es rückgängig geht (restart, propose), sonst escalate. Zum Schluss note. Endet die Sitzung rot, eskaliert laib selbst.
  Was laib diag als Reparatur anbietet und du nicht selbst darfst, schlägst du vor: repair mit probe und service; es läuft erst, wenn ein Mensch freigibt.
  Sind mehrere Dienste rot, such die eine Ursache: diag für die ganze Box, dann die Dienste, von denen die anderen abhängen (planned nennt sie unter depends, dazu die Anmeldung, der Proxy, die Datenbank). Repariere die Ursache, nicht jede Folge einzeln, und schreib eine Notiz mit der Ursache.
  Fällt das Rot in einen geplanten Halt (planned: now, oder ein Fenster in windows), wartet es auf dessen Ende: kein Neustart, eine Notiz.
  Hast du zwei oder mehr Wege, die sich ausschließen (etwa die Sicherung zurückspielen oder nach vorne reparieren), lege EINE Karte mit wahl an statt mehrerer Vorschläge, in dieser Form: problem (was los ist und was jetzt läuft), ursache (oder leer, wenn du sie nicht gemessen hast), wege (je „Name|was daraus folgt|Nummer des Vorschlags“, vorher mit repair oder propose angelegt), empfehlung (ein Weg und warum). „nachdenken“ (gründlicher nachsehen) und „ticket“ (als Box-Aufgabe weitergeben) sind gewöhnliche Wege; „ablehnen“ bietest du nie als Weg an. Schreib für die Familie: einfache Sätze, keine Befehle, keine Nummern außer den Vorschlägen.
  Beginnt der Anlass mit „wahl: nachdenken“, hat der Besitzer eine Karte zurückgegeben: sieh gründlicher nach, du hast mehr Schritte, und lege eine neue Karte an.
