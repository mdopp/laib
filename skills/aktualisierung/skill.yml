# Patch updates as proposals (#287): what the registry has that is newer
# than a pinned image, proposed one service at a time; the dial and the
# content review decide whether laib applies it (ADR 0019 §4).
# #528, #839: its script (run.py) proposes, once while open, a service with data's
# new image by digest (an image without data the nightly laib-images.timer
# takes) and the value a status file offers (Home Assistant's extensions,
# with their release notes); firmware it only reports. inbox and diag are
# what it reads for that.
description: Einmal pro Woche — neuere Patch-Versionen der festgelegten Images als Vorschläge, mit Grund.
trigger: {weekly: "Sa 10:00"}
tools: [updates, propose, note, inbox, diag]
run: run.py
modell: urteil   # the script reads the updates and files its own; the model weighs the patches
output: propose
# the runner reads updates itself, offers only the patch values, refuses any
# other proposal and puts the minor versions and the registry errors into
# the note for a human (#376)
updates: patch
limits: {propose: 3}
prompt: |
  Auslöser: Wochenblick auf Aktualisierungen. Unten stehen die Patch-Versionen, die du vorschlagen kannst. Schlage die vor, die es wert sind, mit propose (service, key, value genau wie unten) und einem Grund: was vorher lief und was die Patch-Version bringt.
  Zum Schluss note mit kind watch: was du vorgeschlagen hast und warum.
