# Backup integrity (#287): restic checks a sample of the repository and one
# service's path is restored into a scratch dir and compared (laib backup
# check, the canary restore); stale or red backups go into the note the
# morning report reads. #858: the sample ran only when the model called
# backup check; its script (run.py) calls it every week, no model.
description: Einmal pro Woche — die Sicherung prüfen und probeweise wiederherstellen; was nicht stimmt, steht im Morgenbericht.
trigger: {weekly: "So 05:00"}
tools: [backup, journal, note]
run: run.py
context: none
modell: nein     # the script alone: red, deviating and stale are rules; the morning report's model reads the note
output: note
prompt: |
  Wochenprobe der Sicherung: Der Ablauf prüft sie selbst, ohne Modell, und schreibt die Notiz; der Morgenbericht liest sie.
