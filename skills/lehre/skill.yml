# Lessons from solved incidents (#544, ADR 0023 amendment): once a day its
# script (run.py, #839) looks at the incident sessions (vorfall) whose proposal made its
# finding go away, as laib measured it, and proposes each as a lesson —
# lessons/<probe>-<service>.md in the state repo, with the finding, the
# cause the session saw and what fixed it. A lesson is class human: only
# the owner lets it in; then laib context carries it into every session.
# #861: the model condenses each lesson in one short question (cause, sign,
# fix, when not to apply it); no answer keeps the transcription. A finding
# with a lesson proposed once gets none again.
description: Einmal am Tag — aus einem gelösten Vorfall eine Lehre vorschlagen, die der Admin freigibt.
trigger: {daily: "${REPORT_AT}"}
tools: [propose, note]
run: run.py
context: none
modell: urteil   # the script picks what laib measured; the model condenses it, one short question (#861)
output: propose
lessons: vorfall
prompt: |
  Lehren aus gelösten Vorfällen: Der Ablauf schlägt sie selbst vor; das Modell verdichtet jede in vier Zeilen. Ein Mensch gibt jede frei oder nicht.
