# The log review (#550 point 6, #551): what a human did on the Kraftwerk
# — 48 hours of the journal's err lines, most of them INFO a container
# wrote to stderr, and among them a few real errors that came back every
# day. Its script does the reading (run.py, #839): every service's
# warnings and errors of the last 24 hours (laib logs --priority warning),
# a line's own level decides, else its words, so the journal's err is not
# trusted; lines become patterns with numbers, ids, paths and timestamps
# taken out, counted per unit, compared with the last review (the
# script's state, kept by the runner). The model sees only what is new
# (three times or more), recurring (seen in the last review too) or
# growing (at least doubled), each with an example line. Nothing of that:
# no model, no note. Daily, before the morning report, which then carries
# the note; a week of logs would not fit the line cap and a broken setting
# would wait up to seven days.
# #915: a line the container runtime wrote into the unit (pasta, conmon)
# is the runtime's, not the service's, and only counted; a shape the
# owner or a ticket answered as harmless (laib ignore --log, ignore.yml
# on main, read with laib state) is only counted, with its reason.
description: Jeden Morgen die Fehlerzeilen der Dienste nach Muster — wiederkehrende echte Fehler als Notiz oder Vorschlag, Rauschen nicht.
trigger: {daily: "06:30"}
tools: [status, logs, state, wish, note]
run: run.py
context: none
modell: urteil   # the script read the logs; the model judges the patterns
output: note
limits: {wish: 3}
prompt: |
  Auslöser: Protokoll-Durchsicht. Unten stehen die Fehlermuster der letzten 24 Stunden, die neu, wiederkehrend oder gewachsen sind. laib hat sie nach Inhalt gruppiert; Rauschen (normale Meldungen auf stderr) ist schon aussortiert und nur gezählt.
  Schreib eine note mit kind watch: je Muster eine Zeile mit Unit, Muster, Anzahl und der Beispielzeile, das Wichtigste zuerst, und was es für die Familie heißt, wenn die Zeile das hergibt. Erfinde keine Ursache.
  Braucht ein Muster einen Menschen (eine Einstellung im Template, kaputte Dateien), dann höchstens drei Vorschläge mit wish: text nennt Dienst und Muster, saw die Anzahl und die Beispielzeile. Du änderst nichts selbst.
